<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product | Prasun Store</title>

  <meta
    name="description"
    content="Shop quality products at Prasun Store."
  />

  <meta name="application-name" content="Prasun Store" />
  <meta name="apple-mobile-web-app-title" content="Prasun Store" />
  <meta name="theme-color" content="#111827" />

  <!-- ============================================================
       FAVICON
       ============================================================ -->

  <link
    rel="icon"
    href="/favicon.ico?v=2"
    type="image/x-icon"
    sizes="any"
  />

  <link
    rel="shortcut icon"
    href="/favicon.ico?v=2"
    type="image/x-icon"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png?v=2"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png?v=2"
  />

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png?v=2"
  />

  <link
    rel="manifest"
    href="/site.webmanifest?v=2"
  />

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #000000;
      --success: #15803d;
      --danger: #dc2626;
      --warning-bg: #fff7ed;
      --warning-border: #fed7aa;
      --warning-text: #9a3412;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.25);
      outline-offset: 2px;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* ============================================================
       HEADER
       ============================================================ */

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex: 0 1 auto;
    }

    .brand-text {
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .header-link:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .header-link:active {
      transform: translateY(1px);
    }

    .header-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       CART BADGE
       ============================================================ */

    .cart-badge {
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      margin-left: 1px;
      line-height: 1;
    }

    /* ============================================================
       PAGE
       ============================================================ */

    .page {
      padding: 30px 0 60px;
    }

    .breadcrumbs {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .breadcrumbs a {
      color: #374151;
    }

    .breadcrumbs a:hover {
      text-decoration: underline;
    }

    .breadcrumbs span {
      margin: 0 6px;
      color: #9ca3af;
    }

    .product-layout {
      display: grid;
      grid-template-columns:
        minmax(0, 1.05fr)
        minmax(0, 0.95fr);
      gap: 42px;
      align-items: start;
    }

    /* ============================================================
       CARDS
       ============================================================ */

    .gallery-card,
    .info-card,
    .description-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ============================================================
       GALLERY
       ============================================================ */

    .gallery-card {
      padding: 18px;
    }

    .main-image-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #f9fafb;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .gallery-thumbs {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .gallery-thumb {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 0;
      background: #fff;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .gallery-thumb:hover {
      border-color: #9ca3af;
    }

    .gallery-thumb.active {
      border: 2px solid var(--primary);
      box-shadow:
        0 0 0 1px
        rgba(17, 24, 39, 0.08);
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ============================================================
       PRODUCT INFO
       ============================================================ */

    .info-card {
      padding: 26px;
    }

    .product-title {
      margin: 0 0 14px;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.15;
      letter-spacing: -0.025em;
      overflow-wrap: anywhere;
    }

    .rating-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .stars {
      color: #f59e0b;
      letter-spacing: 1px;
      font-size: 17px;
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .stock {
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .stock.in-stock {
      color: var(--success);
    }

    .stock.out-of-stock {
      color: var(--danger);
    }

    /* ============================================================
       VARIANTS
       ============================================================ */

    .variants {
      margin-top: 24px;
    }

    .variant-group {
      margin-bottom: 22px;
    }

    .variant-title {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .variant-selected-text {
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
    }

    .variant-options {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .variant-option {
      position: relative;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .variant-option:hover {
      border-color: #111827;
    }

    .variant-option.selected {
      border: 2px solid var(--primary);
      box-shadow:
        0 0 0 2px
        rgba(17, 24, 39, 0.08);
    }

    .variant-option.disabled {
      opacity: 0.38;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .text-option {
      min-height: 42px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .swatch-option {
      width: 76px;
      min-height: 94px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      background: #fff;
    }

    .variant-swatch-image {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f4f6;
      display: block;
    }

    .variant-swatch-label {
      width: 100%;
      text-align: center;
      padding: 1px 2px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ============================================================
       QUANTITY
       ============================================================ */

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .quantity-label {
      font-size: 14px;
      font-weight: 800;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .quantity-control button {
      width: 40px;
      height: 40px;
      border: 0;
      background: #f9fafb;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: background 0.15s ease;
    }

    .quantity-control button:hover {
      background: #f3f4f6;
    }

    .quantity-control input {
      width: 52px;
      height: 40px;
      border: 0;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
      outline: none;
      font-weight: 700;
    }

    .quantity-control input::-webkit-outer-spin-button,
    .quantity-control input::-webkit-inner-spin-button {
      margin: 0;
    }

    /* ============================================================
       ACTIONS
       ============================================================ */

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      min-height: 50px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
      transition: 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f9fafb;
    }

    .notice {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
      font-size: 13px;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    /* ============================================================
       QUICK INFO
       ============================================================ */

    .quick-info {
      margin-top: 25px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: grid;
      gap: 12px;
    }

    .quick-info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
    }

    .quick-info-row span:first-child {
      color: var(--muted);
    }

    .quick-info-row span:last-child {
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
    }

    /* ============================================================
       DESCRIPTION
       ============================================================ */

    .description-card {
      margin-top: 36px;
      padding: 28px;
    }

    .description-title {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .description-content {
      color: #374151;
      font-size: 15px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .description-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto;
      border-radius: 10px;
    }

    .description-content table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
      display: block;
    }

    .description-content td,
    .description-content th {
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    /* ============================================================
       LOADING
       ============================================================ */

    .loading {
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    /* ============================================================
       ERROR
       ============================================================ */

    .error-box {
      margin: 30px auto;
      max-width: 700px;
      padding: 24px;
      background: #fff;
      border: 1px solid #fecaca;
      border-radius: 14px;
      color: #991b1b;
      text-align: center;
    }

    .error-box h2 {
      margin-top: 0;
    }

    .error-box .header-link {
      margin-top: 10px;
    }

    /* ============================================================
       TABLET
       ============================================================ */

    @media (max-width: 900px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 560px) {
      .container {
        width: min(100% - 20px, 1200px);
      }

      .header-inner {
        min-height: 62px;
        gap: 10px;
      }

      .brand {
        min-width: 0;
        flex: 1 1 auto;
        font-size: 18px;
      }

      .brand-text {
        max-width: 145px;
      }

      .header-actions {
        gap: 6px;
      }

      .header-link {
        min-height: 38px;
        padding: 0 9px;
        gap: 5px;
        font-size: 13px;
      }

      .header-icon {
        width: 17px;
        height: 17px;
      }

      .cart-badge {
        min-width: 19px;
        height: 19px;
        font-size: 10px;
        padding: 0 5px;
      }

      .page {
        padding-top: 22px;
      }

      .product-title {
        font-size: 27px;
      }

      .price {
        font-size: 28px;
      }

      .info-card {
        padding: 20px;
      }

      .gallery-card {
        padding: 12px;
      }

      .gallery-thumbs {
        grid-template-columns: repeat(5, 1fr);
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      .swatch-option {
        width: 70px;
        min-height: 89px;
      }

      .variant-swatch-image {
        width: 58px;
        height: 58px;
      }

      .description-card {
        padding: 20px;
      }
    }

    /* ============================================================
       VERY SMALL MOBILE
       ============================================================ */

    @media (max-width: 380px) {
      .header-inner {
        gap: 7px;
      }

      .brand {
        font-size: 17px;
      }

      .brand-text {
        max-width: 115px;
      }

      .header-actions {
        gap: 4px;
      }

      .header-link {
        padding: 0 7px;
        font-size: 12px;
      }

      .header-icon {
        width: 16px;
        height: 16px;
      }

      .cart-badge {
        min-width: 18px;
        height: 18px;
      }
    }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <a
      href="./index.html"
      class="brand"
      aria-label="Prasun Store home"
    >
      <span class="brand-text">Prasun Store</span>
    </a>

    <div class="header-actions">

      <a
        href="./index.html#products"
        class="header-link"
        aria-label="Shop products"
      >
        <svg
          class="header-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 6h16"></path>
          <path d="M6 6v12"></path>
          <path d="M18 6v12"></path>
          <path d="M4 18h16"></path>
          <path d="M8 10h8"></path>
          <path d="M8 14h5"></path>
        </svg>

        <span>Shop</span>
      </a>

      <a
        href="./cart.html"
        class="header-link"
        aria-label="Shopping cart"
      >
        <svg
          class="header-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H6"></path>
          <circle cx="10" cy="20" r="1.3"></circle>
          <circle cx="18" cy="20" r="1.3"></circle>
        </svg>

        <span>Cart</span>

        <span
          id="cartBadge"
          class="cart-badge"
        >0</span>
      </a>

    </div>
  </div>
</header>


<main class="page">

  <div class="container">

    <div class="breadcrumbs">
      <a href="./index.html">Home</a>
      <span>/</span>
      <span>Product</span>
    </div>


    <div
      id="loading"
      class="loading"
    >
      Loading product...
    </div>


    <div
      id="errorBox"
      class="error-box hidden"
    >
      <h2>Unable to load product</h2>

      <p id="errorMessage">
        Something went wrong.
      </p>

      <a
        href="./index.html#products"
        class="header-link"
      >
        Back to Store
      </a>
    </div>


    <section
      id="productSection"
      class="product-layout hidden"
    >

      <div class="gallery-card">

        <div class="main-image-wrap">

          <img
            id="mainImage"
            class="main-image"
            src=""
            alt="Product image"
          />

        </div>

        <div
          id="galleryThumbs"
          class="gallery-thumbs"
        ></div>

      </div>


      <div class="info-card">

        <h1
          id="productTitle"
          class="product-title"
        >
          Product
        </h1>


        <div class="rating-row">

          <span
            id="ratingStars"
            class="stars"
          >☆☆☆☆☆</span>

          <span id="ratingText">
            No ratings
          </span>

        </div>


        <div
          id="productPrice"
          class="price"
        >
          $0.00
        </div>


        <div
          id="stockText"
          class="stock in-stock"
        >
          Available
        </div>


        <div
          id="variantsContainer"
          class="variants hidden"
        ></div>


        <div class="quantity-row">

          <span class="quantity-label">
            Quantity
          </span>

          <div class="quantity-control">

            <button
              type="button"
              id="quantityMinus"
              aria-label="Decrease quantity"
            >−</button>

            <input
              id="quantityInput"
              type="number"
              min="1"
              max="999"
              value="1"
              aria-label="Quantity"
            />

            <button
              type="button"
              id="quantityPlus"
              aria-label="Increase quantity"
            >+</button>

          </div>

        </div>


        <div class="action-buttons">

          <button
            type="button"
            id="addToCartBtn"
            class="btn btn-secondary"
          >
            Add to Cart
          </button>

          <button
            type="button"
            id="buyNowBtn"
            class="btn btn-primary"
          >
            Buy Now
          </button>

        </div>


        <div
          id="selectionNotice"
          class="notice hidden"
        ></div>


        <div class="quick-info">

          <div class="quick-info-row">
            <span>SKU</span>
            <span id="productSku">—</span>
          </div>

          <div class="quick-info-row">
            <span>Availability</span>
            <span id="productAvailability">—</span>
          </div>

          <div class="quick-info-row">
            <span>Ships to</span>
            <span id="productShipsTo">Worldwide</span>
          </div>

        </div>

      </div>

    </section>


    <section
      id="descriptionCard"
      class="description-card hidden"
    >

      <h2 class="description-title">
        Product Description
      </h2>

      <div
        id="descriptionContent"
        class="description-content"
      ></div>

    </section>

  </div>

</main>


<script>
"use strict";

/* ============================================================
   CONFIGURATION
   ============================================================ */

const API_BASE =
  "https://prasun-store.prasun301.workers.dev";

const CART_STORAGE_KEY =
  "prasun_cart";

const LEGACY_CART_KEY =
  "cart";

const BUY_NOW_KEY =
  "buyNowItem";


/* ============================================================
   STATE
   ============================================================ */

let product = null;
let normalizedSkus = [];
let selectedProperties = {};
let selectedSku = null;
let quantity = 1;
let galleryImages = [];
let currentImageIndex = 0;


/* ============================================================
   DOM
   ============================================================ */

const loadingEl =
  document.getElementById("loading");

const errorBoxEl =
  document.getElementById("errorBox");

const errorMessageEl =
  document.getElementById("errorMessage");

const productSectionEl =
  document.getElementById("productSection");

const mainImageEl =
  document.getElementById("mainImage");

const galleryThumbsEl =
  document.getElementById("galleryThumbs");

/* ============================================================
   BASIC HELPERS
   ============================================================ */

function firstNonEmpty(...values) {

  for (const value of values) {

    if (
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ) {
      return value;
    }

  }

  return "";
}


function toNumber(
  value,
  fallback = 0
) {

  if (
    typeof value === "number" &&
    Number.isFinite(value)
  ) {
    return value;
  }

  if (
    typeof value === "string"
  ) {

    const cleaned =
      value
        .replace(/,/g, "")
        .replace(/[^\d.-]/g, "")
        .trim();

    if (!cleaned) {
      return fallback;
    }

    const parsed =
      Number(cleaned);

    return Number.isFinite(parsed)
      ? parsed
      : fallback;

  }

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : fallback;

}


function uniqueArray(array) {

  return [
    ...new Set(
      array.filter(Boolean)
    )
  ];

}


function formatPrice(
  value,
  currency = "USD"
) {

  const amount =
    toNumber(
      value,
      0
    );

  const normalizedCurrency =
    String(
      currency || "USD"
    ).toUpperCase();

  try {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency:
          normalizedCurrency
      }
    ).format(amount);

  } catch {

    return `$${amount.toFixed(2)}`;

  }

}


function safeString(value) {

  if (
    value === undefined ||
    value === null
  ) {
    return "";
  }

  return String(value).trim();

}


/* ============================================================
   PRODUCT ID
   ============================================================ */

function getProductId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return safeString(
    firstNonEmpty(
      params.get("id"),
      params.get("product_id"),
      params.get("productId"),
      params.get("item_id"),
      params.get("itemId")
    )
  );

}


/* ============================================================
   DEEP PRODUCT RESPONSE EXTRACTION
   ============================================================ */

function extractProductObject(raw) {

  if (!raw) {
    return null;
  }

  if (
    typeof raw !== "object"
  ) {
    return null;
  }

  const candidates = [

    raw.product,

    raw.productData,

    raw.product_data,

    raw.item,

    raw.data?.product,

    raw.data?.productData,

    raw.data?.product_data,

    raw.data?.item,

    raw.result?.product,

    raw.result?.productData,

    raw.result?.product_data,

    raw.result?.item,

    raw.data,

    raw.result,

    raw

  ];

  for (
    const candidate of candidates
  ) {

    if (
      candidate &&
      typeof candidate === "object" &&
      !Array.isArray(candidate)
    ) {

      const hasProductFields =
        candidate.id ||
        candidate.product_id ||
        candidate.productId ||
        candidate.title ||
        candidate.name ||
        candidate.subject ||
        candidate.skus ||
        candidate.images;

      if (
        hasProductFields
      ) {
        return candidate;
      }

    }

  }

  return null;

}


/* ============================================================
   NORMALIZE PRODUCT
   ============================================================ */

function normalizeProduct(raw) {

  const data =
    extractProductObject(
      raw
    );

  if (!data) {
    return null;
  }

  const title =
    firstNonEmpty(
      data.title,
      data.product_title,
      data.productTitle,
      data.subject,
      data.name,
      data.item_title,
      data.itemTitle,
      "Product"
    );


  const price =
    firstNonEmpty(
      data.price,
      data.sale_price,
      data.salePrice,
      data.current_price,
      data.currentPrice,
      data.min_price,
      data.minPrice,
      data.offer_price,
      data.offerPrice,
      data.cost,
      0
    );


  const currency =
    firstNonEmpty(
      data.currency,
      data.target_currency,
      data.targetCurrency,
      data.price_currency,
      data.priceCurrency,
      "USD"
    );


  const rating =
    firstNonEmpty(
      data.rating,
      data.average_rating,
      data.averageRating,
      data.star_rating,
      data.starRating,
      data.score
    );


  const reviewCount =
    firstNonEmpty(
      data.review_count,
      data.reviewCount,
      data.rating_count,
      data.ratingCount,
      data.reviews,
      data.review_num,
      data.reviewNum
    );


  const stock =
    firstNonEmpty(
      data.stock,
      data.inventory,
      data.quantity,
      data.total_stock,
      data.totalStock,
      data.available_quantity,
      data.availableQuantity
    );


  const sku =
    firstNonEmpty(
      data.sku,
      data.product_sku,
      data.productSku,
      data.item_sku,
      data.itemSku,
      data.sku_code,
      data.skuCode
    );


  const description =
    firstNonEmpty(
      data.description_html,
      data.descriptionHtml,
      data.description,
      data.product_description,
      data.productDescription,
      data.detail,
      data.details,
      data.content,
      ""
    );


  let images =
    firstNonEmpty(
      data.images,
      data.image_urls,
      data.imageUrls,
      data.gallery,
      data.gallery_images,
      data.galleryImages,
      data.image_list,
      data.imageList,
      data.photos
    );


  if (
    !Array.isArray(images)
  ) {

    images = [

      firstNonEmpty(
        data.image,
        data.image_url,
        data.imageUrl,
        data.main_image,
        data.mainImage,
        data.thumbnail,
        data.thumb
      )

    ].filter(Boolean);

  }


  const skus =
    firstNonEmpty(
      data.skus,
      data.sku_list,
      data.skuList,
      data.variants,
      data.variant_list,
      data.variantList,
      data.sku_array,
      data.skuArray,
      []
    );


  return {

    ...data,

    id:
      String(
        firstNonEmpty(
          data.id,
          data.product_id,
          data.productId,
          data.item_id,
          data.itemId,
          getProductId()
        )
      ),

    title:
      String(title),

    price:
      price !== ""
        ? toNumber(price, 0)
        : 0,

    currency:
      String(
        currency || "USD"
      ).toUpperCase(),

    rating:
      rating !== ""
        ? toNumber(rating, 0)
        : 0,

    review_count:
      reviewCount !== ""
        ? toNumber(
            reviewCount,
            0
          )
        : 0,

    stock:
      stock !== ""
        ? toNumber(
            stock,
            0
          )
        : "",

    sku:
      String(
        sku || ""
      ),

    description:
      description || "",

    images,

    skus

  };

}

/* ============================================================
   NORMALIZE SKU PROPERTY
   ============================================================ */

function normalizeSkuProperty(
  property
) {

  if (!property) {
    return null;
  }

  const groupId =
    getGroupId(
      property
    );

  const valueId =
    getValueId(
      property
    );

  const groupName =
    getGroupName(
      property
    );

  const valueName =
    getValueName(
      property
    );

  const image =
    getPropertyImage(
      property
    );


  if (
    !groupId &&
    !valueId &&
    !groupName &&
    !valueName
  ) {

    return null;

  }


  return {

    group_id:
      String(
        groupId ||
        groupName ||
        "group"
      ),

    value_id:
      String(
        valueId ||
        valueName ||
        ""
      ),

    group_name:
      String(
        groupName ||
        "Option"
      ),

    groupId:
      String(
        groupId ||
        groupName ||
        "group"
      ),

    valueId:
      String(
        valueId ||
        valueName ||
        ""
      ),

    name:
      String(
        groupName ||
        "Option"
      ),

    display:
      String(
        valueName ||
        valueId ||
        ""
      ),

    value_name:
      String(
        valueName ||
        valueId ||
        ""
      ),

    property_value_definition_name:
      String(
        valueName ||
        valueId ||
        ""
      ),

    image:
      image || "",

    sku_image:
      image || ""

  };

}


/* ============================================================
   EXTRACT SKU PROPERTIES
   ============================================================ */

function extractSkuProperties(
  sku
) {

  if (!sku) {
    return [];
  }

  const candidates = [];

  const sources = [

    sku.properties,

    sku.propertys,

    sku.property_list,

    sku.propertyList,

    sku.sku_properties,

    sku.skuProperties,

    sku.normalized_properties,

    sku.normalizedProperties,

    sku.selected_properties,

    sku.selectedProperties,

    sku.variant_properties,

    sku.variantProperties

  ];


  for (
    const source of sources
  ) {

    if (
      Array.isArray(source)
    ) {

      candidates.push(
        ...source
      );

    }


    if (
      source &&
      typeof source === "object" &&
      !Array.isArray(source)
    ) {

      const nestedArrays = [

        source.ae_sku_property_d_t_o,

        source.aeop_s_k_u_property,

        source.properties,

        source.property_list,

        source.propertyList

      ];


      for (
        const nested of nestedArrays
      ) {

        if (
          Array.isArray(nested)
        ) {

          candidates.push(
            ...nested
          );

        }

      }


      for (
        const [
          key,
          value
        ] of Object.entries(source)
      ) {

        if (
          value &&
          typeof value === "object" &&
          !Array.isArray(value)
        ) {

          const normalized =
            normalizeSkuProperty({
              group_id:
                key,
              group_name:
                key,
              ...value
            });

          if (
            normalized
          ) {

            candidates.push(
              normalized
            );

          }

        }

      }

    }

  }


  const result = [];

  const seen =
    new Set();


  for (
    const property of candidates
  ) {

    const normalized =
      normalizeSkuProperty(
        property
      );


    if (!normalized) {
      continue;
    }


    const key =
      `${normalized.group_id}::${normalized.value_id}`;


    if (
      seen.has(key)
    ) {
      continue;
    }


    seen.add(key);

    result.push(
      normalized
    );

  }


  return result;

}


/* ============================================================
   NORMALIZE SKUS
   ============================================================ */

function normalizeSkus(
  rawSkus
) {

  let list =
    rawSkus;


  if (
    list &&
    !Array.isArray(list) &&
    typeof list === "object"
  ) {

    list =
      firstNonEmpty(

        list.sku,

        list.skus,

        list.sku_list,

        list.skuList,

        list.variants,

        list.variant_list,

        list.variantList

      );


    if (
      !Array.isArray(list)
    ) {

      list =
        [];

    }

  }


  if (
    !Array.isArray(list)
  ) {

    return [];

  }


  return list.map(
    (
      sku,
      index
    ) => {

      const properties =
        extractSkuProperties(
          sku
        );


      const price =
        firstNonEmpty(

          sku.price,

          sku.sale_price,

          sku.salePrice,

          sku.current_price,

          sku.currentPrice,

          sku.offer_price,

          sku.offerPrice,

          sku.sku_price,

          sku.skuPrice,

          sku.cost

        );


      const stock =
        firstNonEmpty(

          sku.stock,

          sku.inventory,

          sku.quantity,

          sku.available_quantity,

          sku.availableQuantity,

          sku.sku_stock,

          sku.skuStock

        );


      const skuCode =
        firstNonEmpty(

          sku.sku,

          sku.sku_code,

          sku.skuCode,

          sku.sku_id,

          sku.skuId,

          sku.id,

          `sku-${index + 1}`

        );


      const image =
        firstNonEmpty(

          sku.image,

          sku.image_url,

          sku.imageUrl,

          sku.sku_image,

          sku.skuImage,

          sku.img,

          sku.thumbnail,

          sku.thumb

        );


      return {

        ...sku,

        index,

        sku:
          String(
            skuCode
          ),

        price:
          price !== ""
            ? toNumber(
                price,
                0
              )
            : null,

        stock:
          stock !== ""
            ? toNumber(
                stock,
                0
              )
            : null,

        image:
          image || "",

        properties,

        normalized_properties:
          properties

      };

    }
  );

}


/* ============================================================
   VARIANT LABEL HELPERS
   ============================================================ */

function isMeaninglessVariantCode(
  value
) {

  if (
    value === undefined ||
    value === null
  ) {

    return true;

  }


  const text =
    String(
      value
    ).trim();


  if (!text) {
    return true;
  }


  const patterns = [

    /^T\d{2,}$/i,

    /^SKU[\s_-]?\d+$/i,

    /^COLOR[\s_-]?\d+$/i,

    /^COLOUR[\s_-]?\d+$/i,

    /^OPTION[\s_-]?\d+$/i,

    /^VALUE[\s_-]?\d+$/i,

    /^VARIANT[\s_-]?\d+$/i,

    /^PROP[\s_-]?\d+$/i,

    /^STYLE[\s_-]?\d+$/i

  ];


  return patterns.some(
    pattern =>
      pattern.test(
        text
      )
  );

}


function isMeaningfulVariantName(
  value
) {

  return (
    Boolean(value) &&
    !isMeaninglessVariantCode(
      value
    )
  );

}


function isColorGroupName(
  name
) {

  const text =
    String(
      name || ""
    )
      .trim()
      .toLowerCase();


  return [

    "color",

    "colour",

    "colors",

    "colours",

    "pattern",

    "colourway"

  ].some(
    keyword =>
      text === keyword ||
      text.includes(keyword)
  );

}


function shouldUseImageSwatches(
  group
) {

  if (!group) {
    return false;
  }


  if (
    !isColorGroupName(
      group.name
    )
  ) {

    return false;

  }


  const images =
    group.values.filter(
      value =>
        Boolean(
          value.image
        )
    );


  return (
    images.length >= 2
  );

}


/* ============================================================
   BUILD VARIANT GROUPS
   ============================================================ */

function buildVariantGroups(
  skus
) {

  const groups =
    new Map();


  for (
    const sku of skus
  ) {

    const properties =
      sku.properties ||
      sku.normalized_properties ||
      [];


    for (
      const property of properties
    ) {

      const groupId =
        String(
          firstNonEmpty(

            property.group_id,

            property.groupId,

            property.property_id,

            property.propertyId,

            property.sku_property_id,

            property.skuPropertyId,

            property.group_name,

            property.groupName

          )
        );


      if (!groupId) {
        continue;
      }


      const groupName =
        firstNonEmpty(

          property.group_name,

          property.groupName,

          property.property_name,

          property.propertyName,

          property.sku_property_name,

          property.skuPropertyName,

          property.name,

          "Option"

        );


      if (
        !groups.has(
          groupId
        )
      ) {

        groups.set(
          groupId,
          {
            id:
              groupId,

            name:
              String(
                groupName
              ),

            values:
              []
          }
        );

      }


      const group =
        groups.get(
          groupId
        );


      const valueId =
        String(
          firstNonEmpty(

            property.value_id,

            property.valueId,

            property.property_value_id,

            property.propertyValueId,

            property.sku_property_value_id,

            property.skuPropertyValueId,

            property.value_name,

            property.valueName

          )
        );


      if (!valueId) {
        continue;
      }


      const valueName =
        firstNonEmpty(

          property.value_name,

          property.valueName,

          property.property_value_name,

          property.propertyValueName,

          property.property_value_definition_name,

          property.propertyValueDefinitionName,

          property.display,

          property.value,

          valueId

        );


      const image =
        firstNonEmpty(

          property.image,

          property.image_url,

          property.imageUrl,

          property.sku_image,

          property.skuImage,

          sku.image

        );


      const existing =
        group.values.find(
          value =>
            String(
              value.id
            ) ===
            String(
              valueId
            )
        );


      if (!existing) {

        group.values.push({

          id:
            valueId,

          name:
            String(
              valueName ||
              valueId
            ),

          image:
            image || ""

        });

      } else if (
        !existing.image &&
        image
      ) {

        existing.image =
          image;

      }

    }

  }


  return [
    ...groups.values()
  ];

}


/* ============================================================
   RENDER VARIANTS
   ============================================================ */

function renderVariants() {

  variantsContainerEl.innerHTML =
    "";


  const groups =
    buildVariantGroups(
      normalizedSkus
    );


  if (!groups.length) {

    variantsContainerEl.classList.add(
      "hidden"
    );

    return;

  }


  variantsContainerEl.classList.remove(
    "hidden"
  );


  for (
    const group of groups
  ) {

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "variant-group";


    const titleRow =
      document.createElement(
        "div"
      );

    titleRow.className =
      "variant-title";


    const title =
      document.createElement(
        "span"
      );

    title.textContent =
      group.name;


    const selectedLabel =
      document.createElement(
        "span"
      );

    selectedLabel.className =
      "variant-selected-text";

    selectedLabel.dataset.groupId =
      String(
        group.id
      );

    selectedLabel.textContent =
      "Select";


    titleRow.appendChild(
      title
    );

    titleRow.appendChild(
      selectedLabel
    );


    const options =
      document.createElement(
        "div"
      );

    options.className =
      "variant-options";


    const useSwatches =
      shouldUseImageSwatches(
        group
      );


    group.values.forEach(
      (
        value,
        index
      ) => {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "variant-option";

        button.dataset.groupId =
          String(
            group.id
          );

        button.dataset.valueId =
          String(
            value.id
          );


        const meaningful =
          isMeaningfulVariantName(
            value.name
          );


        const label =
          meaningful
            ? String(
                value.name
              )
            : (
                isColorGroupName(
                  group.name
                )
                  ? `Color ${index + 1}`
                  : `Option ${index + 1}`
              );


        if (
          useSwatches &&
          value.image
        ) {

          button.classList.add(
            "swatch-option"
          );


          const image =
            document.createElement(
              "img"
            );

          image.className =
            "variant-swatch-image";

          image.src =
            value.image;

          image.alt =
            label;

          image.loading =
            "lazy";

          image.referrerPolicy =
            "no-referrer";


          image.onerror =
            () => {

              image.style.display =
                "none";

            };


          button.appendChild(
            image
          );


          if (
            meaningful
          ) {

            const text =
              document.createElement(
                "span"
              );

            text.className =
              "variant-swatch-label";

            text.textContent =
              label;

            button.appendChild(
              text
            );

          }


          button.title =
            label;

          button.setAttribute(
            "aria-label",
            label
          );

        } else {

          button.classList.add(
            "text-option"
          );

          button.textContent =
            label;

        }


        button.addEventListener(
          "click",
          () => {

            if (
              button.classList.contains(
                "disabled"
              )
            ) {

              return;

            }


            selectedProperties[
              String(
                group.id
              )
            ] =
              String(
                value.id
              );


            selectionNoticeEl.classList.add(
              "hidden"
            );


            updateVariantUI();

            updateSelectedSku();

          }
        );


        options.appendChild(
          button
        );

      }
    );


    wrapper.appendChild(
      titleRow
    );

    wrapper.appendChild(
      options
    );

    variantsContainerEl.appendChild(
      wrapper
    );

  }


  updateVariantUI();

}


/* ============================================================
   SKU PROPERTY MATCH
   ============================================================ */

function propertyMatches(
  property,
  groupId,
  valueId
) {

  if (!property) {
    return false;
  }


  const propertyGroup =
    String(
      firstNonEmpty(

        property.group_id,

        property.groupId,

        property.property_id,

        property.propertyId,

        property.sku_property_id,

        property.skuPropertyId

      )
    );


  const propertyValue =
    String(
      firstNonEmpty(

        property.value_id,

        property.valueId,

        property.property_value_id,

        property.propertyValueId,

        property.sku_property_value_id,

        property.skuPropertyValueId

      )
    );


  return (
    propertyGroup ===
      String(groupId) &&
    propertyValue ===
      String(valueId)
  );

}


/* ============================================================
   CHECK SKU AVAILABILITY
   ============================================================ */

function hasAvailableSkuForSelection(
  groupId,
  valueId
) {

  return normalizedSkus.some(
    sku => {

      if (
        sku.stock !== null &&
        sku.stock <= 0
      ) {

        return false;

      }


      const properties =
        sku.properties ||
        sku.normalized_properties ||
        [];


      return properties.some(
        property =>
          propertyMatches(
            property,
            groupId,
            valueId
          )
      );

    }
  );

}


/* ============================================================
   UPDATE VARIANT UI
   ============================================================ */

function updateVariantUI() {

  document
    .querySelectorAll(
      ".variant-option"
    )
    .forEach(
      button => {

        const groupId =
          String(
            button.dataset.groupId
          );

        const valueId =
          String(
            button.dataset.valueId
          );


        const isSelected =
          String(
            selectedProperties[
              groupId
            ] || ""
          ) ===
          valueId;


        button.classList.toggle(
          "selected",
          isSelected
        );


        const available =
          hasAvailableSkuForSelection(
            groupId,
            valueId
          );


        button.classList.toggle(
          "disabled",
          !available &&
          !isSelected
        );

      }
    );


  const groups =
    buildVariantGroups(
      normalizedSkus
    );


  groups.forEach(
    group => {

      const label =
        document.querySelector(
          `.variant-selected-text[data-group-id="${CSS.escape(
            String(
              group.id
            )
          )}"]`
        );


      if (!label) {
        return;
      }


      const selectedId =
        selectedProperties[
          String(
            group.id
          )
        ];


      if (!selectedId) {

        label.textContent =
          "Select";

        return;

      }


      const value =
        group.values.find(
          item =>
            String(
              item.id
            ) ===
            String(
              selectedId
            )
        );


      if (
        value &&
        isMeaningfulVariantName(
          value.name
        )
      ) {

        label.textContent =
          value.name;

      } else {

        label.textContent =
          "Selected";

      }

    }
  );

}


/* ============================================================
   SKU MATCHING
   ============================================================ */

function skuMatchesSelection(
  sku,
  selection
) {

  const properties =
    sku.properties ||
    sku.normalized_properties ||
    [];


  for (
    const [
      groupId,
      valueId
    ] of Object.entries(
      selection
    )
  ) {

    const matched =
      properties.some(
        property =>
          propertyMatches(
            property,
            groupId,
            valueId
          )
      );


    if (!matched) {

      return false;

    }

  }


  return true;

}


function findExactSku() {

  const groups =
    buildVariantGroups(
      normalizedSkus
    );


  if (
    groups.length === 0
  ) {

    return null;

  }


  const requiredGroupCount =
    groups.length;


  const selectedCount =
    Object.keys(
      selectedProperties
    ).length;


  if (
    selectedCount !==
    requiredGroupCount
  ) {

    return null;

  }


  return normalizedSkus.find(
    sku => {

      if (
        sku.stock !== null &&
        sku.stock <= 0
      ) {

        return false;

      }


      if (
        !skuMatchesSelection(
          sku,
          selectedProperties
        )
      ) {

        return false;

      }


      const propertyCount =
        (
          sku.properties ||
          sku.normalized_properties ||
          []
        ).length;


      return (
        propertyCount >=
        requiredGroupCount
      );

    }
  ) || null;

}


function findBestMatchingSku() {

  if (
    !normalizedSkus.length
  ) {

    return null;

  }


  const exact =
    findExactSku();


  if (exact) {
    return exact;
  }


  const available =
    normalizedSkus.filter(
      sku => {

        if (
          sku.stock !== null &&
          sku.stock <= 0
        ) {

          return false;

        }


        return skuMatchesSelection(
          sku,
          selectedProperties
        );

      }
    );


  return available.length
    ? available[0]
    : null;

}


/* ============================================================
   UPDATE SELECTED SKU
   ============================================================ */

function updateSelectedSku() {

  selectedSku =
    findBestMatchingSku();


  if (
    !selectedSku
  ) {

    if (
      !normalizedSkus.length
    ) {

      productPriceEl.textContent =
        formatPrice(
          product.price,
          product.currency
        );

    }

    return;

  }


  const skuPrice =
    selectedSku.price;


  if (
    skuPrice !== null &&
    Number.isFinite(
      skuPrice
    )
  ) {

    productPriceEl.textContent =
      formatPrice(
        skuPrice,
        product.currency
      );

  } else {

    productPriceEl.textContent =
      formatPrice(
        product.price,
        product.currency
      );

  }


  if (
    selectedSku.stock !== null
  ) {

    if (
      selectedSku.stock > 0
    ) {

      stockTextEl.textContent =
        `${selectedSku.stock} available`;

      stockTextEl.className =
        "stock in-stock";

      addToCartBtnEl.disabled =
        false;

      buyNowBtnEl.disabled =
        false;

    } else {

      stockTextEl.textContent =
        "Out of stock";

      stockTextEl.className =
        "stock out-of-stock";

      addToCartBtnEl.disabled =
        true;

      buyNowBtnEl.disabled =
        true;

    }

  }


  if (
    selectedSku.image
  ) {

    const existingIndex =
      galleryImages.indexOf(
        selectedSku.image
      );


    if (
      existingIndex >= 0
    ) {

      setMainImage(
        existingIndex
      );

    } else {

      mainImageEl.src =
        selectedSku.image;

    }

  }


  if (
    selectedSku.sku
  ) {

    productSkuEl.textContent =
      selectedSku.sku;

  }

}


/* ============================================================
   GALLERY
   ============================================================ */

function normalizeImages(
  rawImages
) {

  const images = [];


  if (
    Array.isArray(
      rawImages
    )
  ) {

    for (
      const item of rawImages
    ) {

      if (
        typeof item === "string"
      ) {

        const value =
          item.trim();

        if (
          value
        ) {

          images.push(
            value
          );

        }

        continue;

      }


      if (
        item &&
        typeof item === "object"
      ) {

        const url =
          firstNonEmpty(

            item.url,

            item.image_url,

            item.imageUrl,

            item.src,

            item.image,

            item.main_image,

            item.mainImage,

            item.thumbnail,

            item.thumb

          );


        if (url) {

          images.push(
            String(url)
          );

        }

      }

    }

  }


  return uniqueArray(
    images
  );

}


function setMainImage(
  index
) {

  if (
    !galleryImages.length
  ) {

    return;

  }


  currentImageIndex =
    Math.max(
      0,
      Math.min(
        index,
        galleryImages.length - 1
      )
    );


  const image =
    galleryImages[
      currentImageIndex
    ];


  mainImageEl.src =
    image;


  mainImageEl.onerror =
    () => {

      mainImageEl.onerror =
        null;

      mainImageEl.src =
        "https://via.placeholder.com/800?text=Product";

    };


  mainImageEl.alt =
    `${product.title} image ${currentImageIndex + 1}`;


  galleryThumbsEl
    .querySelectorAll(
      ".gallery-thumb"
    )
    .forEach(
      (
        thumb,
        thumbIndex
      ) => {

        thumb.classList.toggle(
          "active",
          thumbIndex ===
            currentImageIndex
        );

      }
    );

}


function renderGallery() {

  galleryThumbsEl.innerHTML =
    "";


  if (
    !galleryImages.length
  ) {

    mainImageEl.src =
      "https://via.placeholder.com/800?text=Product";

    mainImageEl.alt =
      "Product image unavailable";

    return;

  }


  galleryImages.forEach(
    (
      image,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "gallery-thumb";

      button.setAttribute(
        "aria-label",
        `View product image ${index + 1}`
      );


      const img =
        document.createElement(
          "img"
        );

      img.src =
        image;

      img.alt =
        `${product.title} image ${index + 1}`;

      img.loading =
        "lazy";

      img.referrerPolicy =
        "no-referrer";


      img.onerror =
        () => {

          button.style.display =
            "none";

        };


      button.appendChild(
        img
      );


      button.addEventListener(
        "click",
        () => {

          setMainImage(
            index
          );

        }
      );


      galleryThumbsEl.appendChild(
        button
      );

    }
  );


  setMainImage(0);

}


/* ============================================================
   RATING
   ============================================================ */

function renderRating() {

  const rating =
    toNumber(
      product.rating,
      0
    );


  if (
    rating <= 0
  ) {

    ratingStarsEl.textContent =
      "☆☆☆☆☆";

    ratingTextEl.textContent =
      "No ratings";

    return;

  }


  const rounded =
    Math.round(
      Math.min(
        5,
        Math.max(
          0,
          rating
        )
      )
    );


  ratingStarsEl.textContent =
    "★".repeat(
      rounded
    ) +
    "☆".repeat(
      5 - rounded
    );


  const reviewCount =
    toNumber(
      product.review_count,
      0
    );


  ratingTextEl.textContent =
    reviewCount > 0
      ? `${rating.toFixed(1)} (${reviewCount.toLocaleString()} reviews)`
      : rating.toFixed(1);

}


/* ============================================================
   DESCRIPTION
   ============================================================ */

function sanitizeDescriptionHtml(
  html
) {

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      String(html),
      "text/html"
    );


  doc
    .querySelectorAll(
      "script, iframe, object, embed, form, link, meta, style"
    )
    .forEach(
      element =>
        element.remove()
    );


  doc
    .querySelectorAll("*")
    .forEach(
      element => {

        [
          ...element.attributes
        ].forEach(
          attribute => {

            const name =
              attribute.name.toLowerCase();

            const value =
              attribute.value || "";


            if (
              name.startsWith(
                "on"
              )
            ) {

              element.removeAttribute(
                attribute.name
              );

              return;

            }


            if (
              (
                name === "href" ||
                name === "src" ||
                name === "xlink:href"
              ) &&
              /^\s*(javascript|vbscript|data):/i.test(
                value
              )
            ) {

              element.removeAttribute(
                attribute.name
              );

            }

          }
        );

      }
    );


  return doc.body.innerHTML;

}


function renderDescription() {

  if (
    !product.description
  ) {

    descriptionCardEl.classList.add(
      "hidden"
    );

    descriptionContentEl.innerHTML =
      "";

    return;

  }


  const description =
    String(
      product.description
    );


  if (
    /<([a-z][\s\S]*?)>/i.test(
      description
    )
  ) {

    const sanitized =
      sanitizeDescriptionHtml(
        description
      );


    descriptionContentEl.innerHTML =
      sanitized;


    if (
      !descriptionContentEl.textContent.trim() &&
      !descriptionContentEl.querySelector("img, table")
    ) {

      descriptionContentEl.textContent =
        description;

    }

  } else {

    descriptionContentEl.textContent =
      description;

  }


  descriptionCardEl.classList.remove(
    "hidden"
  );

}


/* ============================================================
   RENDER PRODUCT
   ============================================================ */

function renderProduct() {

  if (!product) {
    return;
  }


  productTitleEl.textContent =
    product.title;


  document.title =
    `${product.title} | Prasun Store`;


  productPriceEl.textContent =
    formatPrice(
      product.price,
      product.currency
    );


  const hasStockValue =
    product.stock !== "" &&
    product.stock !== null &&
    product.stock !== undefined;


  const stock =
    hasStockValue
      ? toNumber(
          product.stock,
          0
        )
      : null;


  if (
    stock === null
  ) {

    stockTextEl.textContent =
      "Available";

    stockTextEl.className =
      "stock in-stock";

    productAvailabilityEl.textContent =
      "Available";

    addToCartBtnEl.disabled =
      false;

    buyNowBtnEl.disabled =
      false;

  } else if (
    stock > 0
  ) {

    stockTextEl.textContent =
      `${stock} available`;

    stockTextEl.className =
      "stock in-stock";

    productAvailabilityEl.textContent =
      "In stock";

    addToCartBtnEl.disabled =
      false;

    buyNowBtnEl.disabled =
      false;

  } else {

    stockTextEl.textContent =
      "Out of stock";

    stockTextEl.className =
      "stock out-of-stock";

    productAvailabilityEl.textContent =
      "Out of stock";

    addToCartBtnEl.disabled =
      true;

    buyNowBtnEl.disabled =
      true;

  }


  productSkuEl.textContent =
    product.sku ||
    "—";


  galleryImages =
    normalizeImages(
      product.images
    );


  normalizedSkus.forEach(
    sku => {

      if (
        sku.image
      ) {

        galleryImages.push(
          sku.image
        );

      }

    }
  );


  galleryImages =
    uniqueArray(
      galleryImages
    );


  renderGallery();

  renderRating();

  renderDescription();

  renderVariants();

  updateCartBadge();


  productShipsToEl.textContent =
    firstNonEmpty(

      product.shipping_country,

      product.shippingCountry,

      product.destination,

      product.ships_to,

      product.shipsTo,

      "Worldwide"

    );

}


/* ============================================================
   CART
   ============================================================ */

function readCart() {

  try {

    const currentRaw =
      localStorage.getItem(
        CART_STORAGE_KEY
      );


    if (currentRaw) {

      const current =
        JSON.parse(
          currentRaw
        );


      if (
        Array.isArray(
          current
        )
      ) {

        return current;

      }

    }


    const legacyRaw =
      localStorage.getItem(
        LEGACY_CART_KEY
      );


    if (legacyRaw) {

      const legacy =
        JSON.parse(
          legacyRaw
        );


      if (
        Array.isArray(
          legacy
        )
      ) {

        localStorage.setItem(
          CART_STORAGE_KEY,
          JSON.stringify(
            legacy
          )
        );


        return legacy;

      }

    }

  } catch (error) {

    console.warn(
      "Unable to read cart:",
      error
    );

  }


  return [];

}


function saveCart(
  cart
) {

  const data =
    JSON.stringify(
      cart
    );


  try {

    localStorage.setItem(
      CART_STORAGE_KEY,
      data
    );

    localStorage.setItem(
      LEGACY_CART_KEY,
      data
    );

  } catch (error) {

    console.error(
      "Unable to save cart:",
      error
    );

    throw new Error(
      "Your browser could not save the cart."
    );

  }

}


function updateCartBadge() {

  const cart =
    readCart();


  const total =
    cart.reduce(
      (
        sum,
        item
      ) => {

        const itemQuantity =
          Math.max(
            1,
            toNumber(
              item?.quantity,
              1
            )
          );


        return (
          sum +
          itemQuantity
        );

      },
      0
    );


  cartBadgeEl.textContent =
    String(
      total
    );

}


/* ============================================================
   BUILD CART ITEM
   ============================================================ */

function buildCartItem() {

  if (!product) {
    return null;
  }


  const productId =
    String(
      firstNonEmpty(
        product.id,
        getProductId()
      )
    );


  const variantKey =
    selectedSku
      ? String(
          firstNonEmpty(
            selectedSku.sku,
            selectedSku.sku_id,
            selectedSku.skuId,
            selectedSku.id,
            selectedSku.index
          )
        )
      : "default";


  const itemPrice =
    selectedSku &&
    selectedSku.price !== null &&
    selectedSku.price !== undefined
      ? toNumber(
          selectedSku.price,
          toNumber(
            product.price,
            0
          )
        )
      : toNumber(
          product.price,
          0
        );


  return {

    id:
      `${productId}__${variantKey}`,

    product_id:
      productId,

    title:
      product.title,

    price:
      itemPrice,

    currency:
      product.currency ||
      "USD",

    quantity:
      quantity,

    image:
      selectedSku?.image ||
      galleryImages[0] ||
      "",

    sku:
      selectedSku?.sku ||
      product.sku ||
      "",

    selected_properties:
      {
        ...selectedProperties
      },

    selectedProperties:
      {
        ...selectedProperties
      },

    variants:
      selectedSku
        ? (
            selectedSku.properties ||
            selectedSku.normalized_properties ||
            []
          )
        : [],

    variant:
      selectedSku ||
      null

  };

}


/* ============================================================
   VALIDATE SELECTION
   ============================================================ */

function validateSelection() {

  selectionNoticeEl.classList.add(
    "hidden"
  );


  if (
    !normalizedSkus.length
  ) {

    return true;

  }


  const groups =
    buildVariantGroups(
      normalizedSkus
    );


  if (!groups.length) {

    return true;

  }


  const missing =
    groups.filter(
      group =>
        !selectedProperties[
          String(
            group.id
          )
        ]
    );


  if (
    missing.length
  ) {

    selectionNoticeEl.textContent =
      `Please select: ${missing
        .map(
          group =>
            group.name
        )
        .join(", ")}`;


    selectionNoticeEl.classList.remove(
      "hidden"
    );


    return false;

  }


  const exact =
    findExactSku();


  if (!exact) {

    selectionNoticeEl.textContent =
      "The selected variant is unavailable.";


    selectionNoticeEl.classList.remove(
      "hidden"
    );


    return false;

  }


  selectedSku =
    exact;


  selectionNoticeEl.classList.add(
    "hidden"
  );


  return true;

}


/* ============================================================
   ADD TO CART
   ============================================================ */

function addCurrentProductToCart() {

  if (
    !validateSelection()
  ) {

    return;

  }


  const item =
    buildCartItem();


  if (!item) {

    return;

  }


  try {

    const cart =
      readCart();


    const existingIndex =
      cart.findIndex(
        existing =>
          existing &&
          existing.id ===
            item.id
      );


    if (
      existingIndex >= 0
    ) {

      cart[
        existingIndex
      ].quantity =
        Math.min(
          999,
          toNumber(
            cart[
              existingIndex
            ].quantity,
            0
          ) +
          item.quantity
        );

    } else {

      cart.push(
        item
      );

    }


    saveCart(
      cart
    );


    updateCartBadge();


    addToCartBtnEl.textContent =
      "Added ✓";


    setTimeout(
      () => {

        addToCartBtnEl.textContent =
          "Add to Cart";

      },
      1600
    );

  } catch (error) {

    selectionNoticeEl.textContent =
      error?.message ||
      "Unable to add this product to the cart.";

    selectionNoticeEl.classList.remove(
      "hidden"
    );

  }

}


/* ============================================================
   BUY NOW
   ============================================================ */

function buyNow() {

  if (
    !validateSelection()
  ) {

    return;

  }


  const item =
    buildCartItem();


  if (!item) {

    return;

  }


  try {

    const data =
      JSON.stringify(
        item
      );


    sessionStorage.setItem(
      BUY_NOW_KEY,
      data
    );


    /*
     * Keep compatibility with the
     * previous checkout implementation.
     */
    sessionStorage.setItem(
      "prasun_buy_now",
      data
    );


    window.location.href =
      "./checkout.html?buy_now=1";

  } catch (error) {

    selectionNoticeEl.textContent =
      "Unable to continue to checkout. Please try again.";

    selectionNoticeEl.classList.remove(
      "hidden"
    );

  }

}


/* ============================================================
   QUANTITY
   ============================================================ */

function setQuantity(
  value
) {

  let number =
    parseInt(
      value,
      10
    );


  if (
    !Number.isFinite(
      number
    ) ||
    number < 1
  ) {

    number = 1;

  }


  if (
    number > 999
  ) {

    number = 999;

  }


  quantity =
    number;


  quantityInputEl.value =
    String(
      quantity
    );

}


quantityMinusEl.addEventListener(
  "click",
  () => {

    setQuantity(
      quantity - 1
    );

  }
);


quantityPlusEl.addEventListener(
  "click",
  () => {

    setQuantity(
      quantity + 1
    );

  }
);


quantityInputEl.addEventListener(
  "input",
  () => {

    setQuantity(
      quantityInputEl.value
    );

  }
);


quantityInputEl.addEventListener(
  "blur",
  () => {

    setQuantity(
      quantityInputEl.value
    );

  }
);


addToCartBtnEl.addEventListener(
  "click",
  addCurrentProductToCart
);


buyNowBtnEl.addEventListener(
  "click",
  buyNow
);


/* ============================================================
   FETCH JSON SAFELY
   ============================================================ */

async function fetchProductData(
  productId
) {

  const url =
    `${API_BASE}/api/products/${encodeURIComponent(
      productId
    )}`;


  const response =
    await fetch(
      url,
      {
        method: "GET",
        headers: {
          "Accept":
            "application/json,text/plain,*/*"
        },
        cache: "no-store"
      }
    );


  const responseText =
    await response.text();


  if (
    !response.ok
  ) {

    throw new Error(
      `Product request failed (${response.status}).`
    );

  }


  if (!responseText.trim()) {

    throw new Error(
      "The product server returned an empty response."
    );

  }


  let data;


  try {

    data =
      JSON.parse(
        responseText
      );

  } catch {

    throw new Error(
      "The product server returned an invalid response."
    );

  }


  return data;

}


/* ============================================================
   LOAD PRODUCT
   ============================================================ */

async function loadProduct() {

  const productId =
    getProductId();


  if (!productId) {

    throw new Error(
      "No product ID was provided."
    );

  }


  const data =
    await fetchProductData(
      productId
    );


  /*
   * Some Worker responses use success=false
   * even though the HTTP status is 200.
   */
  if (
    data &&
    data.success === false
  ) {

    throw new Error(
      firstNonEmpty(
        data.message,
        data.error,
        "The product could not be loaded."
      )
    );

  }


  const normalized =
    normalizeProduct(
      data
    );


  if (!normalized) {

    throw new Error(
      "Product data could not be read from the server response."
    );

  }


  product =
    normalized;


  normalizedSkus =
    normalizeSkus(
      product.skus
    );


  renderProduct();


  loadingEl.classList.add(
    "hidden"
  );


  productSectionEl.classList.remove(
    "hidden"
  );


  /*
   * Make sure the selected SKU state
   * is synchronized after rendering.
   */
  updateSelectedSku();

}


/* ============================================================
   ERROR
   ============================================================ */

function showError(
  error
) {

  console.error(
    "Prasun Store product error:",
    error
  );


  loadingEl.classList.add(
    "hidden"
  );


  productSectionEl.classList.add(
    "hidden"
  );


  descriptionCardEl.classList.add(
    "hidden"
  );


  errorBoxEl.classList.remove(
    "hidden"
  );


  errorMessageEl.textContent =
    error?.message ||
    "Unable to load product.";

}


/* ============================================================
   GLOBAL ERROR VISIBILITY
   ============================================================ */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Product page error:",
      event.error ||
      event.message
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Product page promise error:",
      event.reason
    );

  }
);


/* ============================================================
   INIT
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    updateCartBadge();


    try {

      await loadProduct();

    } catch (error) {

      showError(
        error
      );

    }

  }
);
</script>

</body>
</html>
