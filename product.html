<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product | Prasun Store</title>
  <meta
    name="description"
    content="Shop quality products at Prasun Store."
  />

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-hover: #000000;
      --success: #15803d;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* ---------------- HEADER ---------------- */

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 600;
      font-size: 14px;
    }

    .header-link:hover {
      background: #f9fafb;
    }

    /* ---------------- PAGE ---------------- */

    .page {
      padding: 30px 0 60px;
    }

    .breadcrumbs {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .breadcrumbs a {
      color: #374151;
    }

    .breadcrumbs span {
      margin: 0 6px;
      color: #9ca3af;
    }

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 42px;
      align-items: start;
    }

    /* ---------------- GALLERY ---------------- */

    .gallery-card,
    .info-card,
    .description-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .gallery-card {
      padding: 18px;
    }

    .main-image-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #f9fafb;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }

    .gallery-thumbs {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .gallery-thumb {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      padding: 0;
      background: #fff;
      cursor: pointer;
      aspect-ratio: 1 / 1;
    }

    .gallery-thumb.active {
      border: 2px solid var(--primary);
    }

    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ---------------- PRODUCT INFO ---------------- */

    .info-card {
      padding: 26px;
    }

    .product-title {
      margin: 0 0 14px;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .rating-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .stars {
      color: #f59e0b;
      letter-spacing: 1px;
      font-size: 17px;
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .stock {
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .stock.in-stock {
      color: var(--success);
    }

    .stock.out-of-stock {
      color: var(--danger);
    }

    /* ---------------- VARIANTS ---------------- */

    .variants {
      margin-top: 24px;
    }

    .variant-group {
      margin-bottom: 22px;
    }

    .variant-title {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .variant-selected-text {
      color: var(--muted);
      font-weight: 500;
      font-size: 13px;
    }

    .variant-options {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .variant-option {
      position: relative;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        transform 0.15s ease;
    }

    .variant-option:hover {
      border-color: #111827;
    }

    .variant-option.selected {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 2px rgba(17, 24, 39, 0.08);
    }

    .variant-option.disabled {
      opacity: 0.38;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* Text-based variant option */

    .text-option {
      min-height: 42px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    /* Image swatch */

    .swatch-option {
      width: 76px;
      min-height: 94px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      background: #fff;
    }

    .variant-swatch-image {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f4f6;
      display: block;
    }

    .variant-swatch-label {
      width: 100%;
      text-align: center;
      padding: 1px 2px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ---------------- QUANTITY ---------------- */

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .quantity-label {
      font-size: 14px;
      font-weight: 800;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .quantity-control button {
      width: 40px;
      height: 40px;
      border: 0;
      background: #f9fafb;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity-control button:hover {
      background: #f3f4f6;
    }

    .quantity-control input {
      width: 52px;
      height: 40px;
      border: 0;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
      outline: none;
      font-weight: 700;
    }

    /* ---------------- BUTTONS ---------------- */

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      min-height: 50px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f9fafb;
    }

    /* ---------------- QUICK INFO ---------------- */

    .quick-info {
      margin-top: 25px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: grid;
      gap: 12px;
    }

    .quick-info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 14px;
    }

    .quick-info-row span:first-child {
      color: var(--muted);
    }

    .quick-info-row span:last-child {
      font-weight: 700;
      text-align: right;
    }

    /* ---------------- DESCRIPTION ---------------- */

    .description-card {
      margin-top: 36px;
      padding: 28px;
    }

    .description-title {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .description-content {
      color: #374151;
      font-size: 15px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .description-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto;
      border-radius: 10px;
    }

    .description-content video {
      max-width: 100%;
    }

    .description-content table {
      max-width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
      display: block;
    }

    .description-content td,
    .description-content th {
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    /* ---------------- STATES ---------------- */

    .loading {
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--muted);
    }

    .error-box {
      margin: 30px auto;
      max-width: 700px;
      padding: 24px;
      background: #fff;
      border: 1px solid #fecaca;
      border-radius: 14px;
      color: #991b1b;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------------- RESPONSIVE ---------------- */

    @media (max-width: 900px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .gallery-card,
      .info-card {
        padding: 18px;
      }

      .description-card {
        padding: 20px;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 20px, 1200px);
      }

      .header-inner {
        min-height: 62px;
      }

      .brand {
        font-size: 19px;
      }

      .header-link {
        padding: 0 10px;
        font-size: 13px;
      }

      .product-title {
        font-size: 27px;
      }

      .price {
        font-size: 28px;
      }

      .gallery-thumbs {
        grid-template-columns: repeat(5, 1fr);
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      .swatch-option {
        width: 70px;
        min-height: 89px;
      }

      .variant-swatch-image {
        width: 58px;
        height: 58px;
      }

      .quick-info-row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-inner">
      <a href="/" class="brand">Prasun Store</a>

      <div class="header-actions">
        <a href="/" class="header-link">Shop</a>
        <a href="/cart.html" class="header-link">Cart</a>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">

      <div class="breadcrumbs">
        <a href="/">Home</a>
        <span>/</span>
        <span>Product</span>
      </div>

      <div id="loading" class="loading">
        Loading product...
      </div>

      <div id="errorBox" class="error-box hidden">
        <h2>Unable to load product</h2>
        <p id="errorMessage">
          Something went wrong while loading this product.
        </p>
        <a href="/" class="header-link">Back to Store</a>
      </div>

      <section id="productSection" class="product-layout hidden">

        <!-- ================= GALLERY ================= -->

        <div class="gallery-card">

          <div class="main-image-wrap">
            <img
              id="mainImage"
              class="main-image"
              src=""
              alt="Product image"
            />
          </div>

          <div id="galleryThumbs" class="gallery-thumbs"></div>

        </div>

        <!-- ================= PRODUCT INFO ================= -->

        <div class="info-card">

          <h1 id="productTitle" class="product-title">
            Product
          </h1>

          <div class="rating-row">
            <span id="ratingStars" class="stars">★★★★★</span>
            <span id="ratingText">No ratings</span>
          </div>

          <div id="productPrice" class="price">
            $0.00
          </div>

          <div id="stockText" class="stock in-stock">
            In stock
          </div>

          <!-- VARIANTS -->

          <div id="variantsContainer" class="variants hidden"></div>

          <!-- QUANTITY -->

          <div class="quantity-row">
            <span class="quantity-label">Quantity</span>

            <div class="quantity-control">
              <button
                type="button"
                id="quantityMinus"
                aria-label="Decrease quantity"
              >
                −
              </button>

              <input
                id="quantityInput"
                type="number"
                min="1"
                max="999"
                value="1"
              />

              <button
                type="button"
                id="quantityPlus"
                aria-label="Increase quantity"
              >
                +
              </button>
            </div>
          </div>

          <!-- ACTION BUTTONS -->

          <div class="action-buttons">

            <button
              type="button"
              id="addToCartBtn"
              class="btn btn-secondary"
            >
              Add to Cart
            </button>

            <button
              type="button"
              id="buyNowBtn"
              class="btn btn-primary"
            >
              Buy Now
            </button>

          </div>

          <div id="selectionNotice" class="notice hidden"></div>

          <!-- QUICK INFO -->

          <div class="quick-info">

            <div class="quick-info-row">
              <span>SKU</span>
              <span id="productSku">—</span>
            </div>

            <div class="quick-info-row">
              <span>Availability</span>
              <span id="productAvailability">—</span>
            </div>

            <div class="quick-info-row">
              <span>Ships to</span>
              <span id="productShipsTo">Worldwide</span>
            </div>

          </div>

        </div>

      </section>

      <!-- ================= DESCRIPTION ================= -->

      <section id="descriptionCard" class="description-card hidden">

        <h2 class="description-title">
          Product Description
        </h2>

        <div id="descriptionContent" class="description-content"></div>

      </section>

    </div>
  </main>

  <script>

    /* ============================================================
       CONFIGURATION
       ============================================================ */

    const API_BASE = "https://prasun-store.prasun301.workers.dev";


    /* ============================================================
       GLOBAL STATE
       ============================================================ */

    let product = null;

    let normalizedSkus = [];

    let selectedProperties = {};

    let selectedSku = null;

    let quantity = 1;

    let galleryImages = [];

    let currentImageIndex = 0;


    /* ============================================================
       DOM ELEMENTS
       ============================================================ */

    const loadingEl = document.getElementById("loading");
    const errorBoxEl = document.getElementById("errorBox");
    const errorMessageEl = document.getElementById("errorMessage");
    const productSectionEl = document.getElementById("productSection");

    const mainImageEl = document.getElementById("mainImage");
    const galleryThumbsEl = document.getElementById("galleryThumbs");

    const productTitleEl = document.getElementById("productTitle");
    const ratingStarsEl = document.getElementById("ratingStars");
    const ratingTextEl = document.getElementById("ratingText");
    const productPriceEl = document.getElementById("productPrice");
    const stockTextEl = document.getElementById("stockText");

    const variantsContainerEl =
      document.getElementById("variantsContainer");

    const quantityInputEl =
      document.getElementById("quantityInput");

    const quantityMinusEl =
      document.getElementById("quantityMinus");

    const quantityPlusEl =
      document.getElementById("quantityPlus");

    const addToCartBtnEl =
      document.getElementById("addToCartBtn");

    const buyNowBtnEl =
      document.getElementById("buyNowBtn");

    const selectionNoticeEl =
      document.getElementById("selectionNotice");

    const productSkuEl =
      document.getElementById("productSku");

    const productAvailabilityEl =
      document.getElementById("productAvailability");

    const productShipsToEl =
      document.getElementById("productShipsTo");

    const descriptionCardEl =
      document.getElementById("descriptionCard");

    const descriptionContentEl =
      document.getElementById("descriptionContent");


    /* ============================================================
       URL / PRODUCT ID
       ============================================================ */

    function getProductId() {

      const params = new URLSearchParams(
        window.location.search
      );

      return (
        params.get("id") ||
        params.get("product_id") ||
        params.get("productId") ||
        params.get("sku")
      );
    }


    /* ============================================================
       GENERAL HELPERS
       ============================================================ */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function toNumber(value, fallback = 0) {

      const num = Number(value);

      return Number.isFinite(num)
        ? num
        : fallback;
    }


    function firstNonEmpty(...values) {

      for (const value of values) {

        if (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== ""
        ) {
          return value;
        }

      }

      return "";
    }


    function uniqueArray(array) {

      return [...new Set(
        array.filter(Boolean)
      )];

    }


    function formatPrice(value, currency = "USD") {

      const amount = toNumber(value, 0);

      try {

        return new Intl.NumberFormat(
          "en-US",
          {
            style: "currency",
            currency: currency || "USD"
          }
        ).format(amount);

      } catch {

        return `${currency || "USD"} ${amount.toFixed(2)}`;

      }
    }


    function getPropertyGroupId(property) {

      return firstNonEmpty(
        property?.group_id,
        property?.groupId,
        property?.property_id,
        property?.propertyId,
        property?.sku_property_id,
        property?.skuPropertyId,
        property?.id
      );
    }


    function getPropertyValueId(property) {

      return firstNonEmpty(
        property?.value_id,
        property?.valueId,
        property?.property_value_id,
        property?.propertyValueId,
        property?.sku_property_value_id,
        property?.skuPropertyValueId
      );
    }


    function getPropertyGroupName(property) {

      return firstNonEmpty(
        property?.group_name,
        property?.groupName,
        property?.property_name,
        property?.propertyName,
        property?.sku_property_name,
        property?.skuPropertyName,
        property?.name
      );
    }


    function getPropertyValueName(property) {

      return firstNonEmpty(
        property?.value_name,
        property?.valueName,
        property?.property_value_name,
        property?.propertyValueName,
        property?.property_value_definition_name,
        property?.propertyValueDefinitionName,
        property?.display,
        property?.name
      );
    }


    function getPropertyImage(property) {

      return firstNonEmpty(
        property?.image,
        property?.image_url,
        property?.imageUrl,
        property?.sku_image,
        property?.skuImage
      );
    }


    /* ============================================================
       MEANINGLESS ALIEXPRESS VARIANT CODES
       ============================================================ */

    function isMeaninglessVariantCode(value) {

      if (
        value === undefined ||
        value === null
      ) {
        return true;
      }

      const text = String(value).trim();

      if (!text) {
        return true;
      }

      /*
        Common AliExpress/internal-looking codes:

        T001
        T002
        SKU123
        COLOR_01
        COLOR-02
        OPTION_03
        OPTION-04
        VALUE_01
        VALUE-02
      */

      const patterns = [

        /^T\d{2,}$/i,

        /^SKU[\s_-]?\d+$/i,

        /^COLOR[\s_-]?\d+$/i,

        /^OPTION[\s_-]?\d+$/i,

        /^VALUE[\s_-]?\d+$/i,

        /^VARIANT[\s_-]?\d+$/i,

        /^PROP[\s_-]?\d+$/i,

        /^STYLE[\s_-]?\d+$/i

      ];

      return patterns.some(
        pattern => pattern.test(text)
      );
    }


    function isMeaningfulVariantName(value) {

      if (
        !value ||
        isMeaninglessVariantCode(value)
      ) {
        return false;
      }

      const text = String(value).trim();

      return text.length > 0;
    }


    /* ============================================================
       COLOR GROUP DETECTION
       ============================================================ */

    function isColorGroupName(name) {

      const text = String(
        name || ""
      ).trim().toLowerCase();

      if (!text) {
        return false;
      }

      const keywords = [
        "color",
        "colour",
        "colours",
        "colors",
        "couleur",
        "farba",
        "cor",
        "colourway",
        "pattern",
        "style"
      ];

      return keywords.some(
        keyword => text === keyword ||
        text.includes(keyword)
      );
    }


    function shouldUseImageSwatches(group) {

      if (!group) {
        return false;
      }

      if (!isColorGroupName(group.name)) {
        return false;
      }

      const imageCount = group.values.filter(
        value => Boolean(value.image)
      ).length;

      /*
        Require at least two images before
        using image swatches.
      */

      return imageCount >= 2;
    }


    /* ============================================================
       NORMALIZE PRODUCT
       ============================================================ */

    function normalizeProduct(raw) {

      if (!raw) {
        return null;
      }

      const data =
        raw.product ||
        raw.data ||
        raw.result ||
        raw;

      return {
        ...data,

        id: firstNonEmpty(
          data.id,
          data.product_id,
          data.productId,
          data.item_id,
          data.itemId
        ),

        title: firstNonEmpty(
          data.title,
          data.product_title,
          data.productTitle,
          data.name
        ) || "Product",

        price: firstNonEmpty(
          data.price,
          data.sale_price,
          data.salePrice,
          data.min_price,
          data.minPrice
        ),

        original_price: firstNonEmpty(
          data.original_price,
          data.originalPrice,
          data.regular_price,
          data.regularPrice,
          data.max_price,
          data.maxPrice
        ),

        currency: firstNonEmpty(
          data.currency,
          data.target_currency,
          data.targetCurrency,
          "USD"
        ),

        rating: firstNonEmpty(
          data.rating,
          data.average_rating,
          data.averageRating,
          data.star_rating
        ),

        review_count: firstNonEmpty(
          data.review_count,
          data.reviewCount,
          data.reviews,
          data.orders
        ),

        stock: firstNonEmpty(
          data.stock,
          data.inventory,
          data.quantity,
          data.total_stock
        ),

        sku: firstNonEmpty(
          data.sku,
          data.product_sku,
          data.productSku,
          data.item_sku,
          data.itemSku
        ),

        description: firstNonEmpty(
          data.description,
          data.description_html,
          data.descriptionHtml,
          data.product_description,
          data.productDescription,
          data.detail,
          data.details
        ),

        images:
          data.images ||
          data.image_urls ||
          data.imageUrls ||
          data.gallery ||
          data.gallery_images ||
          data.galleryImages ||
          [],

        skus:
          data.skus ||
          data.sku_list ||
          data.skuList ||
          data.sku_array ||
          data.skuArray ||
          data.ae_sku_property_dtos ||
          [],

        raw: data
      };
    }


    /* ============================================================
       NORMALIZE SKU PROPERTY
       ============================================================ */

    function normalizeSkuProperty(property) {

      if (!property) {
        return null;
      }

      const groupId =
        getPropertyGroupId(property);

      const valueId =
        getPropertyValueId(property);

      const groupName =
        getPropertyGroupName(property);

      const valueName =
        getPropertyValueName(property);

      const image =
        getPropertyImage(property);

      if (
        !groupId &&
        !valueId &&
        !groupName &&
        !valueName
      ) {
        return null;
      }

      return {

        group_id: String(
          groupId || groupName || "group"
        ),

        value_id: String(
          valueId || valueName || ""
        ),

        groupId: String(
          groupId || groupName || "group"
        ),

        valueId: String(
          valueId || valueName || ""
        ),

        property_id: String(
          groupId || groupName || "group"
        ),

        property_value_id: String(
          valueId || valueName || ""
        ),

        sku_property_id: String(
          groupId || groupName || "group"
        ),

        sku_property_name:
          String(
            groupName || "Option"
          ),

        property_name:
          String(
            groupName || "Option"
          ),

        name:
          String(
            groupName || "Option"
          ),

        group_name:
          String(
            groupName || "Option"
          ),

        groupName:
          String(
            groupName || "Option"
          ),

        value_name:
          String(
            valueName ||
            valueId ||
            ""
          ),

        valueName:
          String(
            valueName ||
            valueId ||
            ""
          ),

        property_value_name:
          String(
            valueName ||
            valueId ||
            ""
          ),

        propertyValueName:
          String(
            valueName ||
            valueId ||
            ""
          ),

        property_value_definition_name:
          String(
            valueName ||
            valueId ||
            ""
          ),

        propertyValueDefinitionName:
          String(
            valueName ||
            valueId ||
            ""
          ),

        display:
          String(
            valueName ||
            valueId ||
            ""
          ),

        image:
          image || "",

        image_url:
          image || "",

        imageUrl:
          image || "",

        sku_image:
          image || "",

        skuImage:
          image || ""
      };
    }


    /* ============================================================
       EXTRACT SKU PROPERTIES
       ============================================================ */

    function extractSkuProperties(sku) {

      if (!sku) {
        return [];
      }

      const candidates = [];

      /*
        Direct property arrays
      */

      const directArrays = [

        sku.properties,

        sku.propertys,

        sku.property_list,

        sku.propertyList,

        sku.sku_properties,

        sku.skuProperties,

        sku.normalized_properties,

        sku.normalizedProperties,

        sku.ae_sku_property_dtos,

        sku.aeSkuPropertyDtos,

        sku.aeop_s_k_u_propertys,

        sku.aeopSkuPropertys

      ];

      for (const item of directArrays) {

        if (Array.isArray(item)) {
          candidates.push(...item);
        }

        if (
          item &&
          typeof item === "object"
        ) {

          if (
            Array.isArray(
              item.ae_sku_property_d_t_o
            )
          ) {
            candidates.push(
              ...item.ae_sku_property_d_t_o
            );
          }

          if (
            Array.isArray(
              item.ae_sku_property_dto
            )
          ) {
            candidates.push(
              ...item.ae_sku_property_dto
            );
          }

          if (
            Array.isArray(
              item.aeop_s_k_u_property
            )
          ) {
            candidates.push(
              ...item.aeop_s_k_u_property
            );
          }

          if (
            Array.isArray(
              item.aeop_sku_property
            )
          ) {
            candidates.push(
              ...item.aeop_sku_property
            );
          }
        }

      }


      /*
        Another common structure:
        ae_sku_property_dtos:
        {
          ae_sku_property_d_t_o: [...]
        }
      */

      if (
        sku.ae_sku_property_dtos &&
        typeof sku.ae_sku_property_dtos === "object"
      ) {

        const dto =
          sku.ae_sku_property_dtos
            .ae_sku_property_d_t_o;

        if (Array.isArray(dto)) {
          candidates.push(...dto);
        }

      }


      /*
        If SKU itself contains a property
      */

      if (
        sku.group_id ||
        sku.groupId ||
        sku.property_id ||
        sku.propertyId
      ) {
        candidates.push(sku);
      }


      /*
        Normalize and remove duplicates
      */

      const normalized = [];

      const seen = new Set();

      for (const property of candidates) {

        const item =
          normalizeSkuProperty(property);

        if (!item) {
          continue;
        }

        const key =
          `${item.group_id}::${item.value_id}`;

        if (seen.has(key)) {
          continue;
        }

        seen.add(key);

        normalized.push(item);
      }

      return normalized;
    }


    /* ============================================================
       NORMALIZE SKUS
       ============================================================ */

    function normalizeSkus(rawSkus) {

      let list = rawSkus;

      if (
        list &&
        typeof list === "object" &&
        !Array.isArray(list)
      ) {

        list =
          list.sku ||
          list.skus ||
          list.sku_list ||
          list.skuList ||
          list.ae_sku_property_d_t_o ||
          list.ae_sku_property_dto ||
          [];

      }

      if (!Array.isArray(list)) {
        return [];
      }

      return list.map((sku, index) => {

        const properties =
          extractSkuProperties(sku);

        const price =
          firstNonEmpty(
            sku.price,
            sku.sale_price,
            sku.salePrice,
            sku.offer_price,
            sku.offerPrice,
            sku.sku_price,
            sku.skuPrice
          );

        const stock =
          firstNonEmpty(
            sku.stock,
            sku.inventory,
            sku.quantity,
            sku.sku_stock,
            sku.skuStock
          );

        const skuCode =
          firstNonEmpty(
            sku.sku,
            sku.sku_code,
            sku.skuCode,
            sku.sku_id,
            sku.skuId,
            `sku-${index + 1}`
          );

        const image =
          firstNonEmpty(
            sku.image,
            sku.image_url,
            sku.imageUrl,
            sku.sku_image,
            sku.skuImage,
            sku.img
          );

        return {

          ...sku,

          index,

          sku:
            String(skuCode),

          price:
            price !== ""
              ? toNumber(price, 0)
              : null,

          stock:
            stock !== ""
              ? toNumber(stock, 0)
              : null,

          image:
            image || "",

          properties,

          normalized_properties:
            properties

        };

      });

    }


    /* ============================================================
       BUILD VARIANT GROUPS
       ============================================================ */

    function buildVariantGroups(skus) {

      const groups = new Map();

      for (const sku of skus) {

        const properties =
          sku.properties ||
          sku.normalized_properties ||
          [];

        for (const property of properties) {

          const groupId =
            String(
              firstNonEmpty(
                property.group_id,
                property.groupId,
                property.property_id,
                property.propertyId,
                property.sku_property_id,
                property.skuPropertyId
              )
            );

          if (!groupId) {
            continue;
          }

          const groupName =
            firstNonEmpty(
              property.group_name,
              property.groupName,
              property.property_name,
              property.propertyName,
              property.sku_property_name,
              property.skuPropertyName,
              property.name,
              "Option"
            );

          if (!groups.has(groupId)) {

            groups.set(
              groupId,
              {
                id: groupId,
                name: String(groupName),
                values: []
              }
            );

          }

          const group =
            groups.get(groupId);

          const valueId =
            String(
              firstNonEmpty(
                property.value_id,
                property.valueId,
                property.property_value_id,
                property.propertyValueId,
                property.sku_property_value_id,
                property.skuPropertyValueId
              )
            );

          if (!valueId) {
            continue;
          }

          const valueName =
            firstNonEmpty(
              property.value_name,
              property.valueName,
              property.property_value_name,
              property.propertyValueName,
              property.property_value_definition_name,
              property.propertyValueDefinitionName,
              property.display,
              property.name,
              valueId
            );

          const image =
            firstNonEmpty(
              property.image,
              property.image_url,
              property.imageUrl,
              property.sku_image,
              property.skuImage,
              sku.image
            );

          const existing =
            group.values.find(
              value =>
                String(value.id) ===
                String(valueId)
            );

          if (!existing) {

            group.values.push({

              id: valueId,

              name:
                String(
                  valueName || valueId
                ),

              image:
                image || ""

            });

          } else if (
            !existing.image &&
            image
          ) {

            existing.image = image;

          }

        }

      }

      return Array.from(
        groups.values()
      );
    }


    /* ============================================================
       VARIANT DISPLAY NAME
       ============================================================ */

    function getBuyerVariantLabel(
      value,
      group,
      index
    ) {

      if (
        value &&
        isMeaningfulVariantName(
          value.name
        )
      ) {
        return String(value.name);
      }

      /*
        Don't show T001 / T002 / SKU-style
        internal codes as the main label.
      */

      if (
        isColorGroupName(group.name)
      ) {

        return `Color ${index + 1}`;

      }

      return `Option ${index + 1}`;
    }


    /* ============================================================
       RENDER VARIANTS
       ============================================================ */

    function renderVariants() {

      variantsContainerEl.innerHTML = "";

      if (!normalizedSkus.length) {

        variantsContainerEl.classList.add("hidden");

        return;

      }

      const groups =
        buildVariantGroups(
          normalizedSkus
        );

      if (!groups.length) {

        variantsContainerEl.classList.add("hidden");

        return;

      }

      variantsContainerEl.classList.remove(
        "hidden"
      );


      for (const group of groups) {

        const groupWrapper =
          document.createElement("div");

        groupWrapper.className =
          "variant-group";

        const titleRow =
          document.createElement("div");

        titleRow.className =
          "variant-title";

        const title =
          document.createElement("span");

        title.textContent =
          group.name || "Option";

        const selectedText =
          document.createElement("span");

        selectedText.className =
          "variant-selected-text";

        selectedText.dataset.groupId =
          group.id;

        selectedText.textContent =
          "Select";

        titleRow.appendChild(title);
        titleRow.appendChild(selectedText);

        const options =
          document.createElement("div");

        options.className =
          "variant-options";

        const useImageSwatches =
          shouldUseImageSwatches(group);

        group.values.forEach(
          (value, index) => {

            const button =
              document.createElement("button");

            button.type = "button";

            button.className =
              "variant-option";

            button.dataset.groupId =
              String(group.id);

            button.dataset.valueId =
              String(value.id);

            const meaningfulName =
              isMeaningfulVariantName(
                value.name
              );

            const buyerLabel =
              getBuyerVariantLabel(
                value,
                group,
                index
              );

            if (
              useImageSwatches &&
              value.image
            ) {

              button.classList.add(
                "swatch-option"
              );

              const image =
                document.createElement("img");

              image.className =
                "variant-swatch-image";

              image.src =
                value.image;

              image.alt =
                buyerLabel;

              image.loading =
                "lazy";

              image.referrerPolicy =
                "no-referrer";

              button.appendChild(
                image
              );


              /*
                Show real color names,
                but do not show T001/T002/etc.
              */

              if (meaningfulName) {

                const label =
                  document.createElement(
                    "span"
                  );

                label.className =
                  "variant-swatch-label";

                label.textContent =
                  buyerLabel;

                button.appendChild(
                  label
                );

              }

              button.title =
                meaningfulName
                  ? buyerLabel
                  : `Color option ${index + 1}`;

              button.setAttribute(
                "aria-label",
                meaningfulName
                  ? buyerLabel
                  : `Color option ${index + 1}`
              );

            } else {

              button.classList.add(
                "text-option"
              );

              button.textContent =
                buyerLabel;

              button.title =
                buyerLabel;

              button.setAttribute(
                "aria-label",
                buyerLabel
              );

            }


            button.addEventListener(
              "click",
              () => {

                if (
                  button.classList.contains(
                    "disabled"
                  )
                ) {
                  return;
                }

                selectedProperties[
                  String(group.id)
                ] =
                  String(value.id);

                updateVariantUI();

                updateSelectedSku();

              }
            );

            options.appendChild(
              button
            );

          }
        );


        groupWrapper.appendChild(
          titleRow
        );

        groupWrapper.appendChild(
          options
        );

        variantsContainerEl.appendChild(
          groupWrapper
        );

      }

      updateVariantUI();
    }


    /* ============================================================
       AVAILABLE SKU CHECK
       ============================================================ */

    function hasAvailableSkuForSelection(
      groupId,
      valueId
    ) {

      const testGroupId =
        String(groupId);

      const testValueId =
        String(valueId);

      return normalizedSkus.some(
        sku => {

          if (
            sku.stock !== null &&
            sku.stock <= 0
          ) {
            return false;
          }

          const properties =
            sku.properties ||
            sku.normalized_properties ||
            [];

          const property =
            properties.find(
              item =>
                String(
                  firstNonEmpty(
                    item.group_id,
                    item.groupId,
                    item.property_id,
                    item.propertyId,
                    item.sku_property_id
                  )
                ) === testGroupId
            );

          if (!property) {
            return false;
          }

          const skuValueId =
            String(
              firstNonEmpty(
                property.value_id,
                property.valueId,
                property.property_value_id,
                property.propertyValueId,
                property.sku_property_value_id
              )
            );

          return (
            skuValueId ===
            testValueId
          );

        }
      );

    }


    /* ============================================================
       VARIANT UI STATE
       ============================================================ */

    function updateVariantUI() {

      document
        .querySelectorAll(
          ".variant-option"
        )
        .forEach(button => {

          const groupId =
            String(
              button.dataset.groupId || ""
            );

          const valueId =
            String(
              button.dataset.valueId || ""
            );

          const selected =
            String(
              selectedProperties[groupId] || ""
            ) === valueId;

          button.classList.toggle(
            "selected",
            selected
          );


          /*
            Disable values that have
            no available SKU.
          */

          const hasAvailable =
            hasAvailableSkuForSelection(
              groupId,
              valueId
            );

          button.classList.toggle(
            "disabled",
            !hasAvailable
          );

          /*
            Keep already-selected value
            usable even if stock structure
            is unusual.
          */

          if (selected) {

            button.classList.remove(
              "disabled"
            );

          }

        });


      /*
        Update selected labels.
      */

      const groups =
        buildVariantGroups(
          normalizedSkus
        );

      groups.forEach(
        group => {

          const label =
            document.querySelector(
              `.variant-selected-text[data-group-id="${CSS.escape(
                String(group.id)
              )}"]`
            );

          if (!label) {
            return;
          }

          const selectedValueId =
            selectedProperties[
              String(group.id)
            ];

          if (!selectedValueId) {

            label.textContent =
              "Select";

            return;

          }

          const selectedValue =
            group.values.find(
              value =>
                String(value.id) ===
                String(selectedValueId)
            );

          if (!selectedValue) {

            label.textContent =
              "Select";

            return;

          }

          if (
            isMeaningfulVariantName(
              selectedValue.name
            )
          ) {

            label.textContent =
              selectedValue.name;

          } else {

            label.textContent =
              "Selected";

          }

        }
      );

    }


    /* ============================================================
       SKU MATCHING
       ============================================================ */

    function skuMatchesSelection(
      sku,
      selection,
      requireAllSelected = false
    ) {

      const properties =
        sku.properties ||
        sku.normalized_properties ||
        [];

      let matchedCount = 0;

      for (
        const [
          groupId,
          selectedValueId
        ] of Object.entries(selection)
      ) {

        const property =
          properties.find(
            item =>
              String(
                firstNonEmpty(
                  item.group_id,
                  item.groupId,
                  item.property_id,
                  item.propertyId,
                  item.sku_property_id
                )
              ) ===
              String(groupId)
          );

        if (!property) {
          return false;
        }

        const valueId =
          String(
            firstNonEmpty(
              property.value_id,
              property.valueId,
              property.property_value_id,
              property.propertyValueId,
              property.sku_property_value_id
            )
          );

        if (
          valueId !==
          String(selectedValueId)
        ) {
          return false;
        }

        matchedCount++;

      }

      if (
        requireAllSelected
      ) {

        /*
          Require all SKU properties
          to be selected.
        */

        const uniqueGroups =
          new Set(
            properties.map(
              property =>
                String(
                  firstNonEmpty(
                    property.group_id,
                    property.groupId,
                    property.property_id,
                    property.propertyId,
                    property.sku_property_id
                  )
                )
            )
          );

        if (
          matchedCount !==
          uniqueGroups.size
        ) {
          return false;
        }

      }

      return true;
    }


    function findBestMatchingSku() {

      if (!normalizedSkus.length) {
        return null;
      }

      /*
        First try exact complete match.
      */

      let exact =
        normalizedSkus.find(
          sku =>
            skuMatchesSelection(
              sku,
              selectedProperties,
              true
            ) &&
            (
              sku.stock === null ||
              sku.stock > 0
            )
        );

      if (exact) {
        return exact;
      }


      /*
        Then allow partial match.
      */

      const candidates =
        normalizedSkus.filter(
          sku =>
            skuMatchesSelection(
              sku,
              selectedProperties,
              false
            ) &&
            (
              sku.stock === null ||
              sku.stock > 0
            )
        );

      if (!candidates.length) {
        return null;
      }


      /*
        Select candidate with the
        highest number of matched properties.
      */

      let best =
        candidates[0];

      let bestScore =
        0;

      for (
        const sku of candidates
      ) {

        let score = 0;

        const properties =
          sku.properties ||
          sku.normalized_properties ||
          [];

        for (
          const [
            groupId,
            valueId
          ] of Object.entries(
            selectedProperties
          )
        ) {

          const property =
            properties.find(
              item =>
                String(
                  firstNonEmpty(
                    item.group_id,
                    item.groupId,
                    item.property_id,
                    item.propertyId,
                    item.sku_property_id
                  )
                ) ===
                String(groupId)
            );

          if (!property) {
            continue;
          }

          const skuValueId =
            String(
              firstNonEmpty(
                property.value_id,
                property.valueId,
                property.property_value_id,
                property.propertyValueId,
                property.sku_property_value_id
              )
            );

          if (
            skuValueId ===
            String(valueId)
          ) {
            score++;
          }

        }

        if (score > bestScore) {

          bestScore = score;

          best = sku;

        }

      }

      return best;
    }


    /* ============================================================
       SELECTED SKU UPDATE
       ============================================================ */

    function updateSelectedSku() {

      selectedSku =
        findBestMatchingSku();

      if (!selectedSku) {

        selectionNoticeEl.textContent =
          "Please select an available variant.";

        selectionNoticeEl.classList.remove(
          "hidden"
        );

        return;
      }

      selectionNoticeEl.classList.add(
        "hidden"
      );


      /*
        Variant-specific price
      */

      if (
        selectedSku.price !== null &&
        selectedSku.price !== undefined &&
        selectedSku.price > 0
      ) {

        productPriceEl.textContent =
          formatPrice(
            selectedSku.price,
            product.currency
          );

      } else {

        productPriceEl.textContent =
          formatPrice(
            product.price,
            product.currency
          );

      }


      /*
        Variant-specific stock
      */

      if (
        selectedSku.stock !== null &&
        selectedSku.stock !== undefined
      ) {

        if (
          selectedSku.stock > 0
        ) {

          stockTextEl.textContent =
            `${selectedSku.stock} available`;

          stockTextEl.className =
            "stock in-stock";

        } else {

          stockTextEl.textContent =
            "Out of stock";

          stockTextEl.className =
            "stock out-of-stock";

        }

      }


      /*
        Variant-specific image
      */

      if (
        selectedSku.image
      ) {

        const index =
          galleryImages.indexOf(
            selectedSku.image
          );

        if (index >= 0) {

          setMainImage(index);

        } else {

          mainImageEl.src =
            selectedSku.image;

        }

      }


      /*
        Variant-specific SKU
      */

      if (
        selectedSku.sku
      ) {

        productSkuEl.textContent =
          selectedSku.sku;

      }

    }


    /* ============================================================
       IMAGES
       ============================================================ */

    function normalizeImages(
      rawImages
    ) {

      let images = [];

      if (
        Array.isArray(rawImages)
      ) {

        images =
          rawImages.flatMap(
            item => {

              if (
                typeof item === "string"
              ) {

                return [
                  item
                ];

              }

              if (
                item &&
                typeof item === "object"
              ) {

                return [
                  firstNonEmpty(
                    item.url,
                    item.image_url,
                    item.imageUrl,
                    item.src,
                    item.image
                  )
                ].filter(Boolean);

              }

              return [];

            }
          );

      }

      return uniqueArray(
        images
      );

    }


    function setMainImage(
      index
    ) {

      if (
        !galleryImages.length
      ) {
        return;
      }

      currentImageIndex =
        Math.max(
          0,
          Math.min(
            index,
            galleryImages.length - 1
          )
        );

      mainImageEl.src =
        galleryImages[
          currentImageIndex
        ];

      galleryThumbsEl
        .querySelectorAll(
          ".gallery-thumb"
        )
        .forEach(
          (thumb, thumbIndex) => {

            thumb.classList.toggle(
              "active",
              thumbIndex ===
              currentImageIndex
            );

          }
        );

    }


    function renderGallery() {

      galleryThumbsEl.innerHTML = "";

      if (
        !galleryImages.length
      ) {

        mainImageEl.src =
          "https://via.placeholder.com/800?text=Product";

        return;

      }

      galleryImages.forEach(
        (image, index) => {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "gallery-thumb";

          const img =
            document.createElement(
              "img"
            );

          img.src =
            image;

          img.alt =
            `${product.title} image ${index + 1}`;

          img.loading =
            "lazy";

          img.referrerPolicy =
            "no-referrer";

          button.appendChild(
            img
          );

          button.addEventListener(
            "click",
            () => {

              setMainImage(
                index
              );

            }
          );

          galleryThumbsEl.appendChild(
            button
          );

        }
      );

      setMainImage(0);

    }


    /* ============================================================
       RATING
       ============================================================ */

    function renderRating() {

      const rating =
        toNumber(
          product.rating,
          0
        );

      if (
        rating <= 0
      ) {

        ratingStarsEl.textContent =
          "★★★★★";

        ratingTextEl.textContent =
          "No ratings";

        return;
      }

      const rounded =
        Math.round(
          Math.max(
            0,
            Math.min(
              5,
              rating
            )
          )
        );

      ratingStarsEl.textContent =
        "★".repeat(rounded) +
        "☆".repeat(5 - rounded);

      const reviewCount =
        toNumber(
          product.review_count,
          0
        );

      ratingTextEl.textContent =
        reviewCount > 0
          ? `${rating.toFixed(1)} (${reviewCount.toLocaleString()} reviews)`
          : rating.toFixed(1);

    }


    /* ============================================================
       DESCRIPTION
       ============================================================ */

    function sanitizeDescriptionHtml(
      html
    ) {

      if (
        !html ||
        typeof html !== "string"
      ) {
        return "";
      }

      /*
        Remove dangerous elements/attributes
        while preserving useful product HTML.
      */

      const parser =
        new DOMParser();

      const doc =
        parser.parseFromString(
          html,
          "text/html"
        );

      doc
        .querySelectorAll(
          "script, iframe, object, embed, form"
        )
        .forEach(
          el => el.remove()
        );

      doc
        .querySelectorAll("*")
        .forEach(
          element => {

            [...element.attributes]
              .forEach(
                attr => {

                  const name =
                    attr.name.toLowerCase();

                  const value =
                    attr.value || "";

                  if (
                    name.startsWith(
                      "on"
                    )
                  ) {

                    element.removeAttribute(
                      attr.name
                    );

                  }

                  if (
                    (
                      name === "href" ||
                      name === "src"
                    ) &&
                    /^\s*javascript:/i.test(
                      value
                    )
                  ) {

                    element.removeAttribute(
                      attr.name
                    );

                  }

                }
              );

          }
        );

      return doc.body.innerHTML;

    }


    function renderDescription() {

      const description =
        product.description;

      if (
        !description
      ) {

        descriptionCardEl.classList.add(
          "hidden"
        );

        return;

      }

      descriptionCardEl.classList.remove(
        "hidden"
      );

      let text =
        String(description);


      /*
        Handle JSON strings that may have been
        returned by an AliExpress mobile detail.
      */

      const trimmed =
        text.trim();

      if (
        (
          trimmed.startsWith("{") &&
          trimmed.endsWith("}")
        ) ||
        (
          trimmed.startsWith("[") &&
          trimmed.endsWith("]")
        )
      ) {

        try {

          const parsed =
            JSON.parse(trimmed);

          /*
            Attempt to extract useful text
            recursively.
          */

          const pieces = [];

          function collectText(
            value
          ) {

            if (
              value === null ||
              value === undefined
            ) {
              return;
            }

            if (
              typeof value === "string"
            ) {

              const valueTrimmed =
                value.trim();

              if (
                valueTrimmed
              ) {

                if (
                  /^https?:\/\//i.test(
                    valueTrimmed
                  )
                ) {
                  return;
                }

                pieces.push(
                  valueTrimmed
                );

              }

              return;

            }

            if (
              Array.isArray(value)
            ) {

              value.forEach(
                collectText
              );

              return;

            }

            if (
              typeof value === "object"
            ) {

              const priorityKeys = [
                "text",
                "content",
                "description",
                "value",
                "title"
              ];

              for (
                const key of priorityKeys
              ) {

                if (
                  value[key] !== undefined
                ) {

                  collectText(
                    value[key]
                  );

                }

              }

            }

          }

          collectText(parsed);

          if (
            pieces.length
          ) {

            text =
              uniqueArray(
                pieces
              ).join("\n\n");

          }

        } catch {
          /*
            Leave original text untouched.
          */
        }

      }


      const looksLikeHtml =
        /<([a-z][\s\S]*?)>/i.test(
          text
        );

      if (
        looksLikeHtml
      ) {

        descriptionContentEl.innerHTML =
          sanitizeDescriptionHtml(
            text
          );

      } else {

        descriptionContentEl.textContent =
          text;

      }

    }


    /* ============================================================
       PRODUCT DETAILS
       ============================================================ */

    function renderProduct() {

      productTitleEl.textContent =
        product.title || "Product";

      document.title =
        `${product.title || "Product"} | Prasun Store`;

      /*
        Base price
      */

      productPriceEl.textContent =
        formatPrice(
          product.price,
          product.currency
        );


      /*
        Stock
      */

      const baseStock =
        product.stock !== ""
          ? toNumber(
              product.stock,
              0
            )
          : null;

      if (
        baseStock === null
      ) {

        stockTextEl.textContent =
          "Available";

        stockTextEl.className =
          "stock in-stock";

        productAvailabilityEl.textContent =
          "Available";

      } else if (
        baseStock > 0
      ) {

        stockTextEl.textContent =
          `${baseStock} available`;

        stockTextEl.className =
          "stock in-stock";

        productAvailabilityEl.textContent =
          "In stock";

      } else {

        stockTextEl.textContent =
          "Out of stock";

        stockTextEl.className =
          "stock out-of-stock";

        productAvailabilityEl.textContent =
          "Out of stock";

      }


      /*
        SKU
      */

      productSkuEl.textContent =
        product.sku || "—";


      /*
        Images
      */

      galleryImages =
        normalizeImages(
          product.images
        );

      /*
        Add SKU images to gallery.
      */

      normalizedSkus.forEach(
        sku => {

          if (
            sku.image
          ) {

            galleryImages.push(
              sku.image
            );

          }

        }
      );

      galleryImages =
        uniqueArray(
          galleryImages
        );

      renderGallery();


      /*
        Rating
      */

      renderRating();


      /*
        Description
      */

      renderDescription();


      /*
        Variants
      */

      renderVariants();


      /*
        Initial SKU
      */

      if (
        normalizedSkus.length
      ) {

        /*
          Do NOT automatically choose
          a random visible variant.

          The first SKU can be used internally
          for base pricing until buyer makes
          a selection.
        */

        selectedSku =
          normalizedSkus.find(
            sku =>
              sku.stock === null ||
              sku.stock > 0
          ) ||
          normalizedSkus[0];

      }


      /*
        Product ships to.
      */

      productShipsToEl.textContent =
        firstNonEmpty(
          product.shipping_country,
          product.shippingCountry,
          product.destination,
          product.ships_to,
          product.shipsTo,
          "Worldwide"
        );

    }


    /* ============================================================
       CART STORAGE
       ============================================================ */

    function getCart() {

      try {

        const raw =
          localStorage.getItem(
            "cart"
          );

        if (!raw) {
          return [];
        }

        const parsed =
          JSON.parse(raw);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch {

        return [];

      }

    }


    function saveCart(cart) {

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

    }


    /* ============================================================
       CART ITEM
       ============================================================ */

    function buildCartItem() {

      if (!product) {
        return null;
      }

      const productId =
        String(
          firstNonEmpty(
            product.id,
            getProductId()
          )
        );

      const variantKey =
        selectedSku
          ? String(
              selectedSku.sku ||
              selectedSku.sku_id ||
              selectedSku.skuId ||
              selectedSku.index ||
              ""
            )
          : "default";

      const selections = {};

      Object.keys(
        selectedProperties
      ).forEach(
        groupId => {

          selections[
            String(groupId)
          ] =
            String(
              selectedProperties[groupId]
            );

        }
      );

      const itemPrice =
        selectedSku &&
        selectedSku.price !== null &&
        selectedSku.price !== undefined
          ? toNumber(
              selectedSku.price,
              toNumber(
                product.price,
                0
              )
            )
          : toNumber(
              product.price,
              0
            );

      const skuImage =
        selectedSku?.image ||
        galleryImages[0] ||
        "";


      return {

        id:
          `${productId}__${variantKey}`,

        product_id:
          productId,

        title:
          product.title,

        price:
          itemPrice,

        currency:
          product.currency || "USD",

        quantity:
          quantity,

        image:
          skuImage,

        sku:
          selectedSku?.sku ||
          product.sku ||
          "",

        selected_properties:
          selections,

        variant:
          selectedSku || null

      };

    }


    /* ============================================================
       VALIDATE VARIANT SELECTION
       ============================================================ */

    function validateSelection() {

      if (
        !normalizedSkus.length
      ) {
        return true;
      }

      const groups =
        buildVariantGroups(
          normalizedSkus
        );

      const missingGroups =
        groups.filter(
          group =>
            !selectedProperties[
              String(group.id)
            ]
        );

      if (
        missingGroups.length
      ) {

        const names =
          missingGroups
            .map(
              group =>
                group.name ||
                "Option"
            )
            .join(", ");

        selectionNoticeEl.textContent =
          `Please select: ${names}`;

        selectionNoticeEl.classList.remove(
          "hidden"
        );

        return false;

      }

      const exact =
        normalizedSkus.find(
          sku =>
            skuMatchesSelection(
              sku,
              selectedProperties,
              true
            ) &&
            (
              sku.stock === null ||
              sku.stock > 0
            )
        );

      if (!exact) {

        selectionNoticeEl.textContent =
          "The selected variant is unavailable.";

        selectionNoticeEl.classList.remove(
          "hidden"
        );

        return false;

      }

      selectedSku =
        exact;

      selectionNoticeEl.classList.add(
        "hidden"
      );

      return true;

    }


    /* ============================================================
       ADD TO CART
       ============================================================ */

    function addCurrentProductToCart() {

      if (
        !validateSelection()
      ) {
        return;
      }

      const item =
        buildCartItem();

      if (!item) {
        return;
      }

      const cart =
        getCart();

      const existingIndex =
        cart.findIndex(
          existing =>
            existing.id ===
            item.id
        );

      if (
        existingIndex >= 0
      ) {

        cart[existingIndex].quantity =
          Math.max(
            1,
            toNumber(
              cart[existingIndex].quantity,
              0
            ) +
            item.quantity
          );

      } else {

        cart.push(
          item
        );

      }

      saveCart(cart);

      addToCartBtnEl.textContent =
        "Added ✓";

      setTimeout(
        () => {

          addToCartBtnEl.textContent =
            "Add to Cart";

        },
        1400
      );

    }


    /* ============================================================
       BUY NOW
       ============================================================ */

    function buyNow() {

      if (
        !validateSelection()
      ) {
        return;
      }

      const item =
        buildCartItem();

      if (!item) {
        return;
      }

      /*
        Buy Now uses the same cart structure
        and forwards to checkout.
      */

      sessionStorage.setItem(
        "buyNowItem",
        JSON.stringify(item)
      );

      window.location.href =
        "/checkout.html?buy_now=1";

    }


    /* ============================================================
       QUANTITY
       ============================================================ */

    function setQuantity(
      value
    ) {

      let next =
        parseInt(
          value,
          10
        );

      if (
        !Number.isFinite(next) ||
        next < 1
      ) {
        next = 1;
      }

      if (
        next > 999
      ) {
        next = 999;
      }

      quantity =
        next;

      quantityInputEl.value =
        String(quantity);

    }


    /* ============================================================
       EVENT LISTENERS
       ============================================================ */

    quantityMinusEl.addEventListener(
      "click",
      () => {

        setQuantity(
          quantity - 1
        );

      }
    );


    quantityPlusEl.addEventListener(
      "click",
      () => {

        setQuantity(
          quantity + 1
        );

      }
    );


    quantityInputEl.addEventListener(
      "input",
      () => {

        setQuantity(
          quantityInputEl.value
        );

      }
    );


    addToCartBtnEl.addEventListener(
      "click",
      addCurrentProductToCart
    );


    buyNowBtnEl.addEventListener(
      "click",
      buyNow
    );


    /* ============================================================
       LOAD PRODUCT
       ============================================================ */

    async function loadProduct() {

      const productId =
        getProductId();

      if (!productId) {

        throw new Error(
          "No product ID was provided."
        );

      }

      const response =
        await fetch(
          `${API_BASE}/api/products/${encodeURIComponent(
            productId
          )}`,
          {
            method: "GET",
            headers: {
              "Accept":
                "application/json"
            },
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `Product request failed with status ${response.status}.`
        );

      }

      const data =
        await response.json();

      /*
        Some Workers return:
        { product: {...} }

        Others return:
        { data: {...} }

        normalizeProduct()
        handles both.
      */

      const normalized =
        normalizeProduct(
          data
        );

      if (!normalized) {

        throw new Error(
          "The product data could not be read."
        );

      }

      product =
        normalized;

      normalizedSkus =
        normalizeSkus(
          product.skus
        );

      renderProduct();

      loadingEl.classList.add(
        "hidden"
      );

      productSectionEl.classList.remove(
        "hidden"
      );

    }


    /* ============================================================
       ERROR HANDLING
       ============================================================ */

    function showError(
      error
    ) {

      console.error(
        "Product page error:",
        error
      );

      loadingEl.classList.add(
        "hidden"
      );

      productSectionEl.classList.add(
        "hidden"
      );

      errorBoxEl.classList.remove(
        "hidden"
      );

      errorMessageEl.textContent =
        error?.message ||
        "Unable to load this product.";

    }


    /* ============================================================
       INIT
       ============================================================ */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        try {

          await loadProduct();

        } catch (
          error
        ) {

          showError(
            error
          );

        }

      }
    );

  </script>

</body>
