<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product | Prasun Store</title>

  <meta
    name="description"
    content="View product details, available options, pricing and availability at Prasun Store."
  >

  <link
    rel="canonical"
    href="https://store.prasunbarua.com/product.html"
  >

  <link
    rel="icon"
    href="/prasun-store-logo.jpeg"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f7f7f8;
      color: #171717;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
    }

    img {
      max-width: 100%;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 70px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;
      background: #ffffff;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav a {
      font-weight: 600;
      color: #333333;
    }

    .nav a:hover {
      color: #000000;
    }

    .cart-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .cart-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #111111;
      color: #ffffff;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      font-weight: 700;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .breadcrumb {
      margin-bottom: 22px;
      font-size: 14px;
      color: #707070;
    }

    .breadcrumb a {
      color: #555555;
      font-weight: 600;
    }

    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 42px;
      align-items: start;
    }

    .gallery-card,
    .product-info {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
    }

    .gallery-card {
      padding: 20px;
    }

    .main-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
    }

    /*
      The old "Product image unavailable" text is
      deliberately hidden permanently.
    */
    .image-placeholder {
      display: none !important;
    }

    .thumbnail-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .thumbnail {
      padding: 0;
      aspect-ratio: 1 / 1;
      border: 2px solid transparent;
      border-radius: 10px;
      overflow: hidden;
      background: #f7f7f7;
      cursor: pointer;
    }

    .thumbnail:hover {
      border-color: #aaaaaa;
    }

    .thumbnail.active {
      border-color: #111111;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }

    .product-info {
      padding: 30px;
    }

    .product-category {
      display: inline-block;
      margin-bottom: 10px;
      color: #666666;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .product-title {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: #555555;
      font-size: 14px;
    }

    .stars {
      color: #f59e0b;
      letter-spacing: 1px;
      font-size: 17px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .current-price {
      font-size: 32px;
      font-weight: 800;
      color: #111111;
    }

    .original-price {
      font-size: 18px;
      color: #999999;
      text-decoration: line-through;
    }

    .stock-status {
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .stock-status.in-stock {
      color: #16803c;
    }

    .stock-status.out-of-stock {
      color: #c62828;
    }

    .description {
      margin: 20px 0 26px;
      color: #444444;
      overflow-wrap: anywhere;
    }

    .description p:first-child {
      margin-top: 0;
    }

    .description p:last-child {
      margin-bottom: 0;
    }

    .description img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .variants-section {
      margin: 24px 0;
      padding-top: 22px;
      border-top: 1px solid #e8e8e8;
    }

    .variant-group {
      margin-bottom: 20px;
    }

    .variant-group:last-child {
      margin-bottom: 0;
    }

    .variant-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
      color: #222222;
    }

    .variant-options {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .variant-option {
      min-width: 44px;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      background: #ffffff;
      color: #222222;
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    .variant-option:hover:not(:disabled) {
      border-color: #111111;
    }

    .variant-option.selected {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .variant-option.unavailable {
      opacity: 0.38;
      text-decoration: line-through;
    }

    .variant-option:disabled {
      cursor: not-allowed;
    }

    .quantity-section {
      margin: 25px 0;
    }

    .quantity-label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid #cccccc;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }

    .quantity-button {
      width: 42px;
      height: 42px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      font-size: 20px;
    }

    .quantity-button:hover:not(:disabled) {
      background: #f3f3f3;
    }

    .quantity-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .quantity-input {
      width: 55px;
      height: 42px;
      padding: 0;
      border: 0;
      border-left: 1px solid #dddddd;
      border-right: 1px solid #dddddd;
      text-align: center;
      outline: none;
      background: #ffffff;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      min-height: 52px;
      padding: 13px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #2a2a2a;
    }

    .btn-secondary {
      background: #ffffff;
      color: #111111;
      border: 1px solid #111111;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f4f4f4;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none !important;
    }

    .message {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #e9f8ef;
      color: #176b35;
      border: 1px solid #bce8cb;
    }

    .message.error {
      background: #fff0f0;
      color: #9f1d1d;
      border: 1px solid #f0c0c0;
    }

    .loading {
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666666;
      font-size: 16px;
    }

    .error-state {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 40px 25px;
      text-align: center;
    }

    .error-state h1 {
      margin-top: 0;
    }

    .back-button {
      display: inline-flex;
      margin-top: 15px;
      padding: 11px 16px;
      border-radius: 9px;
      background: #111111;
      color: #ffffff;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    .sku-info {
      margin-top: 18px;
      color: #777777;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .product-info {
        padding: 22px;
      }

      .gallery-card {
        padding: 14px;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 9px 14px;
      }

      .brand-name {
        font-size: 17px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .nav {
        gap: 12px;
        font-size: 14px;
      }

      .page {
        padding: 20px 12px 45px;
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      .product-title {
        font-size: 30px;
      }

      .current-price {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a
        href="/"
        class="brand"
        aria-label="Prasun Store Home"
      >
        <img
          src="/prasun-store-logo.jpeg"
          alt="Prasun Store"
          width="48"
          height="48"
        >

        <span class="brand-name">
          Prasun Store
        </span>
      </a>

      <nav class="nav" aria-label="Main navigation">

        <a href="/">
          Shop
        </a>

        <a
          href="/cart.html"
          class="cart-link"
        >
          Cart
          <span
            id="cart-count"
            class="cart-count"
          >
            0
          </span>
        </a>

      </nav>

    </div>
  </header>


  <main class="page">

    <div class="breadcrumb">
      <a href="/">Shop</a>
      <span> / </span>
      <span id="breadcrumb-title">Product</span>
    </div>


    <div id="loading-state" class="loading">
      Loading product...
    </div>


    <div
      id="error-state"
      class="error-state hidden"
    >
      <h1>Product Not Found</h1>

      <p id="error-message">
        We could not load this product.
      </p>

      <a
        href="/"
        class="back-button"
      >
        Back to Shop
      </a>
    </div>


    <section
      id="product-layout"
      class="product-layout hidden"
    >

      <!-- ======================================================
           PRODUCT GALLERY
           ====================================================== -->

      <div class="gallery-card">

        <div class="main-image-wrap">

          <img
            id="main-product-image"
            class="main-image"
            src="/prasun-store-logo.jpeg"
            alt="Prasun Store product image"
            width="800"
            height="800"
            loading="eager"
            decoding="async"
          >

          <!--
            Intentionally empty.
            It is hidden permanently so the old
            "Product image unavailable" text never appears.
          -->
          <div
            id="image-placeholder"
            class="image-placeholder"
            hidden
            aria-hidden="true"
          ></div>

        </div>


        <div
          id="thumbnail-list"
          class="thumbnail-list"
        ></div>

      </div>


      <!-- ======================================================
           PRODUCT INFORMATION
           ====================================================== -->

      <div class="product-info">

        <div
          id="product-category"
          class="product-category"
        ></div>


        <h1
          id="product-title"
          class="product-title"
        >
          Product
        </h1>


        <div class="rating-row">

          <span
            id="rating-stars"
            class="stars"
          >
            ★★★★★
          </span>

          <span
            id="rating-text"
          >
            No reviews
          </span>

        </div>


        <div class="price-row">

          <span
            id="current-price"
            class="current-price"
          >
            —
          </span>

          <span
            id="original-price"
            class="original-price hidden"
          ></span>

        </div>


        <div
          id="stock-status"
          class="stock-status"
        ></div>


        <!-- ====================================================
             VARIANTS
             ==================================================== -->

        <section
          id="variants-section"
          class="variants-section"
          hidden
        >

          <div id="variants-container"></div>

        </section>


        <!-- ====================================================
             DESCRIPTION
             ==================================================== -->

        <div
          id="product-description"
          class="description"
        ></div>


        <!-- ====================================================
             QUANTITY
             ==================================================== -->

        <div class="quantity-section">

          <label
            class="quantity-label"
            for="quantity-input"
          >
            Quantity
          </label>

          <div class="quantity-control">

            <button
              type="button"
              id="quantity-minus"
              class="quantity-button"
              aria-label="Decrease quantity"
            >
              −
            </button>

            <input
              type="number"
              id="quantity-input"
              class="quantity-input"
              value="1"
              min="1"
              max="999"
              inputmode="numeric"
              aria-label="Quantity"
            >

            <button
              type="button"
              id="quantity-plus"
              class="quantity-button"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

        </div>


        <!-- ====================================================
             ACTION BUTTONS
             ==================================================== -->

        <div class="action-buttons">

          <button
            type="button"
            id="add-to-cart-button"
            class="btn btn-secondary"
          >
            Add to Cart
          </button>

          <button
            type="button"
            id="buy-now-button"
            class="btn btn-primary"
          >
            Buy Now
          </button>

        </div>


        <div
          id="action-message"
          class="message"
          role="status"
          aria-live="polite"
        ></div>


        <div
          id="sku-info"
          class="sku-info hidden"
        ></div>

      </div>

    </section>

  </main>


  <script>
    "use strict";


    /* ============================================================
       CONFIGURATION
       ============================================================ */

    const API_BASE =
      "https://prasun-store.prasun301.workers.dev";

    const CART_STORAGE_KEY =
      "prasun_cart";

    const LEGACY_CART_KEY =
      "cart";

    const BUY_NOW_STORAGE_KEY =
      "prasun_buy_now";

    const DEFAULT_IMAGE =
      "/prasun-store-logo.jpeg";


    const PRODUCT_ID =
      new URLSearchParams(window.location.search).get("id");


    /* ============================================================
       DOM ELEMENTS
       ============================================================ */

    const loadingState =
      document.getElementById("loading-state");

    const errorState =
      document.getElementById("error-state");

    const errorMessage =
      document.getElementById("error-message");

    const productLayout =
      document.getElementById("product-layout");

    const breadcrumbTitle =
      document.getElementById("breadcrumb-title");

    const productCategory =
      document.getElementById("product-category");

    const productTitle =
      document.getElementById("product-title");

    const ratingStars =
      document.getElementById("rating-stars");

    const ratingText =
      document.getElementById("rating-text");

    const currentPrice =
      document.getElementById("current-price");

    const originalPrice =
      document.getElementById("original-price");

    const stockStatus =
      document.getElementById("stock-status");

    const variantsSection =
      document.getElementById("variants-section");

    const variantsContainer =
      document.getElementById("variants-container");

    const productDescription =
      document.getElementById("product-description");

    const mainProductImage =
      document.getElementById("main-product-image");

    const imagePlaceholder =
      document.getElementById("image-placeholder");

    const thumbnailList =
      document.getElementById("thumbnail-list");

    const quantityMinus =
      document.getElementById("quantity-minus");

    const quantityPlus =
      document.getElementById("quantity-plus");

    const quantityInput =
      document.getElementById("quantity-input");

    const addToCartButton =
      document.getElementById("add-to-cart-button");

    const buyNowButton =
      document.getElementById("buy-now-button");

    const actionMessage =
      document.getElementById("action-message");

    const skuInfo =
      document.getElementById("sku-info");

    const cartCount =
      document.getElementById("cart-count");


    /* ============================================================
       APPLICATION STATE
       ============================================================ */

    let product = null;

    let selectedProperties = {};

    let selectedSku = null;

    let currentImageIndex = 0;


    /* ============================================================
       BASIC HELPERS
       ============================================================ */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function firstValid(...values) {

      for (const value of values) {

        if (
          value !== null &&
          value !== undefined &&
          String(value).trim() !== ""
        ) {
          return value;
        }

      }

      return null;
    }


    function toNumber(value, fallback = null) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return fallback;
      }

      const number =
        Number(
          String(value)
            .replace(/,/g, "")
            .replace(/[$€£¥]/g, "")
            .trim()
        );

      return Number.isFinite(number)
        ? number
        : fallback;
    }


    function formatPrice(value) {

      const number =
        toNumber(value, 0);

      return new Intl.NumberFormat(
        "en-US",
        {
          style: "currency",
          currency: "USD"
        }
      ).format(number);

    }


    function clamp(value, min, max) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    /* ============================================================
       URL / IMAGE HELPERS
       ============================================================ */

    function normalizeUrl(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return null;
      }

      let url =
        String(value).trim();

      if (!url) {
        return null;
      }

      /*
        Handle protocol-relative URLs.
      */
      if (url.startsWith("//")) {
        url = "https:" + url;
      }

      /*
        Ignore obvious non-image placeholders.
      */
      const lower =
        url.toLowerCase();

      if (
        lower === "null" ||
        lower === "undefined" ||
        lower === "n/a" ||
        lower === "none"
      ) {
        return null;
      }

      return url;
    }


    function safeImageUrl(value) {

      const url =
        normalizeUrl(value);

      return url || DEFAULT_IMAGE;
    }


    function extractImageValue(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return null;
      }

      if (typeof value === "string") {
        return value.trim();
      }

      if (typeof value === "object") {

        return firstValid(

          value.url,

          value.src,

          value.image,

          value.imageUrl,

          value.imageURL,

          value.image_url,

          value.img,

          value.imgUrl,

          value.img_url,

          value.productImg,

          value.product_img,

          value.mainImage,

          value.main_image,

          value.mainImageUrl,

          value.main_image_url

        );

      }

      return null;
    }


    function addImageCandidate(
      images,
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {
        return;
      }


      /*
        Direct string.
      */
      if (typeof value === "string") {

        const text =
          value.trim();

        if (!text) {
          return;
        }


        /*
          Some APIs return multiple image URLs
          separated by commas, pipes or line breaks.
        */
        const pieces =
          text.split(
            /[\n\r|]+/
          );

        for (const piece of pieces) {

          const trimmed =
            piece.trim();

          if (!trimmed) {
            continue;
          }

          const url =
            normalizeUrl(trimmed);

          if (
            url &&
            !images.includes(url)
          ) {
            images.push(url);
          }

        }

        return;
      }


      /*
        Object containing an image URL.
      */
      const extracted =
        extractImageValue(value);

      if (extracted) {

        const url =
          normalizeUrl(extracted);

        if (
          url &&
          !images.includes(url)
        ) {
          images.push(url);
        }

      }

    }


    function normalizeImages(data) {

      const images = [];


      const directFields = [

        data?.images,

        data?.image,

        data?.img,

        data?.imageUrl,

        data?.imageURL,

        data?.image_url,

        data?.imgUrl,

        data?.img_url,

        data?.productImg,

        data?.product_img,

        data?.productImage,

        data?.product_image,

        data?.mainImage,

        data?.main_image,

        data?.mainImageUrl,

        data?.main_image_url,

        data?.coverImage,

        data?.cover_image,

        data?.thumbnail,

        data?.thumb

      ];


      for (
        const field of directFields
      ) {

        if (Array.isArray(field)) {

          for (const item of field) {

            addImageCandidate(
              images,
              item
            );

          }

        } else {

          addImageCandidate(
            images,
            field
          );

        }

      }


      /*
        Additional possible image collections.
      */
      const collections = [

        data?.imageList,

        data?.image_list,

        data?.imageUrls,

        data?.image_urls,

        data?.gallery,

        data?.galleryImages,

        data?.gallery_images,

        data?.productImages,

        data?.product_images

      ];


      for (
        const collection of collections
      ) {

        if (
          Array.isArray(collection)
        ) {

          for (
            const item of collection
          ) {

            addImageCandidate(
              images,
              item
            );

          }

        }

      }


      /*
        Variant images can also be useful.
      */
      const variants =
        getVariantArrayRaw(data);

      for (
        const variant of variants
      ) {

        addImageCandidate(
          images,
          variant?.image
        );

        addImageCandidate(
          images,
          variant?.imageUrl
        );

        addImageCandidate(
          images,
          variant?.image_url
        );

        addImageCandidate(
          images,
          variant?.img
        );

        addImageCandidate(
          images,
          variant?.imgUrl
        );

        addImageCandidate(
          images,
          variant?.productImg
        );

        addImageCandidate(
          images,
          variant?.product_img
        );

      }


      /*
        IMPORTANT:
        Always provide a usable image so the page
        never displays a broken-image placeholder.
      */
      if (!images.length) {
        images.push(DEFAULT_IMAGE);
      }


      return images;

    }


    /* ============================================================
       DESCRIPTION SANITIZER
       ============================================================ */

    function sanitizeDescription(html) {

      if (
        html === null ||
        html === undefined
      ) {
        return "";
      }


      let text =
        String(html);


      /*
        Remove dangerous elements.
      */
      text =
        text.replace(
          /<script[\s\S]*?>[\s\S]*?<\/script>/gi,
          ""
        );


      text =
        text.replace(
          /<iframe[\s\S]*?>[\s\S]*?<\/iframe>/gi,
          ""
        );


      text =
        text.replace(
          /<object[\s\S]*?>[\s\S]*?<\/object>/gi,
          ""
        );


      text =
        text.replace(
          /<embed[\s\S]*?>/gi,
          ""
        );


      /*
        Remove javascript: URLs.
      */
      text =
        text.replace(
          /javascript\s*:/gi,
          ""
        );


      /*
        Remove inline event handlers.
      */
      text =
        text.replace(
          /\son[a-z]+\s*=\s*(".*?"|'.*?'|[^\s>]+)/gi,
          ""
        );


      return text;

    }


    /* ============================================================
       RAW VARIANT ARRAY
       ============================================================ */

    function getVariantArrayRaw(data) {

      const candidates = [

        data?.variants,

        data?.variantList,

        data?.variant_list,

        data?.skus,

        data?.skuList,

        data?.sku_list,

        data?.SKUList,

        data?.products

      ];


      for (
        const candidate of candidates
      ) {

        if (
          Array.isArray(candidate)
        ) {
          return candidate;
        }

      }


      return [];

    }


    /* ============================================================
       VARIANT NORMALIZATION
       ============================================================ */

    function normalizeVariant(
      variant,
      index
    ) {

      if (
        !variant ||
        typeof variant !== "object"
      ) {
        return null;
      }


      const id =
        firstValid(

          variant.id,

          variant.skuId,

          variant.sku_id,

          variant.variantId,

          variant.variant_id,

          variant.vid,

          variant.code,

          variant.sku,

          variant.SKU,

          `variant-${index}`

        );


      const sku =
        firstValid(

          variant.sku,

          variant.SKU,

          variant.skuCode,

          variant.sku_code,

          variant.code,

          variant.id

        );


      const title =
        firstValid(

          variant.title,

          variant.name,

          variant.variantName,

          variant.variant_name,

          variant.label,

          sku,

          `Variant ${index + 1}`

        );


      const price =
        toNumber(

          firstValid(

            variant.price,

            variant.salePrice,

            variant.sale_price,

            variant.sellPrice,

            variant.sell_price,

            variant.amount,

            variant.currentPrice,

            variant.current_price

          ),

          null

        );


      const originalPrice =
        toNumber(

          firstValid(

            variant.originalPrice,

            variant.original_price,

            variant.compareAtPrice,

            variant.compare_at_price,

            variant.marketPrice,

            variant.market_price,

            variant.retailPrice,

            variant.retail_price

          ),

          null

        );


      let stock =
        toNumber(

          firstValid(

            variant.stock,

            variant.inventory,

            variant.inventoryQty,

            variant.inventory_qty,

            variant.quantity,

            variant.qty,

            variant.stockQuantity,

            variant.stock_quantity,

            variant.availableStock,

            variant.available_stock

          ),

          null

        );


      /*
        Explicit stock flags.
      */
      if (
        stock === null &&
        (
          variant.inStock === false ||
          variant.in_stock === false ||
          variant.available === false
        )
      ) {
        stock = 0;
      }


      const image =
        firstValid(

          extractImageValue(
            variant.image
          ),

          extractImageValue(
            variant.imageUrl
          ),

          extractImageValue(
            variant.image_url
          ),

          extractImageValue(
            variant.img
          ),

          extractImageValue(
            variant.imgUrl
          ),

          extractImageValue(
            variant.productImg
          ),

          extractImageValue(
            variant.product_img
          )

        );


      /*
        Properties can arrive in many shapes.
      */
      let properties = [];


      const rawProperties =
        firstValid(

          variant.properties,

          variant.options,

          variant.attributes,

          variant.variantProperties,

          variant.variant_properties,

          variant.specifications,

          variant.specs

        );


      if (
        Array.isArray(rawProperties)
      ) {

        for (
          const property of rawProperties
        ) {

          if (
            property === null ||
            property === undefined
          ) {
            continue;
          }


          if (
            typeof property === "string"
          ) {

            const separatorIndex =
              property.indexOf(":");


            if (
              separatorIndex > 0
            ) {

              const groupName =
                property
                  .slice(0, separatorIndex)
                  .trim();

              const value =
                property
                  .slice(separatorIndex + 1)
                  .trim();


              if (
                groupName &&
                value
              ) {

                properties.push({

                  groupName,

                  valueId: value,

                  valueName: value

                });

              }

            }

            continue;
          }


          if (
            typeof property === "object"
          ) {

            const groupName =
              firstValid(

                property.groupName,

                property.group,

                property.group_name,

                property.name,

                property.attributeName,

                property.attribute_name,

                property.key,

                property.label

              );


            const valueId =
              firstValid(

                property.valueId,

                property.value_id,

                property.id,

                property.optionId,

                property.option_id,

                property.value,

                property.valueName,

                property.value_name,

                property.option,

                property.optionName,

                property.option_name

              );


            const valueName =
              firstValid(

                property.valueName,

                property.value_name,

                property.name,

                property.value,

                property.optionName,

                property.option_name,

                valueId

              );


            if (
              groupName &&
              valueId !== null &&
              valueId !== undefined
            ) {

              properties.push({

                groupName:
                  String(groupName),

                valueId:
                  String(valueId),

                valueName:
                  String(valueName)

              });

            }

          }

        }

      }


      /*
        CJ sometimes provides a variant key such as:

        "Color:Black;Size:M"

        or:

        "Black,M"
      */
      const variantKey =
        firstValid(

          variant.variantKey,

          variant.variant_key,

          variant.key,

          variant.optionKey,

          variant.option_key,

          variant.specKey,

          variant.spec_key

        );


      if (
        !properties.length &&
        typeof variantKey === "string"
      ) {

        const chunks =
          variantKey
            .split(/[;,|]/)
            .map(item => item.trim())
            .filter(Boolean);


        for (
          const chunk of chunks
        ) {

          const colon =
            chunk.indexOf(":");


          if (
            colon > 0
          ) {

            const groupName =
              chunk
                .slice(0, colon)
                .trim();

            const value =
              chunk
                .slice(colon + 1)
                .trim();


            if (
              groupName &&
              value
            ) {

              properties.push({

                groupName,

                valueId: value,

                valueName: value

              });

            }

          }

        }

      }


      /*
        Some APIs expose a flat object such as:

        {
          color: "Black",
          size: "M"
        }
      */
      if (!properties.length) {

        const excludedKeys =
          new Set([

            "id",
            "sku",
            "SKU",
            "price",
            "stock",
            "inventory",
            "quantity",
            "qty",
            "name",
            "title",
            "image",
            "imageUrl",
            "image_url",
            "img",
            "productImg",
            "product_img"

          ]);


        for (
          const [
            key,
            value
          ] of Object.entries(variant)
        ) {

          if (
            excludedKeys.has(key)
          ) {
            continue;
          }


          if (
            value === null ||
            value === undefined
          ) {
            continue;
          }


          if (
            typeof value === "string" ||
            typeof value === "number"
          ) {

            const lowerKey =
              key.toLowerCase();


            if (
              lowerKey.includes("color") ||
              lowerKey.includes("size") ||
              lowerKey.includes("style") ||
              lowerKey.includes("material") ||
              lowerKey.includes("type")
            ) {

              properties.push({

                groupName: key,

                valueId:
                  String(value),

                valueName:
                  String(value)

              });

            }

          }

        }

      }


      return {

        ...variant,

        id,

        sku,

        title,

        price,

        originalPrice,

        stock,

        image,

        properties

      };

    }


    /* ============================================================
       PRODUCT NORMALIZATION
       ============================================================ */

    function normalizeProduct(data) {

      let source =
        data;


      /*
        Unwrap common Worker/API response structures.
      */
      if (
        source?.product
      ) {
        source =
          source.product;
      } else if (
        source?.data?.product
      ) {
        source =
          source.data.product;
      } else if (
        source?.data?.data
      ) {
        source =
          source.data.data;
      } else if (
        source?.result?.product
      ) {
        source =
          source.result.product;
      } else if (
        source?.result
      ) {
        source =
          source.result;
      } else if (
        source?.data
      ) {
        source =
          source.data;
      }


      if (
        !source ||
        typeof source !== "object"
      ) {
        throw new Error(
          "Invalid product response."
        );
      }


      const variantsRaw =
        getVariantArrayRaw(source);


      const variants =
        variantsRaw
          .map(
            normalizeVariant
          )
          .filter(Boolean);


      const title =
        firstValid(

          source.title,

          source.name,

          source.productName,

          source.product_name,

          "Product"

        );


      const id =
        firstValid(

          source.id,

          source.productId,

          source.product_id,

          source.pid,

          PRODUCT_ID

        );


      const category =
        firstValid(

          source.category,

          source.categoryName,

          source.category_name,

          source.type,

          ""

        );


      const rating =
        toNumber(

          firstValid(

            source.rating,

            source.averageRating,

            source.average_rating,

            source.avgRating,

            source.avg_rating

          ),

          0

        );


      const sales =
        toNumber(

          firstValid(

            source.sales,

            source.sold,

            source.soldCount,

            source.sold_count,

            source.totalSales,

            source.total_sales

          ),

          0

        );


      let price =
        toNumber(

          firstValid(

            source.price,

            source.salePrice,

            source.sale_price,

            source.sellPrice,

            source.sell_price,

            source.currentPrice,

            source.current_price,

            source.amount

          ),

          null

        );


      const originalPrice =
        toNumber(

          firstValid(

            source.originalPrice,

            source.original_price,

            source.compareAtPrice,

            source.compare_at_price,

            source.marketPrice,

            source.market_price,

            source.retailPrice,

            source.retail_price

          ),

          null

        );


      let stock =
        toNumber(

          firstValid(

            source.stock,

            source.inventory,

            source.inventoryQty,

            source.inventory_qty,

            source.quantity,

            source.qty,

            source.stockQuantity,

            source.stock_quantity,

            source.availableStock,

            source.available_stock

          ),

          null

        );


      if (
        stock === null &&
        (
          source.inStock === false ||
          source.in_stock === false ||
          source.available === false
        )
      ) {
        stock = 0;
      }


      /*
        If product-level price is absent,
        use the first variant price.
      */
      if (
        price === null &&
        variants.length
      ) {

        const firstVariantPrice =
          variants.find(
            variant =>
              variant.price !== null
          );

        if (
          firstVariantPrice
        ) {
          price =
            firstVariantPrice.price;
        }

      }


      /*
        If product-level stock is absent,
        and there are no real selectable variants,
        use the first variant stock where sensible.
      */
      if (
        stock === null &&
        variants.length === 1 &&
        variants[0].stock !== null
      ) {

        stock =
          variants[0].stock;

      }


      const description =
        firstValid(

          source.description,

          source.descriptionHtml,

          source.description_html,

          source.detail,

          source.productDetail,

          source.product_detail,

          source.content,

          source.body,

          ""

        );


      return {

        ...source,

        id,

        title: String(title),

        category:
          category
            ? String(category)
            : "",

        rating,

        sales,

        price,

        originalPrice,

        stock,

        description:
          String(description || ""),

        images:
          normalizeImages(source),

        variants

      };

    }


    /* ============================================================
       FETCH PRODUCT
       ============================================================ */

    async function fetchProduct() {

      if (!PRODUCT_ID) {

        throw new Error(
          "No product ID was provided in the URL."
        );

      }


      const url =
        `${API_BASE}/api/products/${encodeURIComponent(PRODUCT_ID)}`;


      const response =
        await fetch(
          url,
          {
            method: "GET",
            headers: {
              "Accept":
                "application/json"
            },
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `Product request failed (${response.status}).`
        );

      }


      const data =
        await response.json();


      return normalizeProduct(
        data
      );

    }


    /* ============================================================
       CART FUNCTIONS
       ============================================================ */

    function readStorageArray(key) {

      try {

        const raw =
          localStorage.getItem(key);


        if (!raw) {
          return [];
        }


        const parsed =
          JSON.parse(raw);


        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        console.warn(
          `Could not read ${key}:`,
          error
        );

        return [];

      }

    }


    function readCart() {

      const current =
        readStorageArray(
          CART_STORAGE_KEY
        );


      if (current.length) {
        return current;
      }


      const legacy =
        readStorageArray(
          LEGACY_CART_KEY
        );


      return legacy;

    }


    function saveCart(cart) {

      const serialized =
        JSON.stringify(cart);


      localStorage.setItem(
        CART_STORAGE_KEY,
        serialized
      );


      /*
        Keep the old cart key synchronized
        for compatibility with the existing site.
      */
      localStorage.setItem(
        LEGACY_CART_KEY,
        serialized
      );


      updateCartCount();

    }


    function cartItemKey(item) {

      const productId =
        item.product_id ||
        item.productId ||
        item.id ||
        "";


      const sku =
        item.sku ||
        item.variantId ||
        item.variant_id ||
        "";


      const properties =
        item.selectedProperties || {};


      const propertyString =
        Object.keys(properties)
          .sort()
          .map(
            key =>
              `${key}:${properties[key]}`
          )
          .join("|");


      return [
        String(productId),
        String(sku),
        propertyString
      ].join("::");

    }


    function updateCartCount() {

      const cart =
        readCart();


      let count = 0;


      for (
        const item of cart
      ) {

        const quantity =
          toNumber(
            item?.quantity,
            0
          );


        if (
          quantity > 0
        ) {
          count += quantity;
        }

      }


      cartCount.textContent =
        String(count);

    }


    /* ============================================================
       GALLERY
       ============================================================ */

    function renderGallery() {

      const images =
        Array.isArray(product.images) &&
        product.images.length
          ? product.images
          : [DEFAULT_IMAGE];


      currentImageIndex =
        clamp(
          currentImageIndex,
          0,
          images.length - 1
        );


      thumbnailList.innerHTML =
        "";


      images.forEach(
        (image, index) => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "thumbnail";


          button.setAttribute(
            "aria-label",
            `View product image ${index + 1}`
          );


          const img =
            document.createElement(
              "img"
            );


          img.src =
            safeImageUrl(image);


          img.alt =
            `${product.title} image ${index + 1}`;


          img.loading =
            index === 0
              ? "eager"
              : "lazy";


          img.decoding =
            "async";


          img.onerror =
            function () {

              this.onerror =
                null;

              this.src =
                DEFAULT_IMAGE;

            };


          button.appendChild(
            img
          );


          button.addEventListener(
            "click",
            () => {

              currentImageIndex =
                index;

              renderMainImage();

            }
          );


          thumbnailList.appendChild(
            button
          );

        }
      );


      renderMainImage();

    }


    function renderMainImage() {

      const images =
        Array.isArray(product.images) &&
        product.images.length
          ? product.images
          : [DEFAULT_IMAGE];


      currentImageIndex =
        clamp(
          currentImageIndex,
          0,
          images.length - 1
        );


      const image =
        images[currentImageIndex] ||
        DEFAULT_IMAGE;


      /*
        Never show the old placeholder.
      */
      imagePlaceholder.hidden =
        true;

      imagePlaceholder.style.display =
        "none";


      mainProductImage.hidden =
        false;

      mainProductImage.style.display =
        "block";


      mainProductImage.alt =
        product.title
          ? `${product.title} product image`
          : "Prasun Store product image";


      mainProductImage.onerror =
        function () {

          this.onerror =
            null;

          this.src =
            DEFAULT_IMAGE;

          this.alt =
            "Prasun Store product image";

        };


      mainProductImage.src =
        safeImageUrl(image);


      thumbnailList
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          (
            thumbnail,
            index
          ) => {

            thumbnail.classList.toggle(
              "active",
              index === currentImageIndex
            );

          }
        );

    }


    /* ============================================================
       RATING
       ============================================================ */

    function renderRating() {

      const rating =
        clamp(
          toNumber(
            product.rating,
            0
          ),
          0,
          5
        );


      const rounded =
        Math.round(rating);


      ratingStars.textContent =
        "★".repeat(rounded) +
        "☆".repeat(5 - rounded);


      if (
        rating > 0
      ) {

        ratingText.textContent =
          rating.toFixed(1);

      } else {

        ratingText.textContent =
          "No reviews";

      }

    }


    /* ============================================================
       VARIANT GROUPS
       ============================================================ */

    function buildVariantGroups() {

      const groups =
        new Map();


      if (
        !product ||
        !Array.isArray(product.variants)
      ) {
        return groups;
      }


      for (
        const variant of product.variants
      ) {

        if (
          !Array.isArray(
            variant.properties
          )
        ) {
          continue;
        }


        for (
          const property
          of variant.properties
        ) {

          if (
            !property?.groupName ||
            property.valueId === null ||
            property.valueId === undefined
          ) {
            continue;
          }


          const groupName =
            String(
              property.groupName
            );


          if (
            !groups.has(groupName)
          ) {

            groups.set(
              groupName,
              new Map()
            );

          }


          const values =
            groups.get(
              groupName
            );


          const valueId =
            String(
              property.valueId
            );


          if (
            !values.has(valueId)
          ) {

            values.set(
              valueId,
              {

                id:
                  valueId,

                name:
                  String(
                    property.valueName ??
                    valueId
                  )

              }
            );

          }

        }

      }


      return groups;

    }


    /* ============================================================
       EXACT SKU MATCH
       ============================================================ */

    function findExactSku() {

      if (
        !product ||
        !product.variants.length
      ) {
        return null;
      }


      const groups =
        buildVariantGroups();


      /*
        IMPORTANT FIX:

        If there are variants but no actual selectable
        property groups, do not force the customer to
        select a non-existent option.

        Use the first usable variant instead.
      */
      if (
        !groups.size
      ) {

        if (
          product.variants.length === 1
        ) {
          return product.variants[0];
        }


        /*
          Multiple SKU records without selectable
          properties. Prefer a usable in-stock SKU.
        */
        const usable =
          product.variants.find(
            variant =>
              variant.stock === null ||
              variant.stock > 0
          );


        return usable ||
          product.variants[0] ||
          null;

      }


      /*
        Real selectable variants:
        every group must have a selection.
      */
      for (
        const groupName
        of groups.keys()
      ) {

        if (
          !selectedProperties[groupName]
        ) {
          return null;
        }

      }


      return (
        product.variants.find(
          variant => {

            for (
              const property
              of variant.properties
            ) {

              if (
                selectedProperties[
                  property.groupName
                ] !==
                String(
                  property.valueId
                )
              ) {

                return false;

              }

            }


            return true;

          }
        ) ||
        null
      );

    }


    /* ============================================================
       OPTION AVAILABILITY
       ============================================================ */

    function isOptionAvailable(
      groupName,
      valueId
    ) {

      const variants =
        product.variants.filter(
          variant => {

            if (
              !Array.isArray(
                variant.properties
              )
            ) {
              return false;
            }


            return variant.properties.some(
              property =>
                String(
                  property.groupName
                ) ===
                  String(groupName) &&
                String(
                  property.valueId
                ) ===
                  String(valueId)
            );

          }
        );


      if (!variants.length) {
        return false;
      }


      /*
        If stock is unknown, treat the option
        as potentially available.
      */
      return variants.some(
        variant =>
          variant.stock === null ||
          variant.stock > 0
      );

    }


    /* ============================================================
       RENDER VARIANTS
       ============================================================ */

    function renderVariants() {

      variantsContainer.innerHTML =
        "";


      const groups =
        buildVariantGroups();


      /*
        IMPORTANT FIX:

        Products can contain a variants array even when
        there are no real selectable options.

        In that case, hide the variant UI and allow
        normal purchasing.
      */
      if (
        !groups ||
        !groups.size
      ) {

        variantsSection.hidden =
          true;

        selectedProperties =
          {};

        selectedSku =
          null;

        updateVariantState();

        return;

      }


      variantsSection.hidden =
        false;


      for (
        const [
          groupName,
          values
        ] of groups.entries()
      ) {

        const group =
          document.createElement(
            "div"
          );


        group.className =
          "variant-group";


        const label =
          document.createElement(
            "span"
          );


        label.className =
          "variant-label";


        label.textContent =
          groupName;


        group.appendChild(
          label
        );


        const options =
          document.createElement(
            "div"
          );


        options.className =
          "variant-options";


        for (
          const [
            valueId,
            value
          ] of values.entries()
        ) {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "variant-option";


          button.dataset.group =
            groupName;


          button.dataset.value =
            valueId;


          button.textContent =
            value.name;


          const available =
            isOptionAvailable(
              groupName,
              valueId
            );


          if (!available) {

            button.disabled =
              true;

            button.classList.add(
              "unavailable"
            );

          }


          button.addEventListener(
            "click",
            () => {

              selectedProperties[
                groupName
              ] =
                valueId;


              updateVariantState();

            }
          );


          options.appendChild(
            button
          );

        }


        group.appendChild(
          options
        );


        variantsContainer.appendChild(
          group
        );

      }


      updateVariantState();

    }


    /* ============================================================
       UPDATE VARIANT STATE
       ============================================================ */

    function updateVariantState() {

      /*
        Mark selected options.
      */
      variantsContainer
        .querySelectorAll(
          ".variant-option"
        )
        .forEach(
          button => {

            const selected =
              selectedProperties[
                button.dataset.group
              ] ===
              button.dataset.value;


            button.classList.toggle(
              "selected",
              selected
            );

          }
        );


      selectedSku =
        findExactSku();


      /*
        If the selected SKU has its own image,
        use it.
      */
      if (
        selectedSku?.image
      ) {

        const variantImage =
          safeImageUrl(
            selectedSku.image
          );


        const index =
          product.images.indexOf(
            variantImage
          );


        if (
          index >= 0
        ) {

          currentImageIndex =
            index;

          renderMainImage();

        }

      }


      updateDisplayedPrice();

      updateStockStatus();

      updateActionButtons();

    }


    /* ============================================================
       PRICE
       ============================================================ */

    function updateDisplayedPrice() {

      let price =
        product.price;


      let comparePrice =
        product.originalPrice;


      /*
        If a real SKU is selected,
        use its price.
      */
      if (
        selectedSku
      ) {

        if (
          selectedSku.price !== null
        ) {

          price =
            selectedSku.price;

        }


        if (
          selectedSku.originalPrice !== null
        ) {

          comparePrice =
            selectedSku.originalPrice;

        }

      }


      /*
        If no product price exists, find the first
        usable variant price.
      */
      if (
        price === null ||
        price === undefined
      ) {

        const pricedVariant =
          product.variants.find(
            variant =>
              variant.price !== null
          );


        if (
          pricedVariant
        ) {

          price =
            pricedVariant.price;

        }

      }


      currentPrice.textContent =
        price !== null &&
        price !== undefined
          ? formatPrice(price)
          : "Price unavailable";


      if (
        comparePrice !== null &&
        comparePrice !== undefined &&
        price !== null &&
        comparePrice > price
      ) {

        originalPrice.textContent =
          formatPrice(
            comparePrice
          );

        originalPrice.classList.remove(
          "hidden"
        );

      } else {

        originalPrice.textContent =
          "";

        originalPrice.classList.add(
          "hidden"
        );

      }

    }


    /* ============================================================
       STOCK
       ============================================================ */

    function getCurrentStock() {

      /*
        Real selected SKU.
      */
      if (
        selectedSku &&
        selectedSku.stock !== null
      ) {

        return selectedSku.stock;

      }


      /*
        Product-level stock.
      */
      if (
        product.stock !== null
      ) {

        return product.stock;

      }


      /*
        If variants exist but there are no selectable
        groups, use a usable variant's stock.
      */
      const groups =
        buildVariantGroups();


      if (
        product.variants.length &&
        !groups.size
      ) {

        const variant =
          selectedSku ||
          product.variants.find(
            item =>
              item.stock !== null
          );


        if (
          variant &&
          variant.stock !== null
        ) {

          return variant.stock;

        }

      }


      return null;

    }


    function updateStockStatus() {

      const stock =
        getCurrentStock();


      if (
        stock === null
      ) {

        stockStatus.textContent =
          "Available";

        stockStatus.className =
          "stock-status in-stock";

        return;

      }


      if (
        stock <= 0
      ) {

        stockStatus.textContent =
          "Out of stock";

        stockStatus.className =
          "stock-status out-of-stock";

        return;

      }


      if (
        stock <= 5
      ) {

        stockStatus.textContent =
          `Only ${stock} left in stock`;

      } else {

        stockStatus.textContent =
          "In stock";

      }


      stockStatus.className =
        "stock-status in-stock";

    }


    /* ============================================================
       PURCHASE AVAILABILITY
       ============================================================ */

    function canPurchase() {

      if (
        !product
      ) {
        return false;
      }


      const variantGroupsMap =
        buildVariantGroups();


      const hasSelectableVariants =
        variantGroupsMap &&
        variantGroupsMap.size > 0;


      /*
        REAL VARIANTS:
        Customer must choose all required options.
      */
      if (
        hasSelectableVariants
      ) {

        if (
          !selectedSku
        ) {
          return false;
        }


        if (
          selectedSku.stock !== null &&
          selectedSku.stock <= 0
        ) {
          return false;
        }


        return true;

      }


      /*
        NO SELECTABLE VARIANTS:

        This is the important fix.

        Do NOT require selectedSku merely because
        the API returned a "variants" array.
      */
      if (
        product.stock !== null &&
        product.stock <= 0
      ) {

        return false;

      }


      /*
        If there is a single variant with known
        zero stock, respect it.
      */
      if (
        product.variants.length === 1 &&
        product.variants[0].stock !== null &&
        product.variants[0].stock <= 0
      ) {

        return false;

      }


      /*
        Unknown stock means purchase is allowed.
      */
      return true;

    }


    /* ============================================================
       ACTION BUTTONS
       ============================================================ */

    function updateActionButtons() {

      const available =
        canPurchase();


      addToCartButton.disabled =
        !available;


      buyNowButton.disabled =
        !available;


      /*
        Quantity controls follow purchase availability.
      */
      quantityMinus.disabled =
        !available;


      quantityPlus.disabled =
        !available;


      quantityInput.disabled =
        !available;

    }


    /* ============================================================
       QUANTITY
       ============================================================ */

    function getQuantity() {

      let quantity =
        parseInt(
          quantityInput.value,
          10
        );


      if (
        !Number.isFinite(quantity) ||
        quantity < 1
      ) {

        quantity = 1;

      }


      const stock =
        getCurrentStock();


      if (
        stock !== null &&
        stock > 0
      ) {

        quantity =
          Math.min(
            quantity,
            stock
          );

      }


      quantity =
        clamp(
          quantity,
          1,
          999
        );


      quantityInput.value =
        String(quantity);


      return quantity;

    }


    function changeQuantity(
      delta
    ) {

      if (
        !canPurchase()
      ) {
        return;
      }


      let quantity =
        parseInt(
          quantityInput.value,
          10
        );


      if (
        !Number.isFinite(quantity)
      ) {
        quantity = 1;
      }


      quantity +=
        delta;


      const stock =
        getCurrentStock();


      if (
        stock !== null &&
        stock > 0
      ) {

        quantity =
          Math.min(
            quantity,
            stock
          );

      }


      quantity =
        clamp(
          quantity,
          1,
          999
        );


      quantityInput.value =
        String(quantity);

    }


    quantityMinus.addEventListener(
      "click",
      () => {
        changeQuantity(-1);
      }
    );


    quantityPlus.addEventListener(
      "click",
      () => {
        changeQuantity(1);
      }
    );


    quantityInput.addEventListener(
      "change",
      () => {
        getQuantity();
      }
    );


    quantityInput.addEventListener(
      "input",
      () => {

        const value =
          quantityInput.value;


        if (
          value === ""
        ) {
          return;
        }


        getQuantity();

      }
    );


    /* ============================================================
       CART ITEM
       ============================================================ */

    function buildCartItem() {

      const quantity =
        getQuantity();


      let price =
        product.price;


      if (
        selectedSku &&
        selectedSku.price !== null
      ) {

        price =
          selectedSku.price;

      }


      const item = {

        id:
          product.id,

        product_id:
          product.id,

        productId:
          product.id,

        title:
          product.title,

        name:
          product.title,

        image:
          safeImageUrl(
            selectedSku?.image ||
            product.images?.[0] ||
            DEFAULT_IMAGE
          ),

        price:
          toNumber(
            price,
            0
          ),

        quantity,

        sku:
          selectedSku?.sku ||
          selectedSku?.id ||
          product.sku ||
          null,

        selectedSku:
          selectedSku
            ? {
                ...selectedSku
              }
            : null,

        selectedProperties:
          {
            ...selectedProperties
          },

        category:
          product.category || "",

        source:
          product.source ||
          product.platform ||
          "CJdropshipping",

        addedAt:
          new Date().toISOString()

      };


      return item;

    }


    /* ============================================================
       ACTION MESSAGE
       ============================================================ */

    function showMessage(
      message,
      type = "success"
    ) {

      actionMessage.textContent =
        message;


      actionMessage.className =
        `message show ${type}`;


      window.clearTimeout(
        showMessage.timeout
      );


      showMessage.timeout =
        window.setTimeout(
          () => {

            actionMessage.className =
              "message";

          },
          3500
        );

    }


    /* ============================================================
       ADD TO CART
       ============================================================ */

    function addCurrentProductToCart() {

      if (
        !canPurchase()
      ) {

        showMessage(
          "Please select an available product option.",
          "error"
        );

        return false;

      }


      const item =
        buildCartItem();


      const cart =
        readCart();


      const newKey =
        cartItemKey(item);


      const existingIndex =
        cart.findIndex(
          existing =>
            cartItemKey(existing) ===
            newKey
        );


      if (
        existingIndex >= 0
      ) {

        const existing =
          cart[existingIndex];


        const stock =
          getCurrentStock();


        let newQuantity =
          toNumber(
            existing.quantity,
            0
          ) +
          item.quantity;


        if (
          stock !== null &&
          stock > 0
        ) {

          newQuantity =
            Math.min(
              newQuantity,
              stock
            );

        }


        existing.quantity =
          newQuantity;


        cart[existingIndex] =
          existing;

      } else {

        cart.push(
          item
        );

      }


      saveCart(
        cart
      );


      showMessage(
        "Product added to your cart.",
        "success"
      );


      return true;

    }


    addToCartButton.addEventListener(
      "click",
      () => {

        addCurrentProductToCart();

      }
    );


    /* ============================================================
       BUY NOW
       ============================================================ */

    buyNowButton.addEventListener(
      "click",
      () => {

        if (
          !canPurchase()
        ) {

          showMessage(
            "Please select an available product option.",
            "error"
          );

          return;

        }


        const item =
          buildCartItem();


        /*
          Buy Now is stored separately so checkout
          can use only this item.
        */
        sessionStorage.setItem(
          BUY_NOW_STORAGE_KEY,
          JSON.stringify([
            item
          ])
        );


        /*
          Also keep a simple compatibility key.
        */
        sessionStorage.setItem(
          "buy_now",
          JSON.stringify([
            item
          ])
        );


        window.location.href =
          "/checkout.html?buy_now=1";

      }
    );


    /* ============================================================
       RENDER PRODUCT
       ============================================================ */

    function renderProduct() {

      breadcrumbTitle.textContent =
        product.title;


      productCategory.textContent =
        product.category;


      productCategory.hidden =
        !product.category;


      productTitle.textContent =
        product.title;


      document.title =
        `${product.title} | Prasun Store`;


      renderRating();


      renderGallery();


      /*
        Reset selection when a new product is rendered.
      */
      selectedProperties =
        {};

      selectedSku =
        null;


      renderVariants();


      updateDisplayedPrice();


      updateStockStatus();


      productDescription.innerHTML =
        sanitizeDescription(
          product.description
        );


      if (
        !product.description.trim()
      ) {

        productDescription.innerHTML =
          "<p>Product details are available at Prasun Store.</p>";

      }


      if (
        product.sku
      ) {

        skuInfo.textContent =
          `SKU: ${product.sku}`;

        skuInfo.classList.remove(
          "hidden"
        );

      } else {

        skuInfo.classList.add(
          "hidden"
        );

      }


      quantityInput.value =
        "1";


      /*
        IMPORTANT:
        Run this after variants are rendered.
        Products without selectable variants will
        now have active buttons.
      */
      updateActionButtons();


      /*
        Basic Product structured data.
      */
      updateProductSchema();

    }


    /* ============================================================
       PRODUCT SCHEMA
       ============================================================ */

    function updateProductSchema() {

      const existing =
        document.getElementById(
          "product-schema"
        );


      if (
        existing
      ) {

        existing.remove();

      }


      const price =
        selectedSku?.price ??
        product.price;


      if (
        price === null ||
        price === undefined
      ) {
        return;
      }


      const image =
        safeImageUrl(
          product.images?.[0]
        );


      const schema = {

        "@context":
          "https://schema.org",

        "@type":
          "Product",

        name:
          product.title,

        image:
          [image],

        description:
          productDescription.textContent
            .trim()
            .slice(0, 1000),

        sku:
          selectedSku?.sku ||
          product.sku ||
          String(product.id),

        offers: {

          "@type":
            "Offer",

          priceCurrency:
            "USD",

          price:
            String(price),

          availability:
            canPurchase()
              ? "https://schema.org/InStock"
              : "https://schema.org/OutOfStock",

          url:
            window.location.href

        }

      };


      if (
        product.rating > 0
      ) {

        schema.aggregateRating = {

          "@type":
            "AggregateRating",

          ratingValue:
            String(product.rating),

          reviewCount:
            String(
              Math.max(
                1,
                product.sales || 1
              )
            )

        };

      }


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "product-schema";


      script.type =
        "application/ld+json";


      script.textContent =
        JSON.stringify(
          schema
        );


      document.head.appendChild(
        script
      );

    }


    /* ============================================================
       INITIALIZATION
       ============================================================ */

    async function initialize() {

      updateCartCount();


      /*
        Disable buttons only while the product is
        actually loading.

        Once the product loads, updateActionButtons()
        determines the correct state.
      */
      addToCartButton.disabled =
        true;

      buyNowButton.disabled =
        true;


      try {

        product =
          await fetchProduct();


        if (
          !product
        ) {

          throw new Error(
            "Product data was empty."
          );

        }


        renderProduct();


        loadingState.classList.add(
          "hidden"
        );


        productLayout.classList.remove(
          "hidden"
        );


      } catch (error) {

        console.error(
          "Product loading error:",
          error
        );


        loadingState.classList.add(
          "hidden"
        );


        productLayout.classList.add(
          "hidden"
        );


        errorMessage.textContent =
          error?.message ||
          "We could not load this product.";


        errorState.classList.remove(
          "hidden"
        );

      }

    }


    /* ============================================================
       START
       ============================================================ */

    initialize();

  </script>

</body>
