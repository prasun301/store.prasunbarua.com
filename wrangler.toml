name = "prasun-store-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# Cloudflare Workers Assets configuration
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# KV Namespace for store data, orders, tokens, and indexes
[[kv_namespaces]]
binding = "PRODUCTS_KV"
id = "90f1e9b8d257447fa4337458044172c8"
