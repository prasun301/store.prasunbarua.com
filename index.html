      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;

    /* ============================================================
       HEADER
       ============================================================ */

    .top-header {
      position: sticky;

      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);

      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      min-height: 72px;

      align-items: center;

       BRAND
       ============================================================ */

    .brand {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      border-radius: 10px;
    }

    .brand-logo {
      display: block;
      width: auto;
      height: 44px;
      max-width: 180px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 23px;

      white-space: nowrap;
      line-height: 1;
    }

    .brand-name span {
      color: #2563eb;
    }

    /* ============================================================
       SEARCH
       ============================================================ */

    .search-wrap {
      flex: 1;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .search-form {
      display: flex;
      width: 100%;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .search-form:focus-within {
      background: #fff;
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    .search-input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 12px 14px;
      color: #111827;
    }

    .search-input::placeholder {
      color: #9ca3af;
    }

    .search-input::-webkit-search-cancel-button {
      cursor: pointer;
    }

    .search-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 96px;
      border: 0;
      background: #111827;
      color: #fff;
      padding: 0 18px;
      font-weight: 800;
      transition:
        background 0.18s ease,
        transform 0.18s ease;
    }

    .search-button:hover {
      background: #1f2937;
    }

    .search-button:active {
      transform: scale(0.98);
    }

    .search-icon {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke: currentColor;
    }
