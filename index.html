<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Store - CJ Dropshipping</title>
  
  <style>
    /* --- Modern Reset & Apple/Google Design System --- */
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f4f4f5;
      --border: #e4e4e7;
      --border-hover: #d4d4d8;
      --text: #09090b;
      --text-muted: #71717a;
      --primary: #000000;
      --primary-hover: #27272a;
      --accent: #0071e3;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 32px -4px rgba(0, 0, 0, 0.12);
      --blur: blur(16px);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* --- Navigation Bar (Frosted Glass) --- */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* --- Search Input --- */
    .search-bar {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background-color: var(--surface-subtle);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      background-color: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }

    /* --- Buttons & Action Elements --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: var(--surface-subtle);
      border-color: var(--border-hover);
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      position: relative;
    }

    .btn-icon:hover {
      background: var(--surface);
    }

    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Main Layout --- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .hero {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* --- Product Grid --- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      cursor: pointer;
    }

    .product-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .product-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--surface-subtle);
      overflow: hidden;
      position: relative;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition);
    }

    .product-card:hover .product-image {
      transform: scale(1.04);
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.25rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
    }

    .product-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* --- Cart Drawer --- */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      z-index: 201;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }

    .drawer.active {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .drawer-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-img {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: var(--surface-subtle);
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0.15rem;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .qty-btn:hover {
      background: var(--surface-subtle);
    }

    .qty-val {
      padding: 0 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .cart-summary {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    /* --- Skeleton Loader --- */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* --- Responsive Adjustments --- */
    @media (max-width: 640px) {
      .hero h1 { font-size: 1.85rem; }
      .nav-container { padding: 0.75rem 1rem; }
      .container { padding: 1.5rem 1rem; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
      .product-info { padding: 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="header">
    <div class="nav-container">
      <a href="#" class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        CJ Catalog
      </a>

      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search CJ products..." aria-label="Search products">
      </div>

      <button id="cartToggle" class="btn btn-icon" aria-label="Open Shopping Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span id="cartBadge" class="badge" style="display: none;">0</span>
      </button>
    </div>
  </header>

  <!-- Main View -->
  <main class="container">
    <section class="hero">
      <h1>Direct CJ Catalog.</h1>
      <p>Browse live products fetched directly from CJ Dropshipping.</p>
    </section>

    <!-- Product Grid Container -->
    <div id="productGrid" class="product-grid">
      <!-- Skeleton Loaders rendered on init -->
    </div>
  </main>

  <!-- Slide-over Cart Drawer -->
  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="cartDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">
      <h2 style="font-size: 1.1rem; font-weight: 600;">Your Bag</h2>
      <button id="closeDrawer" class="btn btn-icon" style="border:none; background:transparent;" aria-label="Close cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
    <div class="drawer-footer">
      <div class="cart-summary">
        <span>Subtotal</span>
        <span id="cartSubtotal">$0.00</span>
      </div>
      <button class="btn btn-primary" style="width: 100%; padding: 0.85rem;" onclick="alert('Proceeding to order creation...')">Checkout</button>
    </div>
  </aside>

  <!-- CJ API & Store Controller -->
  <script>
    /* -------------------------------------------------------------
       CJ DROPSHIPPING API CONFIGURATION
       Paste your CJ Access Token or API details below
    ------------------------------------------------------------- */
    const CJ_CONFIG = {
      // Direct access token or developer API key
      accessToken: "YOUR_CJ_ACCESS_TOKEN_HERE",
      // CJ Official REST API v2 base endpoint
      baseUrl: "https://developers.cjdropshipping.com/api2.0/v1",
      // CORS Proxy fallback if browser blocks direct client-side CJ requests
      corsProxy: "https://corsproxy.io/?" 
    };

    /* Application State */
    const state = {
      products: [],
      filteredProducts: [],
      cart: JSON.parse(localStorage.getItem('cj_cart') || '[]'),
      isDrawerOpen: false
    };

    /* DOM Selectors */
    const productGrid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const cartToggle = document.getElementById('cartToggle');
    const closeDrawer = document.getElementById('closeDrawer');
    const cartDrawer = document.getElementById('cartDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerBody = document.getElementById('drawerBody');
    const cartSubtotal = document.getElementById('cartSubtotal');
    const cartBadge = document.getElementById('cartBadge');

    /* Initialize Application */
    document.addEventListener("DOMContentLoaded", () => {
      renderSkeletons();
      fetchCjProducts();
      setupEventListeners();
      updateCartUI();
    });

    /* Fetch Products directly from CJ Dropshipping API */
    async function fetchCjProducts(pageNum = 1, pageSize = 24) {
      const cjEndpoint = `${CJ_CONFIG.baseUrl}/product/list?pageNum=${pageNum}&pageSize=${pageSize}`;
      
      // Use CORS proxy if direct browser request fails due to CJ CORS policies
      const targetUrl = CJ_CONFIG.corsProxy ? `${CJ_CONFIG.corsProxy}${encodeURIComponent(cjEndpoint)}` : cjEndpoint;

      try {
        const response = await fetch(targetUrl, {
          method: 'GET',
          headers: {
            'CJ-Access-Token': CJ_CONFIG.accessToken,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const resData = await response.json();
        
        // CJ API payload validation
        const rawList = resData.data?.list || resData.list || [];
        
        if (rawList.length > 0) {
          state.products = rawList.map(normalizeCjProduct);
        } else {
          console.warn("CJ API returned empty list or invalid access token. Loading backup dataset.");
          state.products = getFallbackProducts();
        }
      } catch (err) {
        console.error("Direct CJ API fetch failed:", err);
        state.products = getFallbackProducts();
      } finally {
        state.filteredProducts = [...state.products];
        renderProducts();
      }
    }

    /* Transform CJ Dropshipping API schema to Store UI schema */
    function normalizeCjProduct(item) {
      return {
        id: item.pid || item.id,
        name: item.productNameEn || item.productName || item.name || "CJ Product",
        category: item.categoryName || item.twoCategoryName || "General",
        price: Number(item.sellPrice || item.productPrice || item.price || 0),
        image: item.productImage || item.bigImage || item.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"
      };
    }

    /* Fallback data if CJ API credentials are invalid or missing */
    function getFallbackProducts() {
      return [
        { id: "CJ001", name: "Wireless Noise-Canceling Earbuds", category: "Audio", price: 49.99, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80" },
        { id: "CJ002", name: "Minimalist Quartz Wristwatch", category: "Accessories", price: 35.50, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80" },
        { id: "CJ003", name: "Smart Ambient Table Light", category: "Home", price: 28.00, image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&auto=format&fit=crop&q=80" },
        { id: "CJ004", name: "Ergonomic Mechanical Keyboard", category: "Tech", price: 89.00, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&auto=format&fit=crop&q=80" }
      ];
    }

    /* Render Skeleton Loaders */
    function renderSkeletons() {
      productGrid.innerHTML = Array(8).fill(0).map(() => `
        <div class="product-card" style="pointer-events: none;">
          <div class="product-image-wrap skeleton"></div>
          <div class="product-info">
            <div class="skeleton" style="height: 18px; width: 80%; margin-bottom: 8px;"></div>
            <div class="skeleton" style="height: 12px; width: 40%; margin-bottom: 16px;"></div>
            <div class="skeleton" style="height: 20px; width: 30%; margin-top: auto;"></div>
          </div>
        </div>
      `).join('');
    }

    /* Render Products Grid */
    function renderProducts() {
      if (state.filteredProducts.length === 0) {
        productGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem 0; color: var(--text-muted);">
            No products found in CJ catalog.
          </div>`;
        return;
      }

      productGrid.innerHTML = state.filteredProducts.map(p => `
        <article class="product-card" onclick="addToCart('${p.id}')">
          <div class="product-image-wrap">
            <img class="product-image" src="${p.image}" alt="${p.name}" loading="lazy" />
          </div>
          <div class="product-info">
            <h3 class="product-title">${p.name}</h3>
            <span class="product-category">${p.category}</span>
            <div class="product-footer">
              <span class="product-price">$${Number(p.price).toFixed(2)}</span>
              <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="event.stopPropagation(); addToCart('${p.id}')">
                Add +
              </button>
            </div>
          </div>
        </article>
      `).join('');
    }

    /* Cart Operations */
    function addToCart(productId) {
      const product = state.products.find(p => p.id === productId);
      if (!product) return;

      const existingIndex = state.cart.findIndex(item => item.id === productId);
      if (existingIndex > -1) {
        state.cart[existingIndex].quantity += 1;
      } else {
        state.cart.push({ ...product, quantity: 1 });
      }

      saveCartState();
      updateCartUI();
      openCartDrawer();
    }

    function updateQuantity(productId, delta) {
      const index = state.cart.findIndex(item => item.id === productId);
      if (index > -1) {
        state.cart[index].quantity += delta;
        if (state.cart[index].quantity <= 0) {
          state.cart.splice(index, 1);
        }
      }
      saveCartState();
      updateCartUI();
    }

    function saveCartState() {
      localStorage.setItem('cj_cart', JSON.stringify(state.cart));
    }

    function updateCartUI() {
      const totalItems = state.cart.reduce((sum, item) => sum + item.quantity, 0);
      if (totalItems > 0) {
        cartBadge.textContent = totalItems;
        cartBadge.style.display = 'flex';
      } else {
        cartBadge.style.display = 'none';
      }

      if (state.cart.length === 0) {
        drawerBody.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); margin-top: 4rem;">
            Your bag is empty.
          </div>`;
        cartSubtotal.textContent = '$0.00';
        return;
      }

      drawerBody.innerHTML = state.cart.map(item => `
        <div class="cart-item">
          <img class="cart-item-img" src="${item.image}" alt="${item.name}" />
          <div class="cart-item-details">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-price">$${Number(item.price).toFixed(2)}</div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">-</button>
              <span class="qty-val">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
            </div>
          </div>
        </div>
      `).join('');

      const totalCost = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartSubtotal.textContent = `$${totalCost.toFixed(2)}`;
    }

    /* Drawer Controls */
    function openCartDrawer() {
      state.isDrawerOpen = true;
      cartDrawer.classList.add('active');
      drawerOverlay.classList.add('active');
      cartDrawer.setAttribute('aria-hidden', 'false');
    }

    function closeCartDrawer() {
      state.isDrawerOpen = false;
      cartDrawer.classList.remove('active');
      drawerOverlay.classList.remove('active');
      cartDrawer.setAttribute('aria-hidden', 'true');
    }

    /* Event Listeners */
    function setupEventListeners() {
      cartToggle.addEventListener('click', openCartDrawer);
      closeDrawer.addEventListener('click', closeCartDrawer);
      drawerOverlay.addEventListener('click', closeCartDrawer);

      let searchTimeout;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          const query = e.target.value.toLowerCase().trim();
          state.filteredProducts = state.products.filter(p => 
            p.name.toLowerCase().includes(query) || 
            (p.category && p.category.toLowerCase().includes(query))
          );
          renderProducts();
        }, 150);
      });
    }
  </script>
</body>
</html>
