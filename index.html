<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prasun Store | Smart Products for Modern Living</title>

  <meta
    name="description"
    content="Discover practical solar, lighting, electronics, home and lifestyle products at Prasun Store."
  >

  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6e6e73;
      --border: #e5e5e7;
      --accent: #0071e3;
      --danger: #d93025;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Inter",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .nav {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.7px;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      max-width: 520px;
      margin: auto;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #f1f1f3;
      outline: none;
      padding: 0 18px 0 42px;
      color: var(--text);
    }

    .search input:focus {
      background: #fff;
      border-color: #b9b9be;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 12px;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .cart-btn {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .cart-btn:hover {
      background: #f1f1f3;
    }

    .cart-icon {
      width: 21px;
      height: 21px;
    }

    /* HERO */

    .hero {
      padding: 72px 0 55px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 auto;
      max-width: 750px;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.02;
      letter-spacing: -3px;
      font-weight: 700;
    }

    .hero p {
      max-width: 600px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    /* CATEGORIES */

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 20px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 14px;
    }

    .category.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* PRODUCTS */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 12px 0 20px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      padding-bottom: 70px;
    }

    .product {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #f5f5f7;
      display: block;
    }

    .product-info {
      padding: 16px;
    }

    .product-category {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .product-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-bottom {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price {
      font-size: 17px;
      font-weight: 700;
    }

    .view-btn {
      border: 0;
      background: #f1f1f3;
      color: var(--text);
      border-radius: 16px;
      padding: 7px 12px;
      font-size: 12px;
    }

    .view-btn:hover {
      background: #e5e5e7;
    }

    /* LOADING */

    .loading {
      min-height: 250px;
      display: grid;
      place-items: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .message strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 8px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 24px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,.2);
    }

    .close {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      font-size: 22px;
      line-height: 1;
    }

    .modal-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #f5f5f7;
    }

    .modal-info {
      padding: 42px 34px;
    }

    .modal-info h2 {
      margin: 8px 0 14px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.8px;
    }

    .modal-category {
      color: var(--muted);
      font-size: 13px;
    }

    .modal-price {
      font-size: 25px;
      font-weight: 700;
      margin: 20px 0;
    }

    .modal-description {
      color: #555;
      line-height: 1.6;
      font-size: 14px;
    }

    .modal-description img {
      max-width: 100%;
      height: auto;
    }

    .stock {
      margin: 18px 0;
      color: #16803c;
      font-size: 13px;
    }

    .add-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: var(--text);
      color: #fff;
      font-weight: 600;
    }

    .add-btn:hover {
      opacity: .88;
    }

    /* CART */

    .cart {
      position: fixed;
      top: 0;
      right: -400px;
      width: min(380px, 100%);
      height: 100vh;
      background: #fff;
      z-index: 200;
      box-shadow: -10px 0 40px rgba(0,0,0,.12);
      transition: right .25s ease;
      display: flex;
      flex-direction: column;
    }

    .cart.open {
      right: 0;
    }

    .cart-head {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .cart-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .cart-items {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: #f5f5f7;
      border-radius: 10px;
    }

    .cart-title {
      font-size: 13px;
      line-height: 1.3;
    }

    .cart-price {
      font-size: 13px;
      font-weight: 600;
      margin-top: 5px;
    }

    .remove {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: 12px;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .checkout {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #111;
      color: white;
      font-weight: 600;
    }

    .cart-note {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      padding: 35px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* RESPONSIVE */

    @media (max-width: 950px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .nav {
        gap: 10px;
      }

      .logo {
        font-size: 17px;
      }

      .search {
        order: 3;
        flex-basis: 100%;
        max-width: none;
      }

      header {
        height: auto;
      }

      .nav {
        flex-wrap: wrap;
        padding: 12px 0;
        height: auto;
      }

      .hero {
        padding: 55px 0 35px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .hero p {
        font-size: 16px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-info {
        padding: 13px;
      }

      .modal {
        padding: 0;
        align-items: flex-end;
      }

      .modal-box {
        border-radius: 24px 24px 0 0;
        max-height: 94vh;
      }

      .modal-content {
        grid-template-columns: 1fr;
      }

      .modal-image {
        max-height: 42vh;
      }

      .modal-info {
        padding: 25px 22px 30px;
      }
    }

    @media (max-width: 420px) {
      .container {
        width: min(100% - 20px, 1180px);
      }

      .products {
        gap: 9px;
      }

      .product {
        border-radius: 14px;
      }

      .product-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .view-btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="/" class="logo">
      PRASUN STORE
    </a>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>

      <input
        id="search"
        type="search"
        placeholder="Search products"
        autocomplete="off"
      >
    </div>

    <button
      class="cart-btn"
      id="cartButton"
      aria-label="Shopping cart"
    >
      <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M6 7h15l-1.5 9h-11z"></path>
        <path d="M6 7 5 3H2"></path>
        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>
      </svg>
    </button>

  </div>
</header>


<main>

  <section class="hero">
    <div class="container">
      <h1>
        Smart products for modern living.
      </h1>

      <p>
        Explore practical products for solar energy, lighting,
        electronics, home improvement, kitchen and everyday life.
      </p>
    </div>
  </section>


  <section class="container">

    <div class="categories" id="categories">
      <button class="category active" data-category="">
        All
      </button>

      <button class="category" data-category="Solar Lights">
        Solar Lights
      </button>

      <button class="category" data-category="LED Lighting">
        LED Lighting
      </button>

      <button class="category" data-category="LED Strip Lights">
        LED Strips
      </button>

      <button class="category" data-category="Solar Garden">
        Solar Garden
      </button>

      <button class="category" data-category="Home Improvement">
        Home Improvement
      </button>

      <button class="category" data-category="Kitchen">
        Kitchen
      </button>

      <button class="category" data-category="Electronics">
        Electronics
      </button>

      <button class="category" data-category="Lifestyle">
        Lifestyle
      </button>
    </div>


    <div class="section-head">
      <h2>Products</h2>
      <span class="count" id="count"></span>
    </div>


    <div class="products" id="products">

      <div class="loading">
        <div class="spinner"></div>
      </div>

    </div>

  </section>

</main>


<footer>
  <div class="container">
    © <span id="year"></span> Prasun Store. All rights reserved.
  </div>
</footer>


<!-- PRODUCT MODAL -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <button
      class="close"
      id="closeModal"
      aria-label="Close"
    >
      ×
    </button>

    <div class="modal-content">

      <img
        id="modalImage"
        class="modal-image"
        alt=""
      >

      <div class="modal-info">

        <div class="modal-category" id="modalCategory"></div>

        <h2 id="modalTitle"></h2>

        <div class="modal-price" id="modalPrice"></div>

        <div class="stock" id="modalStock"></div>

        <div
          class="modal-description"
          id="modalDescription"
        ></div>

        <br>

        <button
          class="add-btn"
          id="addButton"
        >
          Add to Cart
        </button>

      </div>

    </div>

  </div>

</div>


<!-- CART -->

<aside class="cart" id="cart">

  <div class="cart-head">

    <h2>Cart</h2>

    <button
      class="close"
      id="closeCart"
      aria-label="Close cart"
    >
      ×
    </button>

  </div>

  <div class="cart-items" id="cartItems"></div>

  <div class="cart-footer">

    <div class="subtotal">
      <span>Subtotal</span>
      <span id="subtotal">$0.00</span>
    </div>

    <button
      class="checkout"
      id="checkout"
    >
      Checkout
    </button>

    <div class="cart-note">
      Checkout requires a connected payment/order system.
    </div>

  </div>

</aside>


<script>

  /*
   * ==========================================================
   * PRASUN STORE FRONTEND
   * ==========================================================
   *
   * Public Worker:
   *
   * https://prasun-store.prasun301.workers.dev
   *
   * Products:
   *
   * /api/products
   *
   * Product:
   *
   * /api/products/:id
   *
   * Images:
   *
   * /api/image?url=...
   *
   * ==========================================================
   */


  const API_BASE =
    "https://prasun-store.prasun301.workers.dev";


  /*
   * Leave empty until you have a real checkout URL.
   *
   * Example:
   *
   * const CHECKOUT_URL = "https://your-checkout-page.com";
   */

  const CHECKOUT_URL = "";


  const state = {
    products: [],
    category: "",
    search: "",
    selectedProduct: null,
    cart: JSON.parse(
      localStorage.getItem("prasun_cart") || "[]"
    )
  };


  const productsEl =
    document.getElementById("products");

  const countEl =
    document.getElementById("count");

  const searchEl =
    document.getElementById("search");

  const modal =
    document.getElementById("productModal");

  const cart =
    document.getElementById("cart");


  /* ==========================================================
     IMAGE URL
     ========================================================== */

  function imageUrl(url) {

    if (!url) {
      return "";
    }

    return (
      API_BASE +
      "/api/image?url=" +
      encodeURIComponent(url)
    );

  }


  /* ==========================================================
     ESCAPE HTML
     ========================================================== */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================================
     DESCRIPTION SANITIZER
     ========================================================== */

  function safeDescription(html) {

    if (!html) {
      return "";
    }

    const template =
      document.createElement("template");

    template.innerHTML = html;

    template.content
      .querySelectorAll(
        "script,iframe,object,embed,style,link,form,input,button"
      )
      .forEach(el => el.remove());

    template.content
      .querySelectorAll("*")
      .forEach(el => {

        [...el.attributes].forEach(attr => {

          if (
            attr.name.toLowerCase().startsWith("on")
          ) {
            el.removeAttribute(attr.name);
          }

          if (
            attr.name.toLowerCase() === "href" &&
            /^javascript:/i.test(attr.value)
          ) {
            el.removeAttribute(attr.name);
          }

          if (
            attr.name.toLowerCase() === "src" &&
            /^javascript:/i.test(attr.value)
          ) {
            el.removeAttribute(attr.name);
          }

        });

      });

    return template.innerHTML;

  }


  /* ==========================================================
     LOAD PRODUCTS
     ========================================================== */

  async function loadProducts() {

    productsEl.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
      </div>
    `;

    try {

      const response =
        await fetch(
          API_BASE + "/api/products",
          {
            method: "GET",
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }


      const data =
        await response.json();


      if (!data.success) {
        throw new Error(
          data.error || "Unable to load products."
        );
      }


      state.products =
        Array.isArray(data.products)
          ? data.products
          : [];


      renderProducts();


      /*
       * Your Worker may start a background CJ import
       * when the catalog contains fewer than 20 products.
       *
       * Give that import a little time, then refresh once.
       */

      if (data.auto_import_triggered) {

        setTimeout(
          () => loadProducts(),
          8000
        );

      }

    } catch (error) {

      console.error(
        "Product loading error:",
        error
      );


      productsEl.innerHTML = `
        <div class="message">
          <strong>Unable to load products</strong>
          Please try again in a moment.
        </div>
      `;

    }

  }


  /* ==========================================================
     FILTER PRODUCTS
     ========================================================== */

  function filteredProducts() {

    const query =
      state.search
        .trim()
        .toLowerCase();


    return state.products.filter(product => {

      const matchesCategory =
        !state.category ||
        String(product.category || "")
          .toLowerCase() ===
        state.category.toLowerCase();


      const searchable = [

        product.title,

        product.original_title,

        product.category,

        product.description

      ]
        .join(" ")
        .toLowerCase();


      const matchesSearch =
        !query ||
        searchable.includes(query);


      return (
        matchesCategory &&
        matchesSearch
      );

    });

  }


  /* ==========================================================
     RENDER PRODUCTS
     ========================================================== */

  function renderProducts() {

    const products =
      filteredProducts();


    countEl.textContent =
      products.length +
      (
        products.length === 1
          ? " product"
          : " products"
      );


    if (!products.length) {

      productsEl.innerHTML = `
        <div class="message">
          <strong>No products found</strong>
          Try another search or category.
        </div>
      `;

      return;

    }


    productsEl.innerHTML =
      products
        .map(product => {

          const image =
            imageUrl(
              product.main_image ||
              product.images?.[0] ||
              ""
            );


          const price =
            Number(
              product.price || 0
            );


          return `

            <article class="product">

              <img
                class="product-image"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.title)}"
                loading="lazy"
                decoding="async"
                onerror="this.style.visibility='hidden'"
              >

              <div class="product-info">

                <div class="product-category">
                  ${escapeHtml(product.category)}
                </div>

                <h3 class="product-title">
                  ${escapeHtml(product.title)}
                </h3>

                <div class="product-bottom">

                  <span class="price">
                    ${formatPrice(price)}
                  </span>

                  <button
                    class="view-btn"
                    onclick="openProduct('${escapeHtml(product.product_id)}')"
                  >
                    View
                  </button>

                </div>

              </div>

            </article>

          `;

        })
        .join("");

  }


  /* ==========================================================
     PRICE
     ========================================================== */

  function formatPrice(price) {

    return new Intl.NumberFormat(
      "en-US",
      {
        style: "currency",
        currency: "USD"
      }
    ).format(
      Number(price) || 0
    );

  }


  /* ==========================================================
     OPEN PRODUCT
     ========================================================== */

  window.openProduct =
    function(productId) {

      const product =
        state.products.find(
          p =>
            String(p.product_id) ===
            String(productId)
        );


      if (!product) {
        return;
      }


      state.selectedProduct =
        product;


      const image =
        imageUrl(
          product.main_image ||
          product.images?.[0] ||
          ""
        );


      document.getElementById(
        "modalImage"
      ).src = image;


      document.getElementById(
        "modalImage"
      ).alt =
        product.title || "";


      document.getElementById(
        "modalCategory"
      ).textContent =
        product.category || "";


      document.getElementById(
        "modalTitle"
      ).textContent =
        product.title || "Product";


      document.getElementById(
        "modalPrice"
      ).textContent =
        formatPrice(
          product.price
        );


      const stock =
        Number(
          product.total_available_stock || 0
        );


      document.getElementById(
        "modalStock"
      ).textContent =
        stock > 0
          ? "In stock"
          : "Currently unavailable";


      document.getElementById(
        "modalDescription"
      ).innerHTML =
        safeDescription(
          product.description
        );


      modal.classList.add("open");

      document.body.style.overflow =
        "hidden";

    };


  /* ==========================================================
     CLOSE PRODUCT
     ========================================================== */

  function closeProduct() {

    modal.classList.remove("open");

    document.body.style.overflow =
      "";

  }


  document.getElementById(
    "closeModal"
  ).addEventListener(
    "click",
    closeProduct
  );


  modal.addEventListener(
    "click",
    event => {

      if (
        event.target === modal
      ) {
        closeProduct();
      }

    }
  );


  /* ==========================================================
     ADD TO CART
     ========================================================== */

  document.getElementById(
    "addButton"
  ).addEventListener(
    "click",
    () => {

      const product =
        state.selectedProduct;


      if (!product) {
        return;
      }


      const existing =
        state.cart.find(
          item =>
            item.product_id ===
            product.product_id
        );


      if (existing) {

        existing.quantity++;

      } else {

        state.cart.push({

          product_id:
            product.product_id,

          title:
            product.title,

          price:
            Number(
              product.price || 0
            ),

          image:
            product.main_image ||
            product.images?.[0] ||
            "",

          quantity:
            1

        });

      }


      saveCart();

      renderCart();

      closeProduct();

      cart.classList.add("open");

    }
  );


  /* ==========================================================
     CART
     ========================================================== */

  function saveCart() {

    localStorage.setItem(
      "prasun_cart",
      JSON.stringify(
        state.cart
      )
    );

  }


  function renderCart() {

    const container =
      document.getElementById(
        "cartItems"
      );


    if (!state.cart.length) {

      container.innerHTML = `
        <div class="message">
          <strong>Your cart is empty</strong>
          Add a product to get started.
        </div>
      `;

    } else {

      container.innerHTML =
        state.cart
          .map((item, index) => `

            <div class="cart-item">

              <img
                src="${escapeHtml(imageUrl(item.image))}"
                alt=""
              >

              <div>

                <div class="cart-title">
                  ${escapeHtml(item.title)}
                </div>

                <div class="cart-price">
                  ${formatPrice(item.price)}
                  × ${item.quantity}
                </div>

              </div>

              <button
                class="remove"
                onclick="removeCartItem(${index})"
              >
                Remove
              </button>

            </div>

          `)
          .join("");

    }


    const total =
      state.cart.reduce(
        (sum, item) =>
          sum +
          (
            Number(item.price) *
            Number(item.quantity)
          ),
        0
      );


    document.getElementById(
      "subtotal"
    ).textContent =
      formatPrice(total);

  }


  window.removeCartItem =
    function(index) {

      state.cart.splice(
        index,
        1
      );

      saveCart();

      renderCart();

    };


  document.getElementById(
    "cartButton"
  ).addEventListener(
    "click",
    () => {

      renderCart();

      cart.classList.add("open");

    }
  );


  document.getElementById(
    "closeCart"
  ).addEventListener(
    "click",
    () => {

      cart.classList.remove(
        "open"
      );

    }
  );


  /* ==========================================================
     CHECKOUT
     ========================================================== */

  document.getElementById(
    "checkout"
  ).addEventListener(
    "click",
    () => {

      if (!state.cart.length) {
        return;
      }


      if (CHECKOUT_URL) {

        window.location.href =
          CHECKOUT_URL;

        return;

      }


      alert(
        "Checkout is not connected yet. Add your real checkout URL to CHECKOUT_URL in index.html."
      );

    }
  );


  /* ==========================================================
     SEARCH
     ========================================================== */

  searchEl.addEventListener(
    "input",
    event => {

      state.search =
        event.target.value;

      renderProducts();

    }
  );


  /* ==========================================================
     CATEGORY
     ========================================================== */

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".category")
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          state.category =
            button.dataset.category ||
            "";


          renderProducts();

        }
      );

    });


  /* ==========================================================
     KEYBOARD
     ========================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closeProduct();

        cart.classList.remove(
          "open"
        );

      }

    }
  );


  /* ==========================================================
     START
     ========================================================== */

  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();


  renderCart();

  loadProducts();

</script>

</body>
</html>
