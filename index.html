<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PRASUN STORE</title>
  <meta
    name="description"
    content="PRASUN STORE - Shop solar energy, electronics, home improvement and lifestyle products."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 5%;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    .hero {
      max-width: 1200px;
      margin: 35px auto 20px;
      padding: 0 20px;
    }

    .hero-box {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      max-width: 700px;
    }

    .search-box input {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .search-box button {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .section {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 25px;
      margin-bottom: 20px;
    }

    #status {
      padding: 20px;
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 16px;
      line-height: 1.4;
      min-height: 45px;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 11px 8px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-view {
      background: #f0f1f3;
      color: #111827;
    }

    .btn-buy {
      background: #111827;
      color: white;
      border: none;
    }

    footer {
      margin-top: 50px;
      background: #111827;
      color: #ccc;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 28px;
      }

      .search-box {
        flex-direction: column;
      }

      nav {
        width: 100%;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <div class="logo">PRASUN STORE</div>

      <nav>
        <a href="/">Home</a>
        <a href="/cart.html">Cart 🛒</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero-box">
        <h1>Shop Smarter with PRASUN STORE</h1>
        <p>
          Discover useful products for solar energy, electronics,
          home improvement, lifestyle and more.
        </p>

        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
          />
          <button onclick="searchProducts()">Search</button>
        </div>
      </div>
    </section>

    <section class="section">

      <h2 class="section-title">Featured Products</h2>

      <div id="status">Loading products...</div>

      <div id="products" class="products"></div>

    </section>

  </main>

  <footer>
    © 2026 PRASUN STORE. All rights reserved.
  </footer>

  <script>

    const API_BASE =
      "https://prasun-store.prasun301.workers.dev";

    async function loadProducts() {

      const status = document.getElementById("status");
      const container = document.getElementById("products");

      status.textContent = "Loading products...";

      try {

        const response = await fetch(
          `${API_BASE}/api/products`,
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data = await response.json();

        console.log("API response:", data);

        let products = [];

        /*
         * Support several possible API formats.
         */
        if (Array.isArray(data)) {
          products = data;
        } else if (Array.isArray(data.products)) {
          products = data.products;
        } else if (Array.isArray(data.items)) {
          products = data.items;
        } else if (
          data.data &&
          Array.isArray(data.data)
        ) {
          products = data.data;
        }

        if (!products.length) {

          status.textContent =
            "No products are currently available.";

          return;
        }

        status.style.display = "none";

        container.innerHTML = "";

        products.forEach(product => {

          const productId =
            product.product_id ||
            product.id ||
            product.aliexpress_product_id ||
            "";

          const title =
            product.title ||
            product.name ||
            "Untitled Product";

          const image =
            product.image ||
            product.image_url ||
            product.main_image ||
            (
              Array.isArray(product.images)
                ? product.images[0]
                : ""
            ) ||
            "https://via.placeholder.com/500x500?text=Product";

          const price =
            product.price ||
            product.sale_price ||
            product.selling_price ||
            "";

          const card =
            document.createElement("div");

          card.className =
            "product-card";

          card.innerHTML = `

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(title)}"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/500x500?text=Image+Unavailable'"
            >

            <div class="product-info">

              <div class="product-title">
                ${escapeHtml(title)}
              </div>

              <div class="product-price">
                ${price ? "$" + escapeHtml(String(price)) : "View price"}
              </div>

              <div class="buttons">

                <a
                  class="btn btn-view"
                  href="/product.html?id=${encodeURIComponent(productId)}"
                >
                  View
                </a>

                <button
                  class="btn btn-buy"
                  onclick="buyNow('${escapeJs(productId)}')"
                >
                  Buy Now
                </button>

              </div>

            </div>
          `;

          container.appendChild(card);

        });

      } catch (error) {

        console.error(error);

        status.textContent =
          "Unable to load products. Please check the store API.";

      }

    }

    function searchProducts() {

      const query =
        document.getElementById("searchInput")
          .value
          .trim();

      if (!query) {
        loadProducts();
        return;
      }

      window.location.href =
        `/products.html?q=${encodeURIComponent(query)}`;

    }

    function buyNow(productId) {

      if (!productId) {

        alert("Product ID is missing.");

        return;
      }

      window.location.href =
        `/product.html?id=${encodeURIComponent(productId)}`;

    }

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

    function escapeJs(value) {

      return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");

    }

    loadProducts();

  </script>

</body>
</html>
