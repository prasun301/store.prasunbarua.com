<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Prasun Store | Smart Products for Modern Living</title>

  <meta
    name="description"
    content="Discover practical solar, lighting, electronics, home improvement and lifestyle products at Prasun Store."
  />

  <meta name="theme-color" content="#ffffff" />

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f8;
      --surface-2: #f2f2f4;
      --border: #e5e7eb;
      --text: #111111;
      --muted: #6b7280;
      --muted-2: #9ca3af;
      --danger: #dc2626;
      --radius: 18px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.modal-open,
    body.drawer-open {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .container {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* ================================
       HEADER
    ================================= */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.8);
    }

    .header-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      flex-shrink: 0;
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .header-search {
      flex: 1;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      padding: 0 18px 0 42px;
      outline: none;
      color: var(--text);
      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .search-input:focus {
      background: #fff;
      border-color: #b8bcc4;
    }

    .search-input::-webkit-search-cancel-button {
      cursor: pointer;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .cart-button {
      position: relative;
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
    }

    .cart-button:hover {
      background: var(--surface-2);
    }

    .cart-count {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 19px;
      text-align: center;
      border: 2px solid #fff;
    }

    /* ================================
       HERO
    ================================= */

    .hero {
      padding: 64px 0 34px;
    }

    .hero-inner {
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.04;
      letter-spacing: -2.5px;
      font-weight: 750;
    }

    .hero p {
      max-width: 650px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    /* ================================
       CATEGORIES
    ================================= */

    .category-wrapper {
      padding: 12px 0 30px;
    }

    .categories {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category {
      border: 1px solid var(--border);
      background: #fff;
      color: #4b5563;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .category:hover {
      border-color: #b9bdc5;
      color: #111;
    }

    .category.active {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    /* ================================
       PRODUCTS
    ================================= */

    .products-section {
      padding: 10px 0 70px;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    .product-count {
      color: var(--muted);
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .product-card {
      min-width: 0;
      cursor: pointer;
      outline: none;
    }

    .product-card:focus-visible {
      outline: 2px solid #111;
      outline-offset: 5px;
      border-radius: var(--radius);
    }

    .product-image-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      background: var(--surface);
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.035);
    }

    .product-info {
      padding: 13px 2px 0;
    }

    .product-category {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
      color: #171717;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      margin-top: 7px;
      font-size: 15px;
      font-weight: 700;
      color: #111;
    }

    .product-price-old {
      margin-left: 7px;
      color: var(--muted-2);
      font-size: 13px;
      font-weight: 400;
      text-decoration: line-through;
    }

    /* ================================
       LOADING / EMPTY
    ================================= */

    .loading {
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 15px;
      border: 3px solid #e5e7eb;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 80px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #111;
      font-size: 18px;
    }

    /* ================================
       PRODUCT MODAL
    ================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .product-modal {
      width: min(980px, 100%);
      max-height: min(900px, calc(100vh - 40px));
      overflow-y: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
      position: relative;
      overscroll-behavior: contain;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 5;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      display: grid;
      place-items: center;
      color: #111;
    }

    .modal-close:hover {
      background: #fff;
    }

    .modal-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .modal-image-panel {
      min-height: 480px;
      background: var(--surface);
    }

    .modal-image {
      width: 100%;
      height: 100%;
      min-height: 480px;
      object-fit: contain;
    }

    .modal-details {
      padding: 42px;
    }

    .modal-category {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .modal-title {
      margin: 0;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .modal-price {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 750;
    }

    .modal-price-old {
      margin-left: 8px;
      color: var(--muted-2);
      font-size: 15px;
      font-weight: 400;
      text-decoration: line-through;
    }

    /* ================================
       CLEAN PRODUCT DESCRIPTION
    ================================= */

    .modal-description {
      margin-top: 22px;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.7;
    }

    .modal-description h3 {
      margin: 24px 0 9px;
      color: #111111;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 700;
    }

    .modal-description h3:first-child {
      margin-top: 0;
    }

    .modal-description p {
      margin: 0 0 13px;
    }

    .modal-description ul,
    .modal-description ol {
      margin: 8px 0 18px;
      padding-left: 21px;
    }

    .modal-description li {
      margin: 7px 0;
      padding-left: 3px;
    }

    .modal-description strong,
    .modal-description b {
      color: #111111;
      font-weight: 700;
    }

    .modal-description em,
    .modal-description i {
      font-style: italic;
    }

    .modal-description br {
      line-height: 1.7;
    }

    .variant-section {
      margin-top: 25px;
    }

    .variant-label {
      margin-bottom: 9px;
      color: #111;
      font-size: 14px;
      font-weight: 650;
    }

    .variant-select {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 0 12px;
      color: #111;
      outline: none;
    }

    .variant-select:focus {
      border-color: #999;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
    }

    .primary-button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-weight: 650;
      transition: opacity 0.2s ease;
    }

    .primary-button:hover:not(:disabled) {
      opacity: 0.88;
    }

    .primary-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .secondary-button {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: #111;
      font-weight: 600;
    }

    .secondary-button:hover:not(:disabled) {
      background: var(--surface);
    }

    .secondary-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .stock-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ================================
       CART DRAWER
    ================================= */

    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      background: rgba(0, 0, 0, 0.38);
    }

    .drawer-overlay.open {
      display: block;
    }

    .cart-drawer {
      position: fixed;
      z-index: 121;
      top: 0;
      right: 0;
      width: min(430px, 100%);
      height: 100%;
      background: #fff;
      transform: translateX(100%);
      transition: transform 0.25s ease;
      box-shadow: -20px 0 50px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      height: 70px;
      flex-shrink: 0;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      margin: 0;
      font-size: 19px;
    }

    .drawer-close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center;
    }

    .drawer-close:hover {
      background: var(--surface-2);
    }

    .drawer-items {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      overscroll-behavior: contain;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 13px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-image {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--surface);
    }

    .cart-item-title {
      margin: 0;
      color: #111;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
    }

    .cart-item-variant {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .cart-item-bottom {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 700;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }

    .quantity-button {
      width: 30px;
      height: 30px;
      border: 0;
      background: #fff;
      color: #111;
      font-size: 17px;
    }

    .quantity-button:hover {
      background: var(--surface);
    }

    .quantity-value {
      min-width: 28px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .remove-item {
      margin-top: 6px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-item:hover {
      color: var(--danger);
    }

    .drawer-empty {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    .drawer-footer {
      flex-shrink: 0;
      padding: 18px 20px 22px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .drawer-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 16px;
    }

    .drawer-total strong {
      font-size: 19px;
    }

    .checkout-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-weight: 650;
    }

    .checkout-button:hover:not(:disabled) {
      opacity: 0.88;
    }

    .checkout-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ================================
       FOOTER
    ================================= */

    .site-footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-brand {
      color: #111;
      font-weight: 650;
    }

    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 1000px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .modal-details {
        padding: 30px;
      }
    }

    @media (max-width: 760px) {
      .header-inner {
        gap: 10px;
      }

      .brand {
        font-size: 18px;
      }

      .header-search {
        max-width: none;
      }

      .hero {
        padding: 45px 0 25px;
      }

      .hero h1 {
        letter-spacing: -1.7px;
      }

      .hero p {
        font-size: 15px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 13px;
      }

      .modal-content {
        grid-template-columns: 1fr;
      }

      .modal-image-panel {
        min-height: 340px;
      }

      .modal-image {
        min-height: 340px;
        max-height: 420px;
      }

      .modal-details {
        padding: 25px 22px 28px;
      }
    }

    @media (max-width: 480px) {
      .container {
        width: min(100% - 22px, 1200px);
      }

      .site-header .container {
        width: calc(100% - 20px);
      }

      .header-inner {
        min-height: 62px;
      }

      .brand {
        font-size: 17px;
      }

      .search-input {
        height: 38px;
        font-size: 13px;
        padding-left: 37px;
      }

      .search-icon {
        left: 12px;
        width: 16px;
        height: 16px;
      }

      .cart-button {
        width: 38px;
        height: 38px;
      }

      .hero {
        padding-top: 35px;
      }

      .categories {
        justify-content: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 5px;
        scrollbar-width: none;
      }

      .categories::-webkit-scrollbar {
        display: none;
      }

      .category {
        flex-shrink: 0;
        padding: 8px 14px;
        font-size: 13px;
      }

      .products-section {
        padding-bottom: 45px;
      }

      .section-top {
        margin-bottom: 16px;
      }

      .section-title {
        font-size: 18px;
      }

      .product-grid {
        gap: 20px 11px;
      }

      .product-info {
        padding-top: 10px;
      }

      .product-title {
        font-size: 14px;
      }

      .product-price {
        font-size: 14px;
      }

      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .product-modal {
        width: 100%;
        max-height: 94vh;
        border-radius: 22px 22px 0 0;
      }

      .modal-image-panel {
        min-height: 300px;
      }

      .modal-image {
        min-height: 300px;
        max-height: 360px;
      }

      .modal-details {
        padding: 22px 18px 25px;
      }

      .modal-title {
        font-size: 25px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- ================================
       HEADER
  ================================= -->

  <header class="site-header">
    <div class="container header-inner">

      <a
        class="brand"
        href="./index.html"
      >
        Prasun Store
      </a>

      <div class="header-search">

        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
          ></circle>

          <path
            d="m20 20-4-4"
          ></path>
        </svg>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search products"
          autocomplete="off"
          aria-label="Search products"
        />

      </div>

      <button
        id="cartButton"
        class="cart-button"
        type="button"
        aria-label="Open shopping cart"
      >

        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            d="M6 7h12l1 13H5L6 7Z"
          ></path>

          <path
            d="M9 7a3 3 0 0 1 6 0"
          ></path>
        </svg>

        <span
          id="cartCount"
          class="cart-count"
        >
          0
        </span>

      </button>

    </div>
  </header>


  <!-- ================================
       MAIN
  ================================= -->

  <main>

    <section class="hero">
      <div class="container hero-inner">

        <h1>
          Smart products for modern living.
        </h1>

        <p>
          Discover practical products for solar energy,
          lighting, electronics, home improvement,
          technology and everyday life.
        </p>

      </div>
    </section>


    <section class="category-wrapper">
      <div class="container">

        <div
          id="categories"
          class="categories"
        >

          <button
            class="category active"
            type="button"
            data-category=""
          >
            All
          </button>

        </div>

      </div>
    </section>


    <section class="products-section">
      <div class="container">

        <div class="section-top">

          <h2 class="section-title">
            Products
          </h2>

          <span
            id="productCount"
            class="product-count"
          ></span>

        </div>


        <div
          id="loadingState"
          class="loading"
        >

          <div class="spinner"></div>

          Loading products...

        </div>


        <div

     * index.html
     * cart.html
     * checkout.html

     * to all three keys for compatibility.

    const CART_KEYS = [

      "cart",

    const MAX_ITEM_QUANTITY = 99;

    /* =================================
       GENERAL UTILITIES
    ================================= */

    function normalizeQuantity(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return 1;
      }

      return Math.min(
        MAX_ITEM_QUANTITY,
        Math.max(
          1,
          Math.floor(number)
        )
      );
    }


    function formatPrice(
      value,
      currency = STORE_CURRENCY
    ) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "";
      }

      try {
        return new Intl.NumberFormat(
          undefined,
          {
            style: "currency",
            currency:
              currency ||
              STORE_CURRENCY
          }
        ).format(number);
      } catch {
        return `$${number.toFixed(2)}`;
      }
    }


    function normalizeCategories(
      value
    ) {
      if (Array.isArray(value)) {
        return value
          .map(item => {
            if (
              item &&
              typeof item ===
                "object"
            ) {
              return (
                item.name ??
                item.title ??
                item.category ??
                ""
              );
            }

            return item;
          })
          .map(item =>
            String(
              item ?? ""
            ).trim()
          )
          .filter(Boolean);
      }


      if (
        value &&
        typeof value === "object"
      ) {
        return [
          value.name ??
          value.title ??
          value.category ??
          ""
        ]
          .map(item =>
            String(
              item ?? ""
            ).trim()
          )
          .filter(Boolean);
      }


      const text =
        String(
          value ?? ""
        ).trim();

      if (!text) {
        return [];
      }


      try {
        const parsed =
          JSON.parse(text);

        if (
          Array.isArray(parsed)
        ) {
          return normalizeCategories(
            parsed
          );
        }

        if (
          parsed &&
          typeof parsed ===
            "object"
        ) {
          return normalizeCategories(
            parsed
          );
        }
      } catch {
        // Not JSON.
      }


      return text
        .split(",")
        .map(item =>
          item.trim()
        )
        .filter(Boolean);
    }


    function getProductCategories(
      product
    ) {
      const categories = [
        ...normalizeCategories(
          product?.store_categories
        ),
        ...normalizeCategories(
          product?.category
        )
      ];

      const seen = new Set();

      return categories.filter(
        category => {
          const key =
            category.toLowerCase();

          if (seen.has(key)) {
            return false;
          }

          seen.add(key);

          return true;
        }
      );
    }


    function getRawImageUrl(
      product
    ) {
      return (
        product?.main_image ||
        product?.images?.[0] ||
        ""
      );
    }


    function getProductImageUrl(
      url
    ) {
      if (!url) {
        return "";
      }

      const value =
        String(url).trim();

      if (!value) {
        return "";
      }

      return (
        API_BASE +
        "/api/image?url=" +
        encodeURIComponent(
          value
        )
      );
    }


    /* =================================
       DESCRIPTION CLEANER
    ================================= */

    function cleanDescriptionText(
      text
    ) {
      let value =
        String(
          text ?? ""
        );

      value = value
        .replace(
          /\u00a0/g,
          " "
        )
        .replace(
          /\r/g,
          ""
        )
        .replace(
          /[ \t]+/g,
          " "
        )
        .trim();


      /*
       * Remove supplier markdown
       * decoration.
       */
      value = value
        .replace(
          /^\s*#{1,6}\s*/g,
          ""
        )
        .replace(
          /^\s*\*+\s*/g,
          ""
        )
        .replace(
          /\s*\*+\s*$/g,
          ""
        )
        .replace(
          /^\s*_+\s*/g,
          ""
        )
        .replace(
          /\s*_+\s*$/g,
          ""
        );


      /*
       * Remove decorative CJ
       * brackets while keeping
       * the actual text.
       */
      value = value
        .replace(
          /【/g,
          ""
        )
        .replace(
          /】/g,
          ""
        );


      return value.trim();
    }


    function isHeadingText(
      text
    ) {
      const value =
        cleanDescriptionText(
          text
        )
          .replace(
            /[:：]\s*$/,
            ""
          )
          .trim()
          .toLowerCase();

      return [
        "features",
        "feature",
        "easy operation",
        "easy operations",
        "specifications",
        "specification",
        "package list",
        "package lists",
        "package contents",
        "package content"
      ].includes(value);
    }


    function headingLabel(
      text
    ) {
      const value =
        cleanDescriptionText(
          text
        )
          .replace(
            /[:：]\s*$/,
            ""
          )
          .trim()
          .toLowerCase();


      if (
        value === "package list" ||
        value === "package lists" ||
        value === "package content" ||
        value === "package contents"
      ) {
        return "Package Contents";
      }


      if (
        value === "feature" ||
        value === "features"
      ) {
        return "Features";
      }


      if (
        value === "specification" ||
        value === "specifications"
      ) {
        return "Specifications";
      }


      if (
        value === "easy operation" ||
        value === "easy operations"
      ) {
        return "Easy Operation";
      }


      return cleanDescriptionText(
        text
      );
    }


    function createCleanNode(
      sourceNode,
      targetParent
    ) {
      if (
        sourceNode.nodeType ===
        Node.TEXT_NODE
      ) {
        const text =
          cleanDescriptionText(
            sourceNode.textContent
          );

        if (!text) {
          return;
        }

        targetParent.appendChild(
          document.createTextNode(
            text
          )
        );

        return;
      }


      if (
        sourceNode.nodeType !==
        Node.ELEMENT_NODE
      ) {
        return;
      }


      const tag =
        sourceNode.tagName.toLowerCase();


      /*
       * Never allow unsafe supplier
       * content into the page.
       */
      const blocked =
        new Set([
          "script",
          "style",
          "iframe",
          "object",
          "embed",
          "svg",
          "form",
          "input",
          "button",
          "textarea",
          "select",
          "video",
          "audio",
          "canvas",
          "link",
          "meta"
        ]);


      if (blocked.has(tag)) {
        return;
      }


      /*
       * Remove <font> but preserve
       * everything inside it.
       */
      if (tag === "font") {
        Array.from(
          sourceNode.childNodes
        ).forEach(child => {
          createCleanNode(
            child,
            targetParent
          );
        });

        return;
      }


      const directText =
        sourceNode.textContent
          ?.replace(
            /\s+/g,
            " "
          )
          .trim() || "";


      /*
       * Convert supplier heading
       * structures to clean h3.
       */
      if (
        [
          "p",
          "div",
          "span",
          "b",
          "strong",
          "u",
          "i",
          "em"
        ].includes(tag) &&
        isHeadingText(
          directText
        )
      ) {
        const heading =
          document.createElement(
            "h3"
          );

        heading.textContent =
          headingLabel(
            directText
          );

        targetParent.appendChild(
          heading
        );

        return;
      }


      const allowed =
        new Set([
          "p",
          "ul",
          "ol",
          "li",
          "strong",
          "b",
          "em",
          "i",
          "h3",
          "br",
          "div",
          "span"
        ]);


      let targetTag =
        tag;


      if (
        !allowed.has(tag)
      ) {
        targetTag = "span";
      }


      const target =
        document.createElement(
          targetTag
        );


      /*
       * Deliberately copy NO
       * supplier attributes or CSS.
       */
      Array.from(
        sourceNode.childNodes
      ).forEach(child => {
        createCleanNode(
          child,
          target
        );
      });


      if (
        targetTag === "span" &&
        !target.textContent.trim()
      ) {
        return;
      }


      targetParent.appendChild(
        target
      );
    }


    function normalizeListStructure(
      root
    ) {
      const lists =
        root.querySelectorAll(
          "ul, ol"
        );


      lists.forEach(list => {
        const children =
          Array.from(
            list.childNodes
          );

        let textBuffer =
          "";


        children.forEach(node => {
          if (
            node.nodeType ===
            Node.TEXT_NODE
          ) {
            const text =
              node.textContent
                .replace(
                  /\s+/g,
                  " "
                )
                .trim();

            if (text) {
              textBuffer +=
                (
                  textBuffer
                    ? " "
                    : ""
                ) + text;
            }

            return;
          }


          if (
            node.nodeType ===
              Node.ELEMENT_NODE &&
            node.tagName.toLowerCase() ===
              "li"
          ) {
            if (textBuffer) {
              const li =
                document.createElement(
                  "li"
                );

              li.textContent =
                cleanDescriptionText(
                  textBuffer
                );

              list.insertBefore(
                li,
                node
              );

              textBuffer =
                "";
            }

            return;
          }


          if (
            node.nodeType ===
            Node.ELEMENT_NODE
          ) {
            const text =
              node.textContent
                .replace(
                  /\s+/g,
                  " "
                )
                .trim();

            if (text) {
              const li =
                document.createElement(
                  "li"
                );

              li.textContent =
                cleanDescriptionText(
                  text
                );

              list.insertBefore(
                li,
                node
              );

              node.remove();
            }
          }
        });


        if (textBuffer) {
          const li =
            document.createElement(
              "li"
            );

          li.textContent =
            cleanDescriptionText(
              textBuffer
            );

          list.appendChild(
            li
          );
        }
      });
    }


    function removeEmptyDescriptionNodes(
      root
    ) {
      const elements =
        root.querySelectorAll(
          "p, div, span, ul, ol, li, strong, b, em, i, h3"
        );


      elements.forEach(
        element => {
          const hasText =
            element.textContent
              .replace(
                /\s+/g,
                ""
              )
              .length > 0;

          const hasUsefulChildren =
            element.querySelector(
              "br, ul, ol, li"
            );


          if (
            !hasText &&
            !hasUsefulChildren
          ) {
            element.remove();
          }
        }
      );
    }


    function cleanProductDescription(
      source
    ) {
      if (!source) {
        return "";
      }


      const parser =
        new DOMParser();


      const sourceDocument =
        parser.parseFromString(
          String(source),
          "text/html"
        );


      const output =
        document.createElement(
          "div"
        );


      Array.from(
        sourceDocument.body.childNodes
      ).forEach(node => {
        createCleanNode(
          node,
          output
        );
      });


      normalizeListStructure(
        output
      );


      removeEmptyDescriptionNodes(
        output
      );


      output.innerHTML =
        output.innerHTML
          .replace(
            />\s+</g,
            "><"
          )
          .trim();


      return output.innerHTML;
    }


    /* =================================
       CART
    ================================= */

    function normalizeCartItem(
      item
    ) {
      return {
        product_id: String(
          item?.product_id ??
          item?.productId ??
          item?.id ??
          ""
        ).trim(),

        variant_id: String(
          item?.variant_id ??
          item?.variantId ??
          item?.cj_variant_id ??
          item?.vid ??
          ""
        ).trim(),

        sku: String(
          item?.sku ??
          item?.variant_sku ??
          item?.cj_sku ??
          ""
        ).trim(),

        title: String(
          item?.title ??
          item?.name ??
          "Product"
        ).trim(),

        variant_name: String(
          item?.variant_name ??
          item?.variantName ??
          item?.variant_options ??
          item?.variant ??
          ""
        ).trim(),

        image: String(
          item?.image ??
          item?.main_image ??
          item?.mainImage ??
          ""
        ).trim(),

        quantity:
          normalizeQuantity(
            item?.quantity ??
            item?.qty ??
            1
          ),

        price: Number(
          item?.price ?? 0
        ),

        currency: String(
          item?.currency ??
          STORE_CURRENCY
        ).trim()
      };
    }


    function cleanCart(
      items
    ) {
      return items
        .map(
          normalizeCartItem
        )
        .filter(
          item =>
            item.product_id &&
            item.quantity > 0
        );
    }


    function readCart() {
      for (
        const key of CART_KEYS
      ) {
        try {
          const raw =
            localStorage.getItem(
              key
            );

          if (!raw) {
            continue;
          }


          const parsed =
            JSON.parse(raw);


          if (
            Array.isArray(parsed) &&
            parsed.length
          ) {
            return cleanCart(
              parsed
            );
          }
        } catch (error) {
          console.warn(
            "Could not read cart key:",
            key,
            error
          );
        }
      }


      return [];
    }


    function saveCart() {
      const canonical =
        cleanCart(
          state.cart
        );


      state.cart =
        canonical;


      const serialized =
        JSON.stringify(
          canonical
        );


      /*
       * Keep all cart keys
       * synchronized.
       */
      CART_KEYS.forEach(
        key => {
          try {
            localStorage.setItem(
              key,
              serialized
            );
          } catch (error) {
            console.warn(
              "Could not save cart:",
              key,
              error
            );
          }
        }
      );


      updateCartUI();
    }


    function cartItemKey(
      productId,
      variantId,
      sku
    ) {
      return [
        String(
          productId || ""
        ),
        String(
          variantId || ""
        ),
        String(
          sku || ""
        )
      ].join("::");
    }


    function addProductToCart(
      product,
      variant,
      quantity = 1
    ) {
      if (
        !product?.product_id
      ) {
        alert(
          "This product cannot be added to the cart."
        );

        return false;
      }


      const variants =
        getVariants(
          product
        );


      /*
       * Multi-variant products
       * require a selection.
       */
      if (
        variants.length > 1 &&
        !variant
      ) {
        alert(
          "Please select an option."
        );

        return false;
      }


      /*
       * Only reject if stock is
       * explicitly known to be zero.
       *
       * Missing stock is NOT treated
       * as out of stock.
       */
      if (variant) {
        const variantStock =
          Number(
            variant.stock
          );


        if (
          variant.stock !==
            undefined &&
          variant.stock !==
            null &&
          variant.stock !==
            "" &&
          Number.isFinite(
            variantStock
          ) &&
          variantStock <= 0
        ) {
          alert(
            "This option is currently out of stock."
          );

          return false;
        }
      } else {
        const productStock =
          Number(
            product.total_available_stock
          );


        if (
          product.total_available_stock !==
            undefined &&
          product.total_available_stock !==
            null &&
          product.total_available_stock !==
            "" &&
          Number.isFinite(
            productStock
          ) &&
          productStock <= 0
        ) {
          alert(
            "This product is currently out of stock."
          );

          return false;
        }
      }


      const item =
        normalizeCartItem({
          product_id:
            product.product_id,

          variant_id:
            variant?.cj_variant_id ||
            variant?.variant_id ||
            "",

          sku:
            variant?.sku ||
            "",

          title:
            product.title ||
            "Product",

          variant_name:
            variant?.name ||
            variant?.variant_options ||
            "",

          image:
            variant?.image ||
            getRawImageUrl(
              product
            ),

          quantity:
            normalizeQuantity(
              quantity
            ),

          price:
            variant?.price ??
            product.sale_price ??
            product.price ??
            0,

          currency:
            product.currency ||
            STORE_CURRENCY
        });


      const key =
        cartItemKey(
          item.product_id,
          item.variant_id,
          item.sku
        );


      const existingIndex =
        state.cart.findIndex(
          cartItem =>
            cartItemKey(
              cartItem.product_id,
              cartItem.variant_id,
              cartItem.sku
            ) === key
        );


      if (
        existingIndex >= 0
      ) {
        const existing =
          state.cart[
            existingIndex
          ];


        existing.quantity =
          Math.min(
            MAX_ITEM_QUANTITY,
            normalizeQuantity(
              existing.quantity
            ) +
              item.quantity
          );


        /*
         * Refresh current product
         * information.
         */
        existing.price =
          item.price;

        existing.currency =
          item.currency;

        existing.title =
          item.title;

        existing.image =
          item.image;

        existing.variant_name =
          item.variant_name;
      } else {
        state.cart.push(
          item
        );
      }


      saveCart();


      return true;
    }


    function getCartQuantity() {
      return state.cart.reduce(
        (
          total,
          item
        ) =>
          total +
          normalizeQuantity(
            item.quantity
          ),
        0
      );
    }


    function getCartTotal() {
      return state.cart.reduce(
        (
          total,
          item
        ) => {
          const price =
            Number(
              item.price
            ) || 0;

          const quantity =
            normalizeQuantity(
              item.quantity
            );

          return (
            total +
            price * quantity
          );
        },
        0
      );
    }


    function updateCartUI() {
      elements.cartCount.textContent =
        String(
          getCartQuantity()
        );

      renderCartDrawer();
    }


    /* =================================
       PRODUCT DATA
    ================================= */

    async function fetchProducts() {
      const response =
        await fetch(
          API_BASE +
            "/api/products",
          {
            method: "GET",
            headers: {
              Accept:
                "application/json"
            },
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          "Products request failed: " +
          response.status
        );
      }


      const data =
        await response.json();


      if (
        Array.isArray(data)
      ) {
        return data;
      }


      if (
        data &&
        Array.isArray(
          data.products
        )
      ) {
        return data.products;
      }


      if (
        data &&
        Array.isArray(
          data.data
        )
      ) {
        return data.data;
      }


      return [];
    }


    function normalizeProduct(
      product
    ) {
      const rawStock =
        product?.total_available_stock;


      let totalStock =
        null;


      /*
       * IMPORTANT:
       * Missing stock remains null.
       * It is NOT converted to zero.
       */
      if (
        rawStock !==
          undefined &&
        rawStock !==
          null &&
        rawStock !==
          ""
      ) {
        const numericStock =
          Number(
            rawStock
          );

        if (
          Number.isFinite(
            numericStock
          )
        ) {
          totalStock =
            numericStock;
        }
      }


      return {
        ...product,

        product_id: String(
          product?.product_id ??
          product?.id ??
          ""
        ).trim(),

        title: String(
          product?.title ??
          product?.name ??
          "Product"
        ).trim(),

        description:
          product?.description ||
          "",

        images:
          Array.isArray(
            product?.images
          )
            ? product.images
            : [],

        main_image:
          product?.main_image ||
          product?.images?.[0] ||
          "",

        category:
          product?.category ||
          "",

        store_categories:
          product?.store_categories ??
          [],

        currency:
          product?.currency ||
          STORE_CURRENCY,

        price:
          Number(
            product?.price ??
            0
          ),

        sale_price:
          Number(
            product?.sale_price ??
            product?.price ??
            0
          ),

        skus:
          Array.isArray(
            product?.skus
          )
            ? product.skus
            : [],

        total_available_stock:
          totalStock
      };
    }

    function renderCategories() {
      const categoryMap =
        new Map();


      state.products.forEach(
        product => {
          getProductCategories(

          ).forEach(
            category => {
              const key =
                category.toLowerCase();


              if (
                !categoryMap.has(
                  key
                )
              ) {
                categoryMap.set(
                  key,
                  category
                );
              }
            }
          );
        }
      );


      elements.categories.innerHTML =
        "";


      const allButton =
        document.createElement(
          "button"
        );


      allButton.type =
        "button";

      allButton.className =
        "category" +
        (
          state.category ===
          ""
            ? " active"
            : ""
        );

      allButton.dataset.category =
        "";

      allButton.textContent =
        "All";


      elements.categories.appendChild(
        allButton
      );


      Array.from(
        categoryMap.values()
      )
        .sort(
          (a, b) =>
            a.localeCompare(
              b
            )
        )
        .forEach(
          category => {

              document.createElement(
                "button"
              );

              (

    function filteredProducts() {
      const query =
        state.search
          .trim()
          .toLowerCase();


      return state.products.filter(
        product => {
          const productCategories =
            getProductCategories(
              product
            ).map(
              category =>
                category.toLowerCase()
            );


          const matchesCategory =
            !state.category ||
            productCategories.includes(
              state.category.toLowerCase()
            );


          const searchable = [
            product.title,
            product.original_title,
            product.category,
            product.store_categories,
            product.description
          ]
            .map(
              value =>
                Array.isArray(
                  value
                )
                  ? value.join(
                      " "
                    )
                  : String(
                      value ??
                        ""
                    )
            )
            .join(" ")
            .toLowerCase();


          const matchesSearch =
            !query ||
            searchable.includes(
              query
            );


          return (
            matchesCategory &&
            matchesSearch
          );
        }
      );
    }

    /* =================================
       VARIANTS
    ================================= */

    function getVariants(
      product
    ) {
      if (
        !Array.isArray(
          product?.skus
        )
      ) {
        return [];
      }


      return product.skus.filter(
        variant =>
          variant &&
          (
            variant.cj_variant_id ||
            variant.variant_id ||
            variant.sku
          )
      );
    }


    function getSelectedVariant(
      product
    ) {
      const variants =
        getVariants(
          product
        );


      if (
        state.selectedVariant
      ) {
        const selectedId =
          String(
            state.selectedVariant
              .cj_variant_id ??
            state.selectedVariant
              .variant_id ??
            state.selectedVariant
              .sku ??
            ""
          );


        const matching =
          variants.find(
            variant =>
              String(
                variant.cj_variant_id ??
                variant.variant_id ??
                variant.sku ??
                ""
              ) ===
              selectedId
          );


        if (matching) {
          return matching;
        }
      }


      /*
       * Automatically select only
       * when exactly one variant
       * exists.
       */
      if (
        variants.length ===
        1
      ) {
        return variants[0];
      }


      return null;
    }


    /* =================================
       MODAL PRICING / STOCK
    ================================= */

    function updateModalPricing() {
      const product =
        state.selectedProduct;


      if (!product) {
        return;
      }


      const variants =
        getVariants(
          product
        );


      const variant =
        getSelectedVariant(
          product
        );


      state.selectedVariant =
        variant;


      const price =
        Number(
          variant?.price ??
          product.sale_price ??
          product.price ??
          0
        );


      elements.modalPrice.textContent =
        formatPrice(
          price,
          product.currency
        );


      /*
       * Stock handling:
       *
       * Known 0 = out of stock
       * Known > 0 = available
       * Unknown = available unless
       * the backend explicitly says
       * otherwise.
       */
      let stockKnown =
        false;

      let stock =
        null;


      if (variant) {
        if (
          variant.stock !==
            undefined &&
          variant.stock !==
            null &&
          variant.stock !==
            ""
        ) {
          const numericStock =
            Number(
              variant.stock
            );


          if (
            Number.isFinite(
              numericStock
            )
          ) {
            stock =
              numericStock;

            stockKnown =
              true;
          }
        }
      } else if (
        product.total_available_stock !==
          undefined &&
        product.total_available_stock !==
          null
      ) {
        const numericStock =
          Number(
            product.total_available_stock
          );


        if (
          Number.isFinite(
            numericStock
          )
        ) {
          stock =
            numericStock;

          stockKnown =
            true;
        }
      }


      const definitelyOutOfStock =
        stockKnown &&
        stock <= 0;


      if (stockKnown) {
        elements.stockNote.textContent =
          stock > 0
            ? `${stock} available`
            : "Out of stock";
      } else {
        elements.stockNote.textContent =
          "Available";
      }


      const requiresVariant =
        variants.length >
        1;


      const noVariantSelected =
        requiresVariant &&
        !variant;


      const disabled =
        definitelyOutOfStock ||
        noVariantSelected;


      elements.addToCartButton.disabled =
        disabled;


      elements.buyNowButton.disabled =
        disabled;
    }


    function renderVariantSelector(
      product
    ) {
      const variants =
        getVariants(
          product
        );


      elements.variantSelect.innerHTML =
        "";


      if (
        variants.length <=
        1
      ) {
        elements.variantSection.hidden =
          true;


        state.selectedVariant =
          variants.length ===
          1
            ? variants[0]
            : null;


        return;
      }


      elements.variantSection.hidden =
        false;


      const placeholder =
        document.createElement(
          "option"
        );


      placeholder.value =
        "";


      placeholder.textContent =
        "Select an option";


      placeholder.disabled =
        true;


      placeholder.selected =
        true;


      elements.variantSelect.appendChild(
        placeholder
      );


      variants.forEach(
        variant => {
          const option =
            document.createElement(
              "option"
            );


          option.value =
            String(
              variant.cj_variant_id ??
              variant.variant_id ??
              variant.sku ??
              ""
            );


          const optionName =
            variant.name ||
            variant.variant_options ||
            variant.sku ||
            "Option";


          const rawStock =
            variant.stock;


          let stockKnown =
            false;

          let stock =
            null;


          if (
            rawStock !==
              undefined &&
            rawStock !==
              null &&
            rawStock !==
              ""
          ) {
            const numericStock =
              Number(
                rawStock
              );


            if (
              Number.isFinite(
                numericStock
              )
            ) {
              stock =
                numericStock;

              stockKnown =
                true;
            }
          }


          option.textContent =
            stockKnown &&
            stock <= 0
              ? `${optionName} — Out of stock`
              : optionName;


          /*
           * Only disable when CJ
           * explicitly reports zero.
           */
          option.disabled =
            stockKnown &&
            stock <= 0;


          elements.variantSelect.appendChild(
            option
          );
        }
      );


      state.selectedVariant =
        null;
    }

    function changeCartQuantity(
      index,
      change
    ) {
      if (
        !state.cart[index]
      ) {
        return;
      }


      const current =
        normalizeQuantity(
          state.cart[
            index
          ].quantity
        );


      const next =
        Math.min(
          MAX_ITEM_QUANTITY,
          Math.max(
            1,
            current + change
          )
        );


      state.cart[
        index
      ].quantity =
        next;


      saveCart();
    }


    function removeCartItem(
      index
    ) {
      if (
        index < 0 ||
        index >=
          state.cart.length
      ) {
        return;
      }


      state.cart.splice(
        index,
        1
      );


      saveCart();
    }

      );


      document.body.classList.remove(
        "drawer-open"
      );
    }

    ================================= */

    function goToCheckout() {
      /*
       * Make sure the latest cart
       * is synchronized before leaving
       * the store page.
       */
      state.cart =
        cleanCart(
          state.cart
        );


      if (
        !state.cart.length
      ) {
        return;
      }


      saveCart();


      /*
       * IMPORTANT:
       *
       * checkout.html is in the same
       * directory as index.html.
       */
      window.location.href =
        "./checkout.html";
    }

      () => {
        closeProductModal();
      }
    );


    elements.modalOverlay.addEventListener(
      "click",
      event => {
        if (
          event.target ===
          elements.modalOverlay
        ) {
          closeProductModal();
        }
      }
    );


    elements.variantSelect.addEventListener(
      "change",
      event => {
        const product =
          state.selectedProduct;


        if (!product) {
          return;
        }


        const variants =
          getVariants(
            product
          );


        state.selectedVariant =
          variants.find(
            variant =>
              String(
                variant.cj_variant_id ??
                variant.variant_id ??
                variant.sku ??
                ""
              ) ===
              event.target.value
          ) || null;


        /*
         * Immediately update price,
         * stock and button state.
         */
        updateModalPricing();
      }
    );


    /* =================================
       ADD TO CART
    ================================= */

    elements.addToCartButton.addEventListener(
      "click",
      () => {
        const product =
          state.selectedProduct;


        if (!product) {
          return;
        }


        const variant =
          getSelectedVariant(
            product
          );


        const added =
          addProductToCart(
            product,
            variant,
            1
          );


        if (!added) {
          return;
        }


        closeProductModal();

        openCart();
      }
    );


    /* =================================
       BUY NOW
    ================================= */

    elements.buyNowButton.addEventListener(
      "click",
      () => {
        const product =
          state.selectedProduct;


        if (!product) {
          return;
        }


        const variant =
          getSelectedVariant(
            product
          );


        const added =
          addProductToCart(
            product,
            variant,
            1
          );


        if (!added) {
          return;
        }


        closeProductModal();


        /*
         * Go directly to the
         * real checkout page.
         */
        window.location.href =
          "./checkout.html";
      }
    );


    /* =================================
       CART CHECKOUT BUTTON
    ================================= */

    elements.checkoutButton.addEventListener(
      "click",
      () => {
        goToCheckout();
      }
    );


    /* =================================
       ESCAPE KEY
    ================================= */

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key !==
          "Escape"
        ) {
          return;
        }


        if (
          elements.modalOverlay.classList.contains(
            "open"
          )
        ) {
          closeProductModal();
        }


        if (
          elements.cartDrawer.classList.contains(
            "open"
          )
        ) {
          closeCart();
        }
      }
    );


    /* =================================
       CROSS-TAB CART SYNC
    ================================= */

    window.addEventListener(
      "storage",
      () => {
        state.cart =
          readCart();

        updateCartUI();
      }
    );


    /* =================================
       INITIALIZATION
    ================================= */

    async function initialize() {
      /*
       * Load existing cart first.
       */
      state.cart =
        readCart();


      updateCartUI();


      try {
        const products =
          await fetchProducts();


        state.products =
          products
            .map(
              normalizeProduct
            )
            .filter(
              product =>
                product.product_id
            );


        renderCategories();

        renderProducts();


        elements.loadingState.hidden =
          true;


        elements.productGrid.hidden =
          false;
      } catch (error) {
        console.error(
          "Could not load products:",
          error
        );


        elements.loadingState.innerHTML =
          "";


        const title =
          document.createElement(
            "strong"
          );


        title.textContent =
          "Unable to load products";


        const message =
          document.createElement(
            "div"
          );


        message.style.marginTop =
          "8px";


        message.textContent =
          "Please refresh the page and try again.";


        elements.loadingState.appendChild(
          title
        );


        elements.loadingState.appendChild(
          message
        );
      }
    }


    initialize();
  </script>

</body>
</html>
