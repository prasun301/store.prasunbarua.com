<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prasun Store | Smart Products for Everyday Life</title>

  <meta
    name="description"
    content="Prasun Store offers practical products for technology, home, lifestyle, electronics and solar energy."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid #eeeeee;
    }

    .header-inner {
      max-width: 1200px;
      height: 64px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      font-weight: 400;
      color: #777777;
    }

    .search {
      flex: 1;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
    }

    .search input {
      width: 100%;
      height: 40px;
      border: 1px solid #dddddd;
      border-radius: 20px;
      padding: 0 42px 0 16px;
      outline: none;
      background: #f7f7f7;
      color: #222222;
      transition: 0.2s;
    }

    .search input:focus {
      background: #ffffff;
      border-color: #bdbdbd;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .search button {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: #555555;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
      color: #333333;
    }

    .icon-button:hover {
      background: #f3f3f3;
    }

    .cart-button {
      position: relative;
    }

    .cart-count {
      position: absolute;
      top: 1px;
      right: 0;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 10px;
      background: #111111;
      color: white;
      font-size: 10px;
      line-height: 17px;
      text-align: center;
    }

    /* Hero */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 80px 20px 55px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -2.5px;
      font-weight: 700;
    }

    .hero p {
      max-width: 620px;
      margin: 20px auto 0;
      color: #6e6e73;
      font-size: 18px;
    }

    .hero-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      height: 46px;
      padding: 0 23px;
      border-radius: 23px;
      background: #111111;
      color: white;
      border: 0;
      font-weight: 600;
    }

    .hero-button:hover {
      background: #333333;
    }

    /* Categories */

    .categories {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 35px;
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid #dddddd;
      background: #ffffff;
      border-radius: 20px;
      padding: 8px 16px;
      color: #555555;
      font-size: 14px;
    }

    .category:hover,
    .category.active {
      background: #111111;
      color: white;
      border-color: #111111;
    }

    /* Products */

    .products-section {
      max-width: 1200px;
      margin: auto;
      padding: 10px 20px 80px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 20px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.8px;
    }

    .sort {
      height: 38px;
      border: 1px solid #dddddd;
      border-radius: 19px;
      padding: 0 12px;
      background: white;
      color: #444444;
      outline: none;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .product-card {
      min-width: 0;
      cursor: pointer;
    }

    .product-image {
      aspect-ratio: 1 / 1;
      background: #f6f6f6;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-image img {
      transform: scale(1.03);
    }

    .product-info {
      padding: 13px 2px 0;
    }

    .product-category {
      font-size: 12px;
      color: #777777;
      margin-bottom: 4px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      min-height: 41px;
    }

    .product-price {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .stock {
      margin-top: 4px;
      font-size: 12px;
      color: #777777;
    }

    /* Loading */

    .loading {
      text-align: center;
      padding: 70px 20px;
      color: #777777;
    }

    .spinner {
      width: 25px;
      height: 25px;
      border: 2px solid #dddddd;
      border-top-color: #111111;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      text-align: center;
      padding: 60px 20px;
      color: #777777;
    }

    /* Product Modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      background: rgba(0, 0, 0, 0.35);
      padding: 30px;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      position: relative;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.2);
    }

    .modal-close {
      position: absolute;
      z-index: 5;
      top: 15px;
      right: 15px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      display: grid;
      place-items: center;
    }

    .modal-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-image {
      background: #f6f6f6;
      min-height: 500px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 25px;
    }

    .modal-details {
      padding: 50px 40px 40px;
    }

    .modal-category {
      font-size: 13px;
      color: #777777;
    }

    .modal-details h2 {
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -1px;
      margin: 8px 0 15px;
    }

    .modal-price {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-description {
      color: #666666;
      font-size: 14px;
      line-height: 1.65;
      max-height: 230px;
      overflow-y: auto;
    }

    .modal-description img {
      max-height: 180px;
      width: auto;
      margin: 10px 0;
    }

    .variant-label {
      margin-top: 25px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .variant-select {
      width: 100%;
      height: 42px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      padding: 0 12px;
      background: white;
    }

    .add-button {
      width: 100%;
      height: 48px;
      margin-top: 25px;
      border: 0;
      border-radius: 24px;
      background: #111111;
      color: white;
      font-weight: 600;
    }

    .add-button:hover {
      background: #333333;
    }

    /* Cart */

    .cart {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      background: rgba(0, 0, 0, 0.3);
    }

    .cart.open {
      display: block;
    }

    .cart-panel {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: min(420px, 100%);
      background: white;
      padding: 25px;
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.12);
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid #eeeeee;
    }

    .cart-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      background: #f5f5f5;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-size: 14px;
      line-height: 1.3;
    }

    .cart-item-price {
      font-size: 14px;
      font-weight: 600;
      margin-top: 4px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity button {
      width: 25px;
      height: 25px;
      border: 1px solid #dddddd;
      background: white;
      border-radius: 50%;
    }

    .remove {
      border: 0;
      background: transparent;
      color: #777777;
      font-size: 12px;
      margin-top: 5px;
      padding: 0;
    }

    .cart-footer {
      border-top: 1px solid #eeeeee;
      padding-top: 20px;
    }

    .subtotal {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .checkout {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #111111;
      color: white;
      font-weight: 600;
    }

    /* Toast */

    .toast {
      position: fixed;
      z-index: 500;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #111111;
      color: white;
      padding: 11px 18px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */

    footer {
      border-top: 1px solid #eeeeee;
      padding: 45px 20px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-brand {
      font-weight: 600;
    }

    .footer-text {
      color: #777777;
      font-size: 13px;
      margin-top: 7px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      color: #666666;
      font-size: 13px;
    }

    /* Mobile */

    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .modal-content {
        grid-template-columns: 1fr;
      }

      .modal-image {
        min-height: 350px;
        max-height: 400px;
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        height: 58px;
        gap: 8px;
      }

      .logo {
        font-size: 17px;
      }

      .search {
        display: none;
      }

      .hero {
        padding: 60px 20px 40px;
      }

      .hero h1 {
        letter-spacing: -1.8px;
      }

      .hero p {
        font-size: 16px;
      }

      .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 12px;
      }

      .product-image {
        border-radius: 14px;
      }

      .section-header h2 {
        font-size: 23px;
      }

      .sort {
        max-width: 130px;
      }

      .modal {
        padding: 10px;
        align-items: flex-end;
      }

      .modal-box {
        max-height: 94vh;
        border-radius: 22px 22px 0 0;
      }

      .modal-details {
        padding: 30px 22px 25px;
      }

      .modal-details h2 {
        font-size: 25px;
      }

      .footer-inner {
        flex-direction: column;
      }

      .footer-links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="/" class="logo">
      PRASUN <span>STORE</span>
    </a>

    <div class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Search products"
        autocomplete="off"
      >

      <button id="searchButton" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </button>
    </div>

    <div class="header-actions">

      <button
        class="icon-button cart-button"
        id="cartButton"
        aria-label="Shopping cart"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7">
          <path d="M3 4h2l2.2 11h10.9l2-8H6"></path>
          <circle cx="10" cy="19" r="1.2"></circle>
          <circle cx="18" cy="19" r="1.2"></circle>
        </svg>

        <span class="cart-count" id="cartCount">0</span>
      </button>

    </div>
  </div>
</header>


<main>

  <section class="hero">
    <h1>Smart products.<br>Simple living.</h1>

    <p>
      Explore practical products for technology, home, electronics,
      lifestyle and solar energy.
    </p>

    <button
      class="hero-button"
      onclick="document.getElementById('products').scrollIntoView()"
    >
      Shop products
    </button>
  </section>


  <div class="categories" id="categories">

    <button class="category active" data-category="">
      All
    </button>

    <button class="category" data-category="Solar Lights">
      Solar Lights
    </button>

    <button class="category" data-category="LED Lighting">
      LED Lighting
    </button>

    <button class="category" data-category="LED Strip Lights">
      LED Strip Lights
    </button>

    <button class="category" data-category="Solar Garden">
      Solar Garden
    </button>

    <button class="category" data-category="Home Improvement">
      Home Improvement
    </button>

    <button class="category" data-category="Kitchen">
      Kitchen
    </button>

    <button class="category" data-category="Electronics">
      Electronics
    </button>

    <button class="category" data-category="Lifestyle">
      Lifestyle
    </button>

  </div>


  <section class="products-section" id="products">

    <div class="section-header">

      <h2>Products</h2>

      <select class="sort" id="sortSelect">
        <option value="default">Recommended</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="new">Newest</option>
      </select>

    </div>


    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading products...
    </div>


    <div
      id="productGrid"
      class="product-grid"
      style="display:none;"
    ></div>


    <div
      id="message"
      class="message"
      style="display:none;"
    ></div>

  </section>

</main>


<footer>

  <div class="footer-inner">

    <div>
      <div class="footer-brand">PRASUN STORE</div>

      <div class="footer-text">
        Technology, home, lifestyle and solar products.
      </div>
    </div>

    <div class="footer-links">
      <a href="/">Home</a>
      <a href="#products">Products</a>
      <a href="#categories">Categories</a>
    </div>

  </div>

</footer>


<!-- Product Modal -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <button
      class="modal-close"
      id="modalClose"
      aria-label="Close"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.8">
        <path d="m6 6 12 12"></path>
        <path d="m18 6-12 12"></path>
      </svg>
    </button>

    <div class="modal-content">

      <div class="modal-image">
        <img id="modalImage" src="" alt="">
      </div>

      <div class="modal-details">

        <div class="modal-category" id="modalCategory"></div>

        <h2 id="modalTitle"></h2>

        <div class="modal-price" id="modalPrice"></div>

        <div
          class="modal-description"
          id="modalDescription"
        ></div>

        <div id="variantContainer"></div>

        <button
          class="add-button"
          id="addToCartButton"
        >
          Add to Cart
        </button>

      </div>

    </div>

  </div>

</div>


<!-- Cart -->

<div class="cart" id="cart">

  <div class="cart-panel">

    <div class="cart-header">

      <h2>Your Cart</h2>

      <button
        class="icon-button"
        id="cartClose"
        aria-label="Close cart"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8">
          <path d="m6 6 12 12"></path>
          <path d="m18 6-12 12"></path>
        </svg>
      </button>

    </div>


    <div class="cart-items" id="cartItems"></div>


    <div class="cart-footer">

      <div class="subtotal">
        <span>Subtotal</span>
        <span id="cartSubtotal">$0.00</span>
      </div>

      <button
        class="checkout"
        id="checkoutButton"
      >
        Checkout
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

  /*
    Your Cloudflare Worker is serving the API
    from the same domain.

    If your Worker uses another domain, change this to:
    const API_BASE = "https://your-worker-domain.com";
  */

  const API_BASE = "";


  const state = {
    products: [],
    filtered: [],
    category: "",
    search: "",
    sort: "default",
    selectedProduct: null,
    selectedSku: null,
    cart: JSON.parse(localStorage.getItem("prasun_cart") || "[]")
  };


  const productGrid = document.getElementById("productGrid");
  const loading = document.getElementById("loading");
  const message = document.getElementById("message");

  const productModal = document.getElementById("productModal");
  const cart = document.getElementById("cart");

  const modalImage = document.getElementById("modalImage");
  const modalTitle = document.getElementById("modalTitle");
  const modalCategory = document.getElementById("modalCategory");
  const modalPrice = document.getElementById("modalPrice");
  const modalDescription = document.getElementById("modalDescription");

  const variantContainer =
    document.getElementById("variantContainer");


  /* Image helper */

  function imageUrl(url) {

    if (!url) {
      return "";
    }

    if (
      url.startsWith("/") ||
      url.startsWith(window.location.origin)
    ) {
      return url;
    }

    return API_BASE +
      "/api/image?url=" +
      encodeURIComponent(url);
  }


  /* Escape text */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* Basic description cleaning */

  function cleanDescription(html) {

    if (!html) {
      return "";
    }

    const wrapper = document.createElement("div");
    wrapper.innerHTML = html;

    wrapper
      .querySelectorAll(
        "script,iframe,object,embed,style,link,form,input,button"
      )
      .forEach(el => el.remove());

    wrapper
      .querySelectorAll("*")
      .forEach(el => {

        [...el.attributes].forEach(attr => {

          if (
            attr.name.toLowerCase().startsWith("on") ||
            attr.name.toLowerCase() === "style"
          ) {
            el.removeAttribute(attr.name);
          }

          if (
            attr.name.toLowerCase() === "href" &&
            attr.value.toLowerCase().startsWith("javascript:")
          ) {
            el.removeAttribute(attr.name);
          }
        });

      });

    return wrapper.innerHTML;
  }


  /* Load products */

  async function loadProducts() {

    loading.style.display = "block";
    productGrid.style.display = "none";
    message.style.display = "none";

    try {

      const response = await fetch(
        API_BASE + "/api/products",
        {
          method: "GET",
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();

      console.log("Product API response:", data);

      if (!data.success) {
        throw new Error("Product API returned an error");
      }

      state.products = Array.isArray(data.products)
        ? data.products
        : [];

      applyFilters();

    } catch (error) {

      console.error("Product loading error:", error);

      loading.style.display = "none";
      productGrid.style.display = "none";

      message.style.display = "block";

      message.innerHTML = `
        <strong>Unable to load products</strong>
        <br>
        <span>Please refresh the page and try again.</span>
      `;
    }
  }


  /* Filter */

  function applyFilters() {

    let products = [...state.products];


    if (state.category) {

      products = products.filter(product => {

        const category =
          String(product.category || "").toLowerCase();

        const storeCategories =
          Array.isArray(product.store_categories)
            ? product.store_categories
            : [];

        return (
          category === state.category.toLowerCase() ||
          storeCategories.some(
            item =>
              String(item).toLowerCase() ===
              state.category.toLowerCase()
          )
        );

      });

    }


    if (state.search) {

      const search =
        state.search.toLowerCase();

      products = products.filter(product => {

        return (
          String(product.title || "")
            .toLowerCase()
            .includes(search) ||

          String(product.category || "")
            .toLowerCase()
            .includes(search)
        );

      });

    }


    if (state.sort === "low") {

      products.sort(
        (a, b) =>
          Number(a.price || 0) -
          Number(b.price || 0)
      );

    }


    if (state.sort === "high") {

      products.sort(
        (a, b) =>
          Number(b.price || 0) -
          Number(a.price || 0)
      );

    }


    if (state.sort === "new") {

      products.sort(
        (a, b) =>
          new Date(b.imported_at || 0) -
          new Date(a.imported_at || 0)
      );

    }


    state.filtered = products;

    renderProducts();
  }


  /* Render products */

  function renderProducts() {

    loading.style.display = "none";

    productGrid.innerHTML = "";

    if (!state.filtered.length) {

      productGrid.style.display = "none";

      message.style.display = "block";

      message.innerHTML =
        "No products found.";

      return;
    }


    message.style.display = "none";
    productGrid.style.display = "grid";


    const fragment =
      document.createDocumentFragment();


    state.filtered.forEach((product, index) => {

      const card =
        document.createElement("article");

      card.className = "product-card";

      const image =
        imageUrl(
          product.main_image ||
          (Array.isArray(product.images)
            ? product.images[0]
            : "")
        );


      const price =
        Number(product.price || 0)
          .toFixed(2);


      const stock =
        Number(product.total_available_stock || 0);


      card.innerHTML = `

        <div class="product-image">

          ${
            image
              ? `
                <img
                  src="${escapeHtml(image)}"
                  alt="${escapeHtml(product.title)}"
                  loading="${index < 4 ? "eager" : "lazy"}"
                  decoding="async"
                  onerror="this.style.display='none'"
                >
              `
              : ""
          }

        </div>


        <div class="product-info">

          <div class="product-category">
            ${escapeHtml(product.category || "Product")}
          </div>

          <div class="product-title">
            ${escapeHtml(product.title)}
          </div>

          <div class="product-price">
            $${price}
          </div>

          <div class="stock">
            ${
              stock > 0
                ? "In stock"
                : "Currently unavailable"
            }
          </div>

        </div>
      `;


      card.addEventListener(
        "click",
        () => openProduct(product)
      );


      fragment.appendChild(card);

    });


    productGrid.appendChild(fragment);
  }


  /* Open product */

  function openProduct(product) {

    state.selectedProduct = product;


    const firstSku =
      Array.isArray(product.skus) &&
      product.skus.length
        ? product.skus[0]
        : null;


    state.selectedSku = firstSku;


    modalTitle.textContent =
      product.title || "";


    modalCategory.textContent =
      product.category || "";


    updateModalPrice();


    modalDescription.innerHTML =
      cleanDescription(product.description);


    const mainImage =
      firstSku?.image ||
      product.main_image ||
      (
        Array.isArray(product.images)
          ? product.images[0]
          : ""
      );


    modalImage.src =
      imageUrl(mainImage);


    modalImage.alt =
      product.title || "";


    renderVariants();


    productModal.classList.add("open");

    document.body.style.overflow = "hidden";
  }


  /* Update modal price */

  function updateModalPrice() {

    const product =
      state.selectedProduct;

    if (!product) {
      return;
    }


    const price =
      state.selectedSku &&
      state.selectedSku.price != null

        ? Number(state.selectedSku.price)

        : Number(product.price || 0);


    modalPrice.textContent =
      "$" + price.toFixed(2);


    if (
      state.selectedSku &&
      state.selectedSku.image
    ) {

      modalImage.src =
        imageUrl(state.selectedSku.image);

    }

  }


  /* Variants */

  function renderVariants() {

    variantContainer.innerHTML = "";


    const product =
      state.selectedProduct;


    const skus =
      Array.isArray(product.skus)
        ? product.skus
        : [];


    if (skus.length <= 1) {
      return;
    }


    const label =
      document.createElement("div");

    label.className =
      "variant-label";

    label.textContent =
      "Choose an option";


    const select =
      document.createElement("select");

    select.className =
      "variant-select";


    skus.forEach((sku, index) => {

      const option =
        document.createElement("option");

      option.value = index;

      option.textContent =
        sku.variant_name ||
        sku.sku_attr ||
        sku.variant_key ||
        ("Option " + (index + 1));


      select.appendChild(option);

    });


    select.addEventListener(
      "change",
      () => {

        state.selectedSku =
          skus[
            Number(select.value)
          ];

        updateModalPrice();

      }
    );


    variantContainer.appendChild(label);
    variantContainer.appendChild(select);
  }


  /* Close product */

  function closeProduct() {

    productModal.classList.remove("open");

    document.body.style.overflow = "";
  }


  /* Cart */

  function saveCart() {

    localStorage.setItem(
      "prasun_cart",
      JSON.stringify(state.cart)
    );

    updateCart();
  }


  function addToCart() {

    const product =
      state.selectedProduct;

    if (!product) {
      return;
    }


    const sku =
      state.selectedSku;


    const skuId =
      sku?.variant_key ||
      sku?.sku_id ||
      "default";


    const id =
      product.product_id +
      ":" +
      skuId;


    const existing =
      state.cart.find(
        item => item.id === id
      );


    if (existing) {

      existing.quantity += 1;

    } else {

      state.cart.push({

        id,

        product_id:
          product.product_id,

        title:
          product.title,

        image:
          sku?.image ||
          product.main_image ||
          (
            Array.isArray(product.images)
              ? product.images[0]
              : ""
          ),

        price:
          sku?.price != null
            ? Number(sku.price)
            : Number(product.price || 0),

        variant:
          sku?.variant_name ||
          sku?.sku_attr ||
          "",

        quantity: 1

      });

    }


    saveCart();

    closeProduct();

    showToast("Added to cart");

  }


  function updateCart() {

    const count =
      state.cart.reduce(
        (total, item) =>
          total + Number(item.quantity || 0),
        0
      );


    document.getElementById(
      "cartCount"
    ).textContent = count;


    renderCart();
  }


  function renderCart() {

    const container =
      document.getElementById("cartItems");


    if (!state.cart.length) {

      container.innerHTML = `
        <div class="message">
          Your cart is empty.
        </div>
      `;

      document.getElementById(
        "cartSubtotal"
      ).textContent = "$0.00";

      return;
    }


    container.innerHTML = "";


    let subtotal = 0;


    state.cart.forEach(item => {

      subtotal +=
        Number(item.price) *
        Number(item.quantity);


      const row =
        document.createElement("div");

      row.className =
        "cart-item";


      row.innerHTML = `

        <img
          src="${escapeHtml(imageUrl(item.image))}"
          alt="${escapeHtml(item.title)}"
        >

        <div class="cart-item-info">

          <div class="cart-item-title">
            ${escapeHtml(item.title)}
          </div>

          ${
            item.variant
              ? `
                <div class="stock">
                  ${escapeHtml(item.variant)}
                </div>
              `
              : ""
          }

          <div class="cart-item-price">
            $${Number(item.price).toFixed(2)}
          </div>

          <div class="quantity">

            <button
              onclick="changeQuantity('${escapeHtml(item.id)}', -1)"
            >
              −
            </button>

            <span>${item.quantity}</span>

            <button
              onclick="changeQuantity('${escapeHtml(item.id)}', 1)"
            >
              +
            </button>

          </div>

          <button
            class="remove"
            onclick="removeCartItem('${escapeHtml(item.id)}')"
          >
            Remove
          </button>

        </div>

      `;


      container.appendChild(row);

    });


    document.getElementById(
      "cartSubtotal"
    ).textContent =
      "$" + subtotal.toFixed(2);
  }


  function changeQuantity(id, change) {

    const item =
      state.cart.find(
        item => item.id === id
      );


    if (!item) {
      return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

      state.cart =
        state.cart.filter(
          item => item.id !== id
        );

    }


    saveCart();
  }


  function removeCartItem(id) {

    state.cart =
      state.cart.filter(
        item => item.id !== id
      );


    saveCart();
  }


  /* Toast */

  let toastTimer;


  function showToast(text) {

    const toast =
      document.getElementById("toast");


    toast.textContent = text;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
      setTimeout(
        () => toast.classList.remove("show"),
        2200
      );
  }


  /* Search */

  function doSearch() {

    state.search =
      document.getElementById(
        "searchInput"
      ).value.trim();


    applyFilters();

    document.getElementById(
      "products"
    ).scrollIntoView({
      behavior: "smooth"
    });
  }


  document.getElementById(
    "searchButton"
  ).addEventListener(
    "click",
    doSearch
  );


  document.getElementById(
    "searchInput"
  ).addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        doSearch();
      }

    }
  );


  /* Categories */

  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".category")
            .forEach(
              item =>
                item.classList.remove("active")
            );


          button.classList.add("active");


          state.category =
            button.dataset.category || "";


          applyFilters();

        }
      );

    });


  /* Sorting */

  document.getElementById(
    "sortSelect"
  ).addEventListener(
    "change",
    event => {

      state.sort =
        event.target.value;

      applyFilters();

    }
  );


  /* Product modal */

  document.getElementById(
    "modalClose"
  ).addEventListener(
    "click",
    closeProduct
  );


  productModal.addEventListener(
    "click",
    event => {

      if (event.target === productModal) {
        closeProduct();
      }

    }
  );


  document.getElementById(
    "addToCartButton"
  ).addEventListener(
    "click",
    addToCart
  );


  /* Cart */

  document.getElementById(
    "cartButton"
  ).addEventListener(
    "click",
    () => cart.classList.add("open")
  );


  document.getElementById(
    "cartClose"
  ).addEventListener(
    "click",
    () => cart.classList.remove("open")
  );


  cart.addEventListener(
    "click",
    event => {

      if (event.target === cart) {
        cart.classList.remove("open");
      }

    }
  );


  /*
    Checkout

    Your current Worker does not contain
    an order/checkout endpoint.

    Therefore this does NOT pretend to process
    an order.

    Add your real checkout URL here later.
  */

  const CHECKOUT_URL = "";


  document.getElementById(
    "checkoutButton"
  ).addEventListener(
    "click",
    () => {

      if (CHECKOUT_URL) {

        window.location.href =
          CHECKOUT_URL;

      } else {

        showToast(
          "Checkout is not connected yet."
        );

      }

    }
  );


  /* Keyboard */

  document.addEventListener(
    "keydown",
    event => {

      if (event.key === "Escape") {

        closeProduct();

        cart.classList.remove("open");

      }

    }
  );


  /* Initial */

  updateCart();

  loadProducts();

</script>

</body>
</html>
